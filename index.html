function PrintableTrip({ trip, order, client, company, onClose }) {
  const [gen, setGen] = useState({ status: 'generating', error: null, images: [], pdfUrl: null, fileName: '' });

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        await new Promise(r => setTimeout(r, 60));
        const page = document.getElementById('pdf-trip-page');
        if (!page) throw new Error('No se encontró el contenido del viaje.');

        const canvas = await html2canvas(page, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
        if (cancelled) return;

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'letter' });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        const ratio = Math.min(pageW / canvas.width, pageH / canvas.height);
        const w = canvas.width * ratio;
        const h = canvas.height * ratio;
        pdf.addImage(imgData, 'JPEG', (pageW - w) / 2, 0, w, h);

        const blob = pdf.output('blob');
        const url = URL.createObjectURL(blob);
        const fileName = `viaje-${String(trip.id).replace(/[^\w-]+/g, '_')}.pdf`;

        if (!cancelled) {
          setGen({ status: 'ready', error: null, images: [canvas.toDataURL('image/png')], pdfUrl: url, fileName });
        }
      } catch (e) {
        if (!cancelled) setGen(s => ({ ...s, status: 'error', error: e.message || String(e) }));
      }
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => () => { if (gen.pdfUrl) URL.revokeObjectURL(gen.pdfUrl); }, [gen.pdfUrl]);

  const handleDownload = () => {
    if (!gen.pdfUrl) return;
    const a = document.createElement('a');
    a.href = gen.pdfUrl;
    a.download = gen.fileName || 'viaje.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

        const canvas = await html2canvas(page, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'letter' });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();

        // Contenido puede ser más alto que una sola página (si hay muchos registros) —
        // lo dividimos en tantas páginas de PDF como haga falta, automáticamente.
        const imgWidthPt = pageW;
        const imgHeightPt = (canvas.height * imgWidthPt) / canvas.width;
        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        let heightLeft = imgHeightPt;
        let position = 0;
        const pageImages = [];

        pdf.addImage(imgData, 'JPEG', 0, position, imgWidthPt, imgHeightPt);
        heightLeft -= pageH;
        while (heightLeft > -1) {
          position = heightLeft - imgHeightPt;
          pdf.addPage();
          pdf.addImage(imgData, 'JPEG', 0, position, imgWidthPt, imgHeightPt);
          heightLeft -= pageH;
        }

        const blob = pdf.output('blob');
        const url = URL.createObjectURL(blob);
        const fileName = `reporte-${title.toLowerCase().replace(/[^\w]+/g, '_')}-${todayStr()}.pdf`;

        if (!cancelled) {
          setGen({ status: 'ready', error: null, images: [canvas.toDataURL('image/png')], pdfUrl: url, fileName });

        if (!cancelled) setGen(s => ({ ...s, status: 'error', error: e.message || String(e) }));

    })();
    return () => { cancelled = true; };
  }, []);

        <div style={{ background: '#1C1B19', border: '1px solid #333330', borderRadius: 8, width: '100%', maxWidth: 820, maxHeight: '92vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

              <FileText size={18} /> Vista Previa
            </div>
            <div style={{ display: 'flex', gap: 8 }}>

            </div>

          <div style={{ flex: 1, overflowY: 'auto', padding: 16, background: '#0F0E0D' }}>

            ))}

        <div id="pdf-summary-page" style={{ fontFamily: "'Inter', Arial, sans-serif", color: '#1A1A1A', background: '#fff', maxWidth: 780, margin: '0 auto' }}>

        const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });

        // Hoja 1: Libro de Bancos (horizontal) — se reparte en tantas páginas
        // horizontales como haga falta según cuántos movimientos tenga el mes.
        let pageW = pdf.internal.pageSize.getWidth();
        let pageH = pdf.internal.pageSize.getHeight();
        const imgWidthPt = pageW;
        const imgHeightPt = (canvasLibro.height * imgWidthPt) / canvasLibro.width;
        const imgDataLibro = canvasLibro.toDataURL('image/jpeg', 0.92);
        let heightLeft = imgHeightPt;
        let position = 0;
        pdf.addImage(imgDataLibro, 'JPEG', 0, position, imgWidthPt, imgHeightPt);
        heightLeft -= pageH;
        while (heightLeft > -1) {
          position = heightLeft - imgHeightPt;
          pdf.addPage('letter', 'landscape');
          pdf.addImage(imgDataLibro, 'JPEG', 0, position, imgWidthPt, imgHeightPt);
          heightLeft -= pageH;
        }

        // Hoja 2: resumen de conciliación (vertical), como en el Excel original.
        pdf.addPage('letter', 'portrait');
        pageW = pdf.internal.pageSize.getWidth();
        pageH = pdf.internal.pageSize.getHeight();
        const imgDataResumen = canvasResumen.toDataURL('image/jpeg', 0.92);
        const ratio = Math.min(pageW / canvasResumen.width, pageH / canvasResumen.height);
        const w = canvasResumen.width * ratio;
        const h = canvasResumen.height * ratio;
        pdf.addImage(imgDataResumen, 'JPEG', (pageW - w) / 2, 0, w, h);

        const blob = pdf.output('blob');
        const url = URL.createObjectURL(blob);
        const fileName = `conciliacion-bancaria-${(periodoLabel || todayStr()).replace(/[^\w-]+/g, '_')}.pdf`;

        if (!cancelled) {
          setGen({ status: 'ready', error: null, images: [canvasLibro.toDataURL('image/png'), canvasResumen.toDataURL('image/png')], pdfUrl: url, fileName });
        }
      } catch (e) {
        if (!cancelled) setGen(s => ({ ...s, status: 'error', error: e.message || String(e) }));
      }
    })();
    return () => { cancelled = true; };
  }, []);

function Despachos({ data, setData, username }) {
  const remainingByOrder = (order) => {
    const assignedNow = Object.values(data.dispatches)
      .filter(d => d.orderId === order.id)
      .reduce((s, d) => s + (d.volumeM3 != null ? d.volumeM3 : order.volumeM3), 0);
    const delivered = data.trips
      .filter(t => t.orderId === order.id)
      .reduce((s, t) => s + (t.volumeM3 || 0), 0);
    return +(order.volumeM3 - assignedNow - delivered).toFixed(2);
  };

  const pendingOrders = data.orders
    .filter(o => o.status !== 'entregado')
    .map(o => ({ ...o, remaining: remainingByOrder(o) }))
    .filter(o => o.remaining > 0.01);

  const [editingUnit, setEditingUnit] = useState(null);
  const [nameInput, setNameInput] = useState('');
  const [assignSel, setAssignSel] = useState({}); // { [unitId]: { orderId, volume } } — mientras se elige, sin confirmar
  const [assignError, setAssignError] = useState({});
  const [editingDispatch, setEditingDispatch] = useState(null); // unitId cuya asignación ya despachada se está editando
  const [editingTripId, setEditingTripId] = useState(null);
  const [tripDraft, setTripDraft] = useState({ orderId: '', volumeM3: '' });
  const [printingTripId, setPrintingTripId] = useState(null);

  const startEdit = (u) => { setEditingUnit(u.id); setNameInput(unitLabel(u)); };
  const saveEdit = (unitId) => { renameUnit(unitId, nameInput.trim()); setEditingUnit(null); setNameInput(''); };

  const startAssignDraft = (unitId, orderId) => {
    const order = pendingOrders.find(o => o.id === orderId);
    const suggested = order ? Math.min(order.remaining, 7) : '';
    setAssignSel(s => ({ ...s, [unitId]: { orderId, volume: String(suggested) } }));
    setAssignError(e => ({ ...e, [unitId]: '' }));
  };
  const cancelDraft = (unitId) => {
    setAssignSel(s => { const n = { ...s }; delete n[unitId]; return n; });
    setAssignError(e => ({ ...e, [unitId]: '' }));
  };

  const confirmAssign = (unitId) => {
    const sel = assignSel[unitId];
    if (!sel || !sel.orderId) return;
    const order = pendingOrders.find(o => o.id === sel.orderId);
    const vol = parseFloat(sel.volume);
    if (!order) { setAssignError(e => ({ ...e, [unitId]: 'Selecciona una orden.' })); return; }
    if (isNaN(vol) || vol <= 0) { setAssignError(e => ({ ...e, [unitId]: 'Indica un volumen válido.' })); return; }
    if (vol > order.remaining + 0.001) { setAssignError(e => ({ ...e, [unitId]: `Esa orden solo tiene ${order.remaining} m³ sin asignar.` })); return; }

    setData(d => {
      const unit = d.fleet.find(u => u.id === unitId);
      const firstStatus = unit.type === 'bomba' ? 'en servicio' : 'cargando';
      return {
        ...d,
        dispatches: { ...d.dispatches, [unitId]: { orderId: sel.orderId, volumeM3: +vol.toFixed(2), status: firstStatus, since: Date.now() } },
      };
    });
    cancelDraft(unitId);
  };

  // Se puede editar o cancelar una asignación en cualquier etapa, para poder corregir
  // un error aunque el camión ya haya salido.
  const canModify = (unitId) => !!data.dispatches[unitId];

  const startEditAssign = (unitId) => {
    const disp = data.dispatches[unitId];
    if (!disp) return;
    setAssignSel(s => ({ ...s, [unitId]: { orderId: disp.orderId, volume: String(disp.volumeM3 != null ? disp.volumeM3 : '') } }));
    setEditingDispatch(unitId);
    setAssignError(e => ({ ...e, [unitId]: '' }));
  };
  const cancelEditAssign = (unitId) => { setEditingDispatch(null); cancelDraft(unitId); };

  const confirmEditAssign = (unitId) => {
    const sel = assignSel[unitId];
    const disp = data.dispatches[unitId];
    if (!sel || !disp) return;
    const order = data.orders.find(o => o.id === sel.orderId);
    const vol = parseFloat(sel.volume);
    if (!order) { setAssignError(e => ({ ...e, [unitId]: 'Selecciona una orden.' })); return; }
    if (isNaN(vol) || vol <= 0) { setAssignError(e => ({ ...e, [unitId]: 'Indica un volumen válido.' })); return; }
    // Al editar, esta unidad recupera temporalmente su propia reserva para calcular el máximo disponible
    const currentReserved = disp.orderId === sel.orderId ? (disp.volumeM3 != null ? disp.volumeM3 : order.volumeM3) : 0;
    const available = +(remainingByOrder(order) + currentReserved).toFixed(2);
    if (vol > available + 0.001) { setAssignError(e => ({ ...e, [unitId]: `Esa orden solo tiene ${available} m³ disponibles.` })); return; }

    setData(d => ({
      ...d,
      dispatches: { ...d.dispatches, [unitId]: { ...d.dispatches[unitId], orderId: sel.orderId, volumeM3: +vol.toFixed(2) } },
    }));
    setEditingDispatch(null);
    cancelDraft(unitId);
  };

  const cancelAssignment = (unitId) => {
    if (!window.confirm('¿Cancelar esta asignación? El volumen vuelve a quedar disponible para asignarlo a otra unidad.')) return;
    setData(d => {
      const rest = { ...d.dispatches };
      delete rest[unitId];
      return { ...d, dispatches: rest };
    });
  };

  const advance = (unitId) => setData(d => {
    const disp = d.dispatches[unitId]; if (!disp) return d;
    const unit = d.fleet.find(u => u.id === unitId); if (!unit) return d;
    const orderId = disp.orderId;
    const next = FLOW[unit.type][disp.status];

    // Camión pasando de "cargando" a "en ruta": registra la hora exacta de salida de planta.
    if (unit.type === 'camion' && disp.status === 'cargando' && next === 'en ruta') {
      return { ...d, dispatches: { ...d.dispatches, [unitId]: { ...disp, status: next, salida: Date.now() } } };
    }

    if (!next) {
      // Última etapa (entregado / en servicio): registra la llegada y archiva el viaje completo.
      const llegada = Date.now();
      const ord = d.orders.find(o => o.id === orderId);
      const tripVolume = disp.volumeM3 != null ? disp.volumeM3 : (ord ? ord.volumeM3 : null);
      const trip = {
        id: `V-${Date.now()}`,
        unitId, unitName: unitLabel(unit), tipo: unit.type,
        orderId, volumeM3: tripVolume,
        asignacion: disp.since, salida: disp.salida || null, llegada,
      };
      const rest = { ...d.dispatches }; delete rest[unitId];

      // Solo marca la orden como "entregado" si, con este viaje, ya no queda volumen
      // pendiente por asignar ni por entregar en otras unidades.
      let orders = d.orders;
      if (ord) {
        const otherReserved = Object.values(rest)
          .filter(dd => dd.orderId === orderId)
          .reduce((s, dd) => s + (dd.volumeM3 != null ? dd.volumeM3 : ord.volumeM3), 0);
        const deliveredTotal = [...d.trips, trip].filter(t => t.orderId === orderId).reduce((s, t) => s + (t.volumeM3 || 0), 0);
        const remaining = +(ord.volumeM3 - otherReserved - deliveredTotal).toFixed(2);
        if (remaining <= 0.01) {
          orders = d.orders.map(o => o.id === orderId ? { ...o, status: 'entregado' } : o);
        }
      }

      return { ...d, dispatches: rest, trips: [...d.trips, trip], orders };
    }
    return { ...d, dispatches: { ...d.dispatches, [unitId]: { ...disp, status: next } } };
  });

  const addUnit = (type) => setData(d => {
    const num = type === 'camion' ? d.nextCamionNum : d.nextBombaNum;
    const name = type === 'bomba' ? `Bomba ${String(num).padStart(2, '0')}` : `Unidad ${String(num).padStart(2, '0')}`;
    const unit = { id: `u${Date.now()}`, type, num, name };
    return {
      ...d,
      fleet: [...d.fleet, unit],
      nextCamionNum: type === 'camion' ? d.nextCamionNum + 1 : d.nextCamionNum,
      nextBombaNum: type === 'bomba' ? d.nextBombaNum + 1 : d.nextBombaNum,
    };
  });

  const renameUnit = (unitId, name) => setData(d => ({
    ...d, fleet: d.fleet.map(u => u.id === unitId ? { ...u, name } : u),
  }));

  const removeUnit = (unitId) => setData(d => {
    const rest = { ...d.dispatches }; delete rest[unitId];
    return { ...d, fleet: d.fleet.filter(u => u.id !== unitId), dispatches: rest };
  });

  // Después de editar o borrar un viaje, la orden afectada puede volver a tener volumen
  // pendiente — esto revisa y corrige su estado para que vuelva a aparecer disponible.
  const recomputeOrderStatus = (d, orderId) => {
    if (!orderId) return d.orders;
    const ord = d.orders.find(o => o.id === orderId);
    if (!ord) return d.orders;
    const reserved = Object.values(d.dispatches).filter(dd => dd.orderId === orderId).reduce((s, dd) => s + (dd.volumeM3 != null ? dd.volumeM3 : ord.volumeM3), 0);
    const delivered = d.trips.filter(t => t.orderId === orderId).reduce((s, t) => s + (t.volumeM3 || 0), 0);
    const remaining = +(ord.volumeM3 - reserved - delivered).toFixed(2);
    const newStatus = remaining <= 0.01 ? 'entregado' : (ord.status === 'entregado' ? 'producido' : ord.status);
    if (newStatus === ord.status) return d.orders;
    return d.orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o);
  };

  const startEditTrip = (t) => {
    setEditingTripId(t.id);
    setTripDraft({ orderId: t.orderId || '', volumeM3: t.volumeM3 != null ? String(t.volumeM3) : '' });
  };
  const cancelEditTrip = () => { setEditingTripId(null); setTripDraft({ orderId: '', volumeM3: '' }); };

  const saveEditTrip = (tripId) => {
    const vol = parseFloat(tripDraft.volumeM3);
    if (isNaN(vol) || vol < 0) return;
    setData(d => {
      const oldTrip = d.trips.find(t => t.id === tripId);
      const newOrderId = tripDraft.orderId.trim() || null;
      const trips = d.trips.map(t => t.id === tripId ? { ...t, orderId: newOrderId, volumeM3: +vol.toFixed(2) } : t);
      let orders = recomputeOrderStatus({ ...d, trips }, oldTrip ? oldTrip.orderId : null);
      orders = recomputeOrderStatus({ ...d, trips, orders }, newOrderId);
      return { ...d, trips, orders };
    });
    logAudit(setData, username, 'Viaje de despacho editado', tripId);
    cancelEditTrip();
  };

  const deleteTrip = (t) => {
    if (!window.confirm(`¿Eliminar este viaje (${t.unitName} · ${t.orderId || '—'})? Se puede recuperar desde la Papelera.`)) return;
    setData(d => {
      const trips = d.trips.filter(x => x.id !== t.id);
      const orders = recomputeOrderStatus({ ...d, trips }, t.orderId);
      return { ...d, trips, orders };
    });
    moveToTrash(setData, username, 'viaje', t, `${t.unitName} · ${t.orderId || '—'} · ${t.volumeM3 || 0} m³`);
  };

  return (
    <div>
      <Eyebrow>Flotilla · {data.fleet.filter(u => u.type === 'camion').length} mixers · {data.fleet.filter(u => u.type === 'bomba').length} bomba(s)</Eyebrow>
      <H1>Despachos</H1>
      <div style={{ fontSize: 12, color: '#A39D93', marginTop: 6 }}>
        Puedes asignar solo una parte del volumen de una orden a cada unidad — el resto queda disponible para asignarlo a otra.
      </div>

      <Card style={{ marginTop: 16, display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
        <span style={{ fontSize: 12, fontWeight: 600, color: '#B9B4A8', marginRight: 4 }}>¿Compraron equipo nuevo?</span>
        <Btn variant="ghost" onClick={() => addUnit('camion')}><Truck size={14} /> Agregar camión mixer</Btn>
        <Btn variant="ghost" onClick={() => addUnit('bomba')}><PumpIcon size={14} /> Agregar camión-bomba</Btn>
      </Card>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 12, marginTop: 16 }}>
        {data.fleet.map(u => {
          const disp = data.dispatches[u.id]; const status = disp ? disp.status : 'disponible';
          const order = disp && data.orders.find(o => o.id === disp.orderId);
          const UIcon = u.type === 'bomba' ? PumpIcon : Truck;
          const draft = assignSel[u.id];
          return (
            <Card key={u.id}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 6 }}>
                {editingUnit === u.id ? (
                  <div style={{ display: 'flex', gap: 4, flex: 1 }}>
                    <input autoFocus style={{ ...inputStyle, fontSize: 13, padding: '5px 8px' }} value={nameInput}
                      onChange={e => setNameInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && saveEdit(u.id)} />
                    <Btn variant="accent" onClick={() => saveEdit(u.id)} style={{ padding: '5px 8px' }}><Check size={13} /></Btn>
                    <Btn variant="ghost" onClick={() => setEditingUnit(null)} style={{ padding: '5px 8px' }}><X size={13} /></Btn>
                  </div>
                ) : (
                  <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 900, fontSize: 22, color: '#F2F0EB', display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}
                       onClick={() => startEdit(u)} title="Editar nombre">
                    {unitLabel(u)}
                  </div>
                )}
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <UIcon size={20} color={STATUS_COLORS[status]} />
                  {status === 'disponible' && (
                    <button onClick={() => removeUnit(u.id)} title="Quitar unidad" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}>
                      <Trash2 size={14} />
                    </button>
                  )}
                </div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 6, marginBottom: 12 }}>
                <span style={{ width: 8, height: 8, borderRadius: '50%', background: STATUS_COLORS[status] }} />
                <span style={{ fontSize: 12, textTransform: 'capitalize', color: '#B9B4A8' }}>{status}</span>
              </div>
              {order && editingDispatch !== u.id && (
                <div style={{ fontSize: 12, color: '#B9B4A8', marginBottom: 10, fontFamily: "'IBM Plex Mono', monospace" }}>
                  {order.id} · {disp.volumeM3 != null ? disp.volumeM3 : order.volumeM3} m³ · {order.recipeName}
                  {disp && disp.salida && <div>salió: {new Date(disp.salida).toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit' })}</div>}
                </div>
              )}

              {!disp && (
                draft ? (
                  <div>
                    <Field label="Orden">
                      <select style={inputStyle} value={draft.orderId} onChange={e => setAssignSel(s => ({ ...s, [u.id]: { ...s[u.id], orderId: e.target.value } }))}>
                        {pendingOrders.map(o => <option key={o.id} value={o.id}>{o.id} · {o.remaining} m³ restantes</option>)}
                      </select>
                    </Field>
                    <Field label="Volumen a llevar (m³)">
                      <input type="number" min="0" step="0.5" style={inputStyle} value={draft.volume} onChange={e => setAssignSel(s => ({ ...s, [u.id]: { ...s[u.id], volume: e.target.value } }))} />
                    </Field>
                    {assignError[u.id] && <div style={{ color: '#B54834', fontSize: 11, marginBottom: 8 }}>{assignError[u.id]}</div>}
                    <div style={{ display: 'flex', gap: 6 }}>
                      <Btn variant="accent" onClick={() => confirmAssign(u.id)} style={{ flex: 1, justifyContent: 'center', padding: '6px 10px', fontSize: 12 }}><Check size={13} /> Asignar</Btn>
                      <Btn variant="ghost" onClick={() => cancelDraft(u.id)} style={{ padding: '6px 10px', fontSize: 12 }}>Cancelar</Btn>
                    </div>
                  </div>
                ) : (
                  <select style={inputStyle} defaultValue="" onChange={e => e.target.value && startAssignDraft(u.id, e.target.value)}>
                    <option value="">Asignar orden…</option>
                    {pendingOrders.map(o => <option key={o.id} value={o.id}>{o.id} · {o.remaining} m³ restantes</option>)}
                  </select>
                )
              )}

              {disp && editingDispatch === u.id && (
                <div>
                  <Field label="Orden">
                    <select style={inputStyle} value={draft ? draft.orderId : disp.orderId} onChange={e => setAssignSel(s => ({ ...s, [u.id]: { ...(s[u.id] || {}), orderId: e.target.value } }))}>
                      {[order, ...pendingOrders.filter(o => o.id !== disp.orderId)].filter(Boolean).map(o => <option key={o.id} value={o.id}>{o.id}</option>)}
                    </select>
                  </Field>
                  <Field label="Volumen (m³)">
                    <input type="number" min="0" step="0.5" style={inputStyle} value={draft ? draft.volume : ''} onChange={e => setAssignSel(s => ({ ...s, [u.id]: { ...(s[u.id] || { orderId: disp.orderId }), volume: e.target.value } }))} />
                  </Field>
                  {assignError[u.id] && <div style={{ color: '#B54834', fontSize: 11, marginBottom: 8 }}>{assignError[u.id]}</div>}
                  <div style={{ display: 'flex', gap: 6 }}>
                    <Btn variant="accent" onClick={() => confirmEditAssign(u.id)} style={{ flex: 1, justifyContent: 'center', padding: '6px 10px', fontSize: 12 }}><Check size={13} /> Guardar</Btn>
                    <Btn variant="ghost" onClick={() => cancelEditAssign(u.id)} style={{ padding: '6px 10px', fontSize: 12 }}>Cancelar</Btn>
                  </div>
                </div>
              )}

              {disp && editingDispatch !== u.id && (
                <>
                  <Btn variant="ghost" onClick={() => advance(u.id)} style={{ width: '100%', justifyContent: 'center', marginBottom: canModify(u.id) ? 6 : 0 }}>
                    {status === FINAL_STATUS[u.type] ? 'Liberar unidad' : `Marcar: ${FLOW[u.type][status]}`}
                    <ChevronRight size={14} />
                  </Btn>
                  {canModify(u.id) && (
                    <div style={{ display: 'flex', gap: 6 }}>
                      <Btn variant="ghost" onClick={() => startEditAssign(u.id)} style={{ flex: 1, justifyContent: 'center', padding: '6px 8px', fontSize: 12 }}><Pencil size={12} /> Editar</Btn>
                      <Btn variant="ghost" onClick={() => cancelAssignment(u.id)} style={{ flex: 1, justifyContent: 'center', padding: '6px 8px', fontSize: 12, borderColor: '#6B3226', color: '#B54834' }}><Trash2 size={12} /> Cancelar</Btn>
                    </div>
                  )}
                </>
              )}
            </Card>
          );
        })}
      </div>
      {pendingOrders.length === 0 && <div style={{ marginTop: 16, fontSize: 13, color: '#A39D93' }}>No hay órdenes producidas pendientes de despacho. Registra una en la pestaña Producción.</div>}

      <Card style={{ marginTop: 20 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Historial de viajes</div>
        {data.trips.length === 0 && <div style={{ color: '#A39D93', fontSize: 13 }}>Aún no hay viajes completados. Aparecen aquí cuando liberas una unidad.</div>}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {[...data.trips].reverse().slice(0, 20).map(t => {
            const fmt = (ms) => ms ? new Date(ms).toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit' }) : '—';
            const fmtDate = (ms) => ms ? new Date(ms).toLocaleDateString('es-GT') : '';
            const durMin = t.salida && t.llegada ? Math.round((t.llegada - t.salida) / 60000) : null;

            if (editingTripId === t.id) {
              return (
                <div key={t.id} style={{ borderBottom: '1px solid #333330', paddingBottom: 10 }}>
                  <div style={{ fontSize: 12, color: '#B9B4A8', marginBottom: 6 }}>{t.unitName}</div>
                  <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 500 ? '1fr 1fr' : '1fr', gap: 8 }}>
                    <Field label="Orden">
                      <input style={inputStyle} value={tripDraft.orderId} onChange={e => setTripDraft(f => ({ ...f, orderId: e.target.value }))} placeholder="ej. OP-0001" />
                    </Field>
                    <Field label="Volumen (m³)">
                      <input type="number" min="0" step="0.5" style={inputStyle} value={tripDraft.volumeM3} onChange={e => setTripDraft(f => ({ ...f, volumeM3: e.target.value }))} />
                    </Field>
                  </div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <Btn variant="accent" onClick={() => saveEditTrip(t.id)} style={{ padding: '6px 10px', fontSize: 12 }}><Check size={13} /> Guardar</Btn>
                    <Btn variant="ghost" onClick={cancelEditTrip} style={{ padding: '6px 10px', fontSize: 12 }}>Cancelar</Btn>
                  </div>
                </div>
              );
            }

            return (
              <div key={t.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #333330', paddingBottom: 8, flexWrap: 'wrap', gap: 4 }}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13, color: '#F2F0EB' }}>{t.unitName} · {t.orderId || '—'}</div>
                  <div style={{ fontSize: 11, color: '#A39D93' }}>{fmtDate(t.llegada)}{t.volumeM3 ? ` · ${t.volumeM3} m³` : ''}</div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{ fontSize: 11, color: '#B9B4A8', fontFamily: "'IBM Plex Mono', monospace", textAlign: 'right' }}>
                    {t.tipo === 'camion'
                      ? <>salió {fmt(t.salida)} · llegó {fmt(t.llegada)}{durMin != null ? ` · ${durMin} min` : ''}</>
                      : <>inicio {fmt(t.asignacion)} · fin {fmt(t.llegada)}</>}
                  </div>
                  <button onClick={() => setPrintingTripId(t.id)} title="Imprimir / PDF" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#07E55E' }}><FileText size={14} /></button>
                  <button onClick={() => startEditTrip(t)} title="Editar viaje" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B9B4A8' }}><Pencil size={14} /></button>
                  <button onClick={() => deleteTrip(t)} title="Eliminar viaje" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={14} /></button>
                </div>
              </div>
            );
          })}
        </div>
      </Card>

      {printingTripId && (() => {
        const trip = data.trips.find(t => t.id === printingTripId);
        const order = trip ? data.orders.find(o => o.id === trip.orderId) : null;
        const client = order ? data.clients.find(c => c.id === order.clientId) : null;
        return (
          <PrintableTrip
            trip={trip}
            order={order}
            client={client}
            company={data.company}
            onClose={() => setPrintingTripId(null)}
          />
        );
      })()}
    </div>
  );
}

function Mantenimiento({ data, setData }) {
  const empty = { unitId: data.fleet[0]?.id || '', fecha: todayStr(), tipo: 'Preventivo', descripcion: '', taller: '', costo: '', kilometraje: '', proximaFecha: '' };
  const [form, setForm] = useState(empty);
  const [error, setError] = useState('');

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  const add = () => {
    if (!form.unitId) { setError('Selecciona una unidad.'); return; }
    if (!form.descripcion.trim()) { setError('Describe el trabajo realizado.'); return; }
    const id = `MT-${String(data.nextMaintNum).padStart(4, '0')}`;
    setData(d => ({
      ...d,
      nextMaintNum: d.nextMaintNum + 1,
      maintenance: [...d.maintenance, {
        id, unitId: form.unitId, fecha: form.fecha, tipo: form.tipo, descripcion: form.descripcion.trim(),
        taller: form.taller.trim(), costo: form.costo ? parseFloat(form.costo) : null,
        kilometraje: form.kilometraje ? parseFloat(form.kilometraje) : null, proximaFecha: form.proximaFecha || null,
      }],
    }));
    setForm({ ...empty, unitId: form.unitId });
    setError('');
  };

  const remove = (id) => setData(d => ({ ...d, maintenance: d.maintenance.filter(m => m.id !== id) }));

  const today = todayStr();
  const in7days = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
  const dueSoon = data.maintenance.filter(m => m.proximaFecha && m.proximaFecha <= in7days);
  const unitName = (id) => { const u = data.fleet.find(u => u.id === id); return u ? unitLabel(u) : '—'; };

  return (
    <div>
      <Eyebrow>Control mecánico</Eyebrow>
      <H1>Mantenimiento</H1>

      {dueSoon.length > 0 && (
        <Card style={{ marginTop: 16, borderColor: '#6B3226', background: '#241511' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: '#B54834', fontWeight: 700, fontSize: 13, marginBottom: 6 }}>
            <AlertTriangle size={15} /> Próximos servicios (7 días o vencidos)
          </div>
          {dueSoon.map(m => (
            <div key={m.id} style={{ fontSize: 12, color: '#B9B4A8' }}>
              {unitName(m.unitId)} · {m.descripcion} · próximo: {m.proximaFecha} {m.proximaFecha < today ? '(vencido)' : ''}
            </div>
          ))}
        </Card>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 800 ? '1fr 1.4fr' : '1fr', gap: 16, marginTop: 16 }}>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Nuevo registro</div>
          <Field label="Unidad">
            <select style={inputStyle} value={form.unitId} onChange={set('unitId')}>
              {data.fleet.map(u => <option key={u.id} value={u.id}>{unitLabel(u)}</option>)}
            </select>
          </Field>
          <Field label="Fecha">
            <input type="date" style={inputStyle} value={form.fecha} onChange={set('fecha')} />
          </Field>
          <Field label="Tipo de servicio">
            <select style={inputStyle} value={form.tipo} onChange={set('tipo')}>
              <option>Preventivo</option>
              <option>Correctivo</option>
              <option>Llantas</option>
              <option>Revisión</option>
            </select>
          </Field>
          <Field label="Descripción del trabajo">
            <input style={inputStyle} value={form.descripcion} onChange={set('descripcion')} placeholder="ej. cambio de aceite y filtros" />
          </Field>
          <Field label="Taller / mecánico">
            <input style={inputStyle} value={form.taller} onChange={set('taller')} />
          </Field>
          <Field label="Costo (opcional)">
            <input type="number" min="0" style={inputStyle} value={form.costo} onChange={set('costo')} placeholder="Q" />
          </Field>
          <Field label="Kilometraje / horas (opcional)">
            <input type="number" min="0" style={inputStyle} value={form.kilometraje} onChange={set('kilometraje')} />
          </Field>
          <Field label="Próximo servicio (opcional)">
            <input type="date" style={inputStyle} value={form.proximaFecha} onChange={set('proximaFecha')} />
          </Field>
          {error && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{error}</div>}
          <Btn variant="accent" onClick={add}><Plus size={14} /> Guardar registro</Btn>
        </Card>

        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Historial</div>
          {data.maintenance.length === 0 && <div style={{ color: '#A39D93', fontSize: 13 }}>Aún no hay registros de mantenimiento.</div>}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {[...data.maintenance].reverse().map(m => (
              <div key={m.id} style={{ border: '1px solid #333330', borderRadius: 4, padding: 12 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14, color: '#F2F0EB' }}>{unitName(m.unitId)} · {m.tipo}</div>
                    <div style={{ fontSize: 12, color: '#A39D93' }}>{m.fecha}{m.taller ? ` · ${m.taller}` : ''}</div>
                  </div>
                  <button onClick={() => remove(m.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={15} /></button>
                </div>
                <div style={{ fontSize: 12, color: '#B9B4A8', marginTop: 4 }}>{m.descripcion}</div>
                <div style={{ fontSize: 11, color: '#A39D93', marginTop: 4, fontFamily: "'IBM Plex Mono', monospace" }}>
                  {(() => {
                    const costoNum = m.costo != null && m.costo !== '' ? Number(m.costo) : null;
                    const kmNum = m.kilometraje != null && m.kilometraje !== '' ? Number(m.kilometraje) : null;
                    return <>
                      {costoNum != null && !isNaN(costoNum) ? `${fmtQ(costoNum)} · ` : ''}
                      {kmNum != null && !isNaN(kmNum) ? `${kmNum} km/hrs · ` : ''}
                      {m.proximaFecha ? `próximo: ${m.proximaFecha}` : ''}
                    </>;
                  })()}
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}

const CLIENT_ESTADOS = ['Prospecto', 'Cliente activo', 'Inactivo'];
const ESTADO_COLORS = { 'Prospecto': '#F2A900', 'Cliente activo': '#07E55E', 'Inactivo': '#A39D93' };

const CONTACT_TYPES = ['Llamada', 'WhatsApp', 'Email', 'Visita', 'Otro'];

function Clientes({ data, setData, username }) {
  const [form, setForm] = useState({ name: '', obra: '', ubicacion: '', telefono: '', estado: 'Prospecto' });
  const [expanded, setExpanded] = useState(null);
  const [noteText, setNoteText] = useState('');
  const [noteType, setNoteType] = useState('Llamada');
  const [nextDate, setNextDate] = useState('');

  const add = () => {
    if (!form.name.trim()) return;
    setData(d => ({
      ...d,
      clients: [...d.clients, { id: `c${Date.now()}`, name: form.name.trim(), obra: form.obra.trim(), ubicacion: form.ubicacion.trim(), telefono: form.telefono.trim(), estado: form.estado, seguimiento: [], proximoSeguimiento: null }],
    }));
    setForm({ name: '', obra: '', ubicacion: '', telefono: '', estado: 'Prospecto' });
  };
  const remove = (id) => {
    const c = data.clients.find(x => x.id === id);
    setData(d => ({ ...d, clients: d.clients.filter(c => c.id !== id) }));
    moveToTrash(setData, username, 'cliente', c, c ? c.name : id);
  };
  const setEstado = (id, estado) => setData(d => ({ ...d, clients: d.clients.map(c => c.id === id ? { ...c, estado } : c) }));
  const addNote = (id) => {
    if (!noteText.trim()) return;
    setData(d => ({
      ...d,
      clients: d.clients.map(c => c.id === id
        ? { ...c, seguimiento: [...(c.seguimiento || []), { fecha: todayStr(), tipo: noteType, nota: noteText.trim() }], proximoSeguimiento: nextDate || c.proximoSeguimiento }
        : c),
    }));
    setNoteText(''); setNextDate('');
  };
  const removeNote = (id, idx) => setData(d => ({
    ...d,
    clients: d.clients.map(c => c.id === id ? { ...c, seguimiento: c.seguimiento.filter((_, i) => i !== idx) } : c),
  }));
  const clearNextDate = (id) => setData(d => ({ ...d, clients: d.clients.map(c => c.id === id ? { ...c, proximoSeguimiento: null } : c) }));

  const statsFor = (id) => {
    const ords = data.orders.filter(o => o.clientId === id);
    const m3 = ords.reduce((s, o) => s + Number(o.volumeM3 || 0), 0);
    const ingreso = ords.reduce((s, o) => s + Number(o.ingreso || 0), 0);
    return { pedidos: ords.length, m3, ingreso };
  };

  const today = todayStr();
  const pendientesSeguimiento = data.clients.filter(c => c.proximoSeguimiento && c.proximoSeguimiento <= today);

  return (
    <div>
      <Eyebrow>Cartera y seguimiento</Eyebrow>
      <H1>Clientes</H1>

      {pendientesSeguimiento.length > 0 && (
        <Card style={{ marginTop: 16, borderColor: '#6B3226', background: '#241511' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: '#B54834', fontWeight: 700, fontSize: 13, marginBottom: 6 }}>
            <AlertTriangle size={15} /> Seguimiento pendiente
          </div>
          {pendientesSeguimiento.map(c => (
            <div key={c.id} style={{ fontSize: 12, color: '#B9B4A8' }}>{c.name} · programado para {c.proximoSeguimiento}</div>
          ))}
        </Card>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 800 ? '1fr 1.4fr' : '1fr', gap: 16, marginTop: 16 }}>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Nuevo cliente</div>
          <Field label="Nombre / empresa"><input style={inputStyle} value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></Field>
          <Field label="Obra / proyecto"><input style={inputStyle} value={form.obra} onChange={e => setForm(f => ({ ...f, obra: e.target.value }))} /></Field>
          <Field label="Ubicación (ej. Zunil, Quetzaltenango)"><input style={inputStyle} value={form.ubicacion} onChange={e => setForm(f => ({ ...f, ubicacion: e.target.value }))} /></Field>
          <Field label="Teléfono"><input style={inputStyle} value={form.telefono} onChange={e => setForm(f => ({ ...f, telefono: e.target.value }))} /></Field>
          <Field label="Estado">
            <select style={inputStyle} value={form.estado} onChange={e => setForm(f => ({ ...f, estado: e.target.value }))}>
              {CLIENT_ESTADOS.map(e => <option key={e} value={e}>{e}</option>)}
            </select>
          </Field>
          <Btn variant="accent" onClick={add}><Plus size={14} /> Agregar</Btn>
        </Card>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Clientes registrados</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {data.clients.map(c => {
              const stats = statsFor(c.id);
              const isOpen = expanded === c.id;
              return (
                <div key={c.id} style={{ border: '1px solid #333330', borderRadius: 4, padding: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div>
                      <div style={{ fontWeight: 700, color: '#F2F0EB' }}>{c.name}</div>
                      <div style={{ fontSize: 12, color: '#A39D93' }}>{c.obra}{c.ubicacion ? ` · ${c.ubicacion}` : ''}{c.telefono ? ` · ${c.telefono}` : ''}</div>
                    </div>
                    <button onClick={() => remove(c.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={15} /></button>
                  </div>

                  <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginTop: 8, flexWrap: 'wrap' }}>
                    <select value={c.estado || 'Prospecto'} onChange={e => setEstado(c.id, e.target.value)}
                      style={{ ...inputStyle, width: 'auto', padding: '4px 8px', fontSize: 11, color: ESTADO_COLORS[c.estado] || '#B9B4A8' }}>
                      {CLIENT_ESTADOS.map(e => <option key={e} value={e}>{e}</option>)}
                    </select>
                    <span style={{ fontSize: 11, color: '#B9B4A8', fontFamily: "'IBM Plex Mono', monospace" }}>
                      {stats.pedidos} pedidos · {stats.m3.toFixed(1)} m³ · {fmtQ(stats.ingreso)} generados
                    </span>
                  </div>

                  {c.proximoSeguimiento && (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 6 }}>
                      <span style={{ fontSize: 11, color: c.proximoSeguimiento <= today ? '#B54834' : '#F2A900' }}>
                        Próximo seguimiento: {c.proximoSeguimiento}
                      </span>
                      <button onClick={() => clearNextDate(c.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#A39D93' }}><X size={11} /></button>
                    </div>
                  )}

                  <button onClick={() => setExpanded(isOpen ? null : c.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#07E55E', fontSize: 12, marginTop: 8, padding: 0 }}>
                    {isOpen ? 'Ocultar seguimiento' : `Ver seguimiento (${(c.seguimiento || []).length})`}
                  </button>

                  {isOpen && (
                    <div style={{ marginTop: 8, paddingTop: 8, borderTop: '1px solid #333330' }}>
                      <div style={{ display: 'flex', gap: 6, marginBottom: 6, flexWrap: 'wrap' }}>
                        <select value={noteType} onChange={e => setNoteType(e.target.value)} style={{ ...inputStyle, width: 'auto' }}>
                          {CONTACT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                        <input style={{ ...inputStyle, flex: 1, minWidth: 140 }} value={noteText} onChange={e => setNoteText(e.target.value)}
                          placeholder="ej. cotizó 50 m³ para agosto" />
                      </div>
                      <div style={{ display: 'flex', gap: 6, marginBottom: 8, alignItems: 'center' }}>
                        <span style={{ fontSize: 11, color: '#A39D93', whiteSpace: 'nowrap' }}>Próximo seguimiento:</span>
                        <input type="date" style={{ ...inputStyle, flex: 1 }} value={nextDate} onChange={e => setNextDate(e.target.value)} />
                        <Btn variant="accent" onClick={() => addNote(c.id)}><Plus size={13} /></Btn>
                      </div>
                      {(c.seguimiento || []).length === 0 && <div style={{ fontSize: 12, color: '#A39D93' }}>Sin notas todavía.</div>}
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                        {[...(c.seguimiento || [])].reverse().map((n, i) => {
                          const realIdx = c.seguimiento.length - 1 - i;
                          return (
                            <div key={realIdx} style={{ display: 'flex', justifyContent: 'space-between', gap: 8, fontSize: 12 }}>
                              <div>
                                <span style={{ color: '#A39D93', fontFamily: "'IBM Plex Mono', monospace" }}>{n.fecha}</span>
                                {n.tipo && <span style={{ color: '#7FB8E0' }}> [{n.tipo}]</span>} — <span style={{ color: '#B9B4A8' }}>{n.nota}</span>
                              </div>
                              <button onClick={() => removeNote(c.id, realIdx)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834', flexShrink: 0 }}><X size={12} /></button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </Card>
      </div>
    </div>
  );
}

const PO_ESTADOS = ['Pendiente', 'Recibida', 'Cancelada'];
const PO_COLORS = { Pendiente: '#F2A900', Recibida: '#07E55E', Cancelada: '#B54834' };

function Proveedores({ data, setData, username }) {
  const [supplierForm, setSupplierForm] = useState({ nombre: '', contacto: '', telefono: '' });
  const [poForm, setPoForm] = useState({ supplierId: '', material: Object.keys(data.inventory)[0] || '', cantidad: '', precioUnitario: '' });
  const [error, setError] = useState('');

  const addSupplier = () => {
    if (!supplierForm.nombre.trim()) return;
    setData(d => ({
      ...d,
      nextSupplierNum: d.nextSupplierNum + 1,
      suppliers: [...d.suppliers, { id: `p${Date.now()}`, nombre: supplierForm.nombre.trim(), contacto: supplierForm.contacto.trim(), telefono: supplierForm.telefono.trim() }],
    }));
    setSupplierForm({ nombre: '', contacto: '', telefono: '' });
  };
  const removeSupplier = (id) => {
    const s = data.suppliers.find(x => x.id === id);
    setData(d => ({ ...d, suppliers: d.suppliers.filter(s => s.id !== id) }));
    moveToTrash(setData, username, 'proveedor', s, s ? s.nombre : id);
  };

  const addPO = () => {
    if (!poForm.supplierId) { setError('Selecciona un proveedor.'); return; }
    const cant = parseFloat(poForm.cantidad);
    const precio = parseFloat(poForm.precioUnitario);
    if (isNaN(cant) || cant <= 0) { setError('Indica una cantidad válida.'); return; }
    if (isNaN(precio) || precio < 0) { setError('Indica un precio unitario válido.'); return; }
    const id = `OC-${String(data.nextPONum).padStart(4, '0')}`;
    setData(d => ({
      ...d,
      nextPONum: d.nextPONum + 1,
      purchaseOrders: [...d.purchaseOrders, {
        id, fecha: todayStr(), supplierId: poForm.supplierId, material: poForm.material,
        cantidad: cant, precioUnitario: precio, total: +(cant * precio).toFixed(2), estado: 'Pendiente',
      }],
    }));
    logAudit(setData, username, 'Orden de compra creada', `${id} · ${fmtQ(cant * precio)}`);
    setPoForm({ supplierId: poForm.supplierId, material: poForm.material, cantidad: '', precioUnitario: '' });
    setError('');
  };

  const cancelPO = (id) => {
    setData(d => ({ ...d, purchaseOrders: d.purchaseOrders.map(o => o.id === id ? { ...o, estado: 'Cancelada' } : o) }));
    logAudit(setData, username, 'Orden de compra cancelada', id);
  };
  const removePO = (id) => {
    const o = data.purchaseOrders.find(x => x.id === id);
    setData(d => ({ ...d, purchaseOrders: d.purchaseOrders.filter(o => o.id !== id) }));
    moveToTrash(setData, username, 'ordenCompra', o, o ? o.id : id);
  };

  const receivePO = (id) => {
    setData(d => {
      const po = d.purchaseOrders.find(o => o.id === id);
      if (!po || po.estado !== 'Pendiente') return d;
      const item = d.inventory[po.material];
      if (!item) return { ...d, purchaseOrders: d.purchaseOrders.map(o => o.id === id ? { ...o, estado: 'Recibida' } : o) };
      const newQty = +(item.qty + po.cantidad).toFixed(2);
      const totalActual = item.qty * (item.costoUnitario || 0);
      const totalNuevo = po.cantidad * po.precioUnitario;
      const newCost = newQty > 0 ? +((totalActual + totalNuevo) / newQty).toFixed(4) : item.costoUnitario || 0;
      return {
        ...d,
        inventory: { ...d.inventory, [po.material]: { ...item, qty: newQty, costoUnitario: newCost } },
        purchaseOrders: d.purchaseOrders.map(o => o.id === id ? { ...o, estado: 'Recibida' } : o),
      };
    });
    logAudit(setData, username, 'Orden de compra recibida', id);
  };

  const supplierName = (id) => (data.suppliers.find(s => s.id === id) || {}).nombre || 'Proveedor eliminado';
  const materialLabel = (key) => (data.inventory[key] || {}).label || key;
  const pendientes = data.purchaseOrders.filter(o => o.estado === 'Pendiente');

  return (
    <div>
      <Eyebrow>Compras</Eyebrow>
      <H1>Proveedores</H1>

      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 800 ? '1fr 1.4fr' : '1fr', gap: 16, marginTop: 20 }}>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Nuevo proveedor</div>
          <Field label="Nombre / empresa">
            <input style={inputStyle} value={supplierForm.nombre} onChange={e => setSupplierForm(f => ({ ...f, nombre: e.target.value }))} />
          </Field>
          <Field label="Contacto">
            <input style={inputStyle} value={supplierForm.contacto} onChange={e => setSupplierForm(f => ({ ...f, contacto: e.target.value }))} />
          </Field>
          <Field label="Teléfono">
            <input style={inputStyle} value={supplierForm.telefono} onChange={e => setSupplierForm(f => ({ ...f, telefono: e.target.value }))} />
          </Field>
          <Btn variant="accent" onClick={addSupplier}><Plus size={14} /> Agregar proveedor</Btn>
        </Card>

        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Proveedores registrados</div>
          {data.suppliers.length === 0 && <div style={{ color: '#A39D93', fontSize: 13 }}>Aún no hay proveedores.</div>}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {data.suppliers.map(s => (
              <div key={s.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #333330', paddingBottom: 8 }}>
                <div><div style={{ fontWeight: 600, color: '#F2F0EB' }}>{s.nombre}</div><div style={{ fontSize: 12, color: '#A39D93' }}>{s.contacto}{s.telefono ? ` · ${s.telefono}` : ''}</div></div>
                <button onClick={() => removeSupplier(s.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={15} /></button>
              </div>
            ))}
          </div>
        </Card>
      </div>

      <Eyebrow style={{ marginTop: 24 }}>Órdenes de compra</Eyebrow>
      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 800 ? '1fr 1.4fr' : '1fr', gap: 16, marginTop: 8 }}>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Nueva orden de compra</div>
          {data.suppliers.length === 0 ? (
            <div style={{ fontSize: 13, color: '#A39D93' }}>Agrega un proveedor primero.</div>
          ) : (
            <>
              <Field label="Proveedor">
                <select style={inputStyle} value={poForm.supplierId} onChange={e => setPoForm(f => ({ ...f, supplierId: e.target.value }))}>
                  <option value="">Selecciona…</option>
                  {data.suppliers.map(s => <option key={s.id} value={s.id}>{s.nombre}</option>)}
                </select>
              </Field>
              <Field label="Material">
                <select style={inputStyle} value={poForm.material} onChange={e => setPoForm(f => ({ ...f, material: e.target.value }))}>
                  {Object.entries(data.inventory).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                </select>
              </Field>
              <Field label={`Cantidad (${(data.inventory[poForm.material] || {}).unit || ''})`}>
                <input type="number" min="0" style={inputStyle} value={poForm.cantidad} onChange={e => setPoForm(f => ({ ...f, cantidad: e.target.value }))} />
              </Field>
              <Field label="Precio unitario (Q)">
                <input type="number" min="0" step="0.01" style={inputStyle} value={poForm.precioUnitario} onChange={e => setPoForm(f => ({ ...f, precioUnitario: e.target.value }))} />
              </Field>
              {poForm.cantidad && poForm.precioUnitario && (
                <div style={{ fontSize: 13, color: '#07E55E', fontWeight: 700, marginBottom: 10 }}>
                  Total: {fmtQ((parseFloat(poForm.cantidad) * parseFloat(poForm.precioUnitario) || 0))}
                </div>
              )}
              {error && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{error}</div>}
              <Btn variant="accent" onClick={addPO}><Plus size={14} /> Crear orden de compra</Btn>
            </>
          )}
        </Card>

        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Órdenes de compra</div>
          {data.purchaseOrders.length === 0 && <div style={{ color: '#A39D93', fontSize: 13 }}>Aún no hay órdenes de compra.</div>}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {[...data.purchaseOrders].reverse().map(o => (
              <div key={o.id} style={{ border: '1px solid #333330', borderRadius: 4, padding: 12 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                  <div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: '#F2F0EB' }}>{o.id} · {o.fecha}</div>
                    <div style={{ fontWeight: 700, color: '#F2F0EB', marginTop: 2 }}>{supplierName(o.supplierId)}</div>
                    <div style={{ fontSize: 12, color: '#A39D93' }}>{o.cantidad} {(data.inventory[o.material] || {}).unit || ''} de {materialLabel(o.material)} · {fmtQ(o.precioUnitario)}/u</div>
                  </div>
                  <button onClick={() => removePO(o.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={15} /></button>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8 }}>
                  <div style={{ fontWeight: 700, color: '#07E55E' }}>{fmtQ(o.total)}</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontSize: 11, color: PO_COLORS[o.estado], fontWeight: 700 }}>{o.estado}</span>
                    {o.estado === 'Pendiente' && (
                      <>
                        <Btn variant="accent" onClick={() => receivePO(o.id)} style={{ padding: '5px 10px', fontSize: 11 }}>Marcar recibida</Btn>
                        <Btn variant="ghost" onClick={() => cancelPO(o.id)} style={{ padding: '5px 10px', fontSize: 11 }}>Cancelar</Btn>
                      </>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>
      {pendientes.length > 0 && (
        <div style={{ marginTop: 12, fontSize: 12, color: '#A39D93' }}>
          Al marcar una orden como "recibida", la cantidad se suma automáticamente al inventario y el costo unitario se recalcula como promedio ponderado.
        </div>
      )}
    </div>
  );
}

const INVOICE_ESTADOS = ['Pendiente', 'Pagada', 'Anulada'];
const INVOICE_COLORS = { Pendiente: '#F2A900', Pagada: '#07E55E', Anulada: '#A39D93' };

function Facturas({ data, setData, username }) {
  const [tipo, setTipo] = useState('emitida');
  const [form, setForm] = useState({ numero: '', fecha: todayStr(), contraparte: '', concepto: '', monto: '', estado: 'Pendiente' });
  const [error, setError] = useState('');
  const [importStatus, setImportStatus] = useState(null);
  const [colMap, setColMap] = useState(null); // { headers, rows, mapping }
  const [showReport, setShowReport] = useState(false);
  const [dirStatus, setDirStatus] = useState(null);
  const dirFileRef = React.useRef(null);
  const fileRef = React.useRef(null);

  // ---- Directorio de proveedores (NIT -> nombre), para dejar de ver el NIT pelado ----
  // Acepta el Excel de "Consulta de DTE" del SAT (columnas "NIT del emisor" / "Nombre
  // completo del emisor") o cualquier archivo con columnas de NIT y Nombre.
  const onDirectorioFileChosen = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setDirStatus(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        let iNit = -1, iNombre = -1, rows = null;
        for (const sheetName of wb.SheetNames) {
          const sheet = wb.Sheets[sheetName];
          const data0 = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
          for (let i = 0; i < Math.min(data0.length, 5); i++) {
            const row = data0[i].map(c => String(c).trim().toLowerCase());
            const iN = row.findIndex(h => h.includes('nit') && (h.includes('emisor') || h === 'nit'));
            const iNm = row.findIndex(h => h.includes('nombre') && (h.includes('emisor') || h === 'nombre'));
            if (iN > -1 && iNm > -1) { iNit = iN; iNombre = iNm; rows = data0.slice(i + 1); break; }
          }
          if (rows) break;
        }
        if (!rows) { setDirStatus({ ok: false, msg: 'No se encontraron columnas de NIT y Nombre en el archivo.' }); return; }
        const encontrados = new Map();
        rows.forEach(r => {
          const nit = String(r[iNit] || '').trim();
          const nombre = String(r[iNombre] || '').trim();
          if (nit && nombre) encontrados.set(nit, nombre);
        });
        setData(d => {
          const dir = new Map(d.proveedoresDirectorio.map(p => [p.nit, p.nombre]));
          encontrados.forEach((nombre, nit) => dir.set(nit, nombre));
          return { ...d, proveedoresDirectorio: Array.from(dir, ([nit, nombre]) => ({ nit, nombre })) };
        });
        setDirStatus({ ok: true, msg: `Se encontraron ${encontrados.size} proveedores en el archivo.` });
      } catch (err) {
        setDirStatus({ ok: false, msg: 'No se pudo leer el archivo: ' + err.message });
      }
    };
    reader.readAsArrayBuffer(file);
    if (dirFileRef.current) dirFileRef.current.value = '';
  };

  // Recorre TODAS las facturas y, si la contraparte quedó guardada como puro NIT (sin
  // nombre), la reemplaza por el nombre real del directorio — sin tocar las que ya
  // tienen un nombre escrito.
  const aplicarDirectorio = () => {
    setData(d => {
      const dirMap = new Map(d.proveedoresDirectorio.map(p => [p.nit, p.nombre]));
      let count = 0;
      const invoices = d.invoices.map(f => {
        const cp = String(f.contraparte || '').trim();
        if (/^\d{5,}$/.test(cp) && dirMap.has(cp)) {
          count++;
          return { ...f, nit: cp, contraparte: dirMap.get(cp) };
        }
        return f;
      });
      window.__proveedoresActualizados = count;
      return { ...d, invoices };
    });
    setDirStatus({ ok: true, msg: 'Nombres de proveedor actualizados en las facturas que tenían solo el NIT.' });
  };

  const add = () => {
    if (!form.numero.trim()) { setError('Indica el número de DTE / factura.'); return; }
    const monto = parseFloat(form.monto);
    if (isNaN(monto) || monto <= 0) { setError('Indica un monto válido.'); return; }
    const id = `F-${String(data.nextInvoiceNum).padStart(5, '0')}`;
    setData(d => ({
      ...d,
      nextInvoiceNum: d.nextInvoiceNum + 1,
      invoices: [...d.invoices, {
        id, tipo, numero: form.numero.trim(), fecha: form.fecha, contraparte: form.contraparte.trim(),
        concepto: form.concepto.trim(), monto: +monto.toFixed(2), estado: form.estado, conciliada: false, bankMovementId: null,
      }],
    }));
    setForm({ numero: '', fecha: todayStr(), contraparte: '', concepto: '', monto: '', estado: 'Pendiente' });
    setError('');
  };

  const setEstado = (id, estado) => setData(d => ({ ...d, invoices: d.invoices.map(f => f.id === id ? { ...f, estado } : f) }));
  const setConcepto = (id, concepto) => setData(d => ({ ...d, invoices: d.invoices.map(f => f.id === id ? { ...f, concepto } : f) }));
  const remove = (id) => {
    const f = data.invoices.find(x => x.id === id);
    setData(d => ({ ...d, invoices: d.invoices.filter(f => f.id !== id) }));
    moveToTrash(setData, username, 'factura', f, f ? f.numero : id);
  };

  // ---- Actualizar el estado (ej. marcar anuladas) de facturas YA importadas, sin
  // crear duplicados — cruza por número de DTE contra el mismo tipo de Excel del SAT.
  const [estadoUpdateStatus, setEstadoUpdateStatus] = useState(null);
  const estadoFileRef = React.useRef(null);
  const onActualizarEstadoFileChosen = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setEstadoUpdateStatus(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        if (rows.length < 2) { setEstadoUpdateStatus({ ok: false, msg: 'El archivo no tiene filas de datos.' }); return; }
        const headers = rows[0].map(h => String(h).toLowerCase().trim());
        const iNum = headers.findIndex(h => h.includes('número del dte') || h.includes('numero del dte') || h === 'numero' || h === 'número');
        const iEstado = headers.findIndex(h => h === 'estado');
        if (iNum === -1 || iEstado === -1) {
          setEstadoUpdateStatus({ ok: false, msg: 'No se encontraron columnas de "Número del DTE" y "Estado" en el archivo.' });
          return;
        }
        const anuladosPorNumero = new Set();
        rows.slice(1).forEach(r => {
          const numero = String(r[iNum] || '').trim();
          const estadoTexto = String(r[iEstado] || '').toLowerCase();
          if (numero && estadoTexto.includes('anulad')) anuladosPorNumero.add(numero);
        });
        setData(d => {
          let count = 0;
          const invoices = d.invoices.map(f => {
            if (anuladosPorNumero.has(String(f.numero).trim()) && f.estado !== 'Anulada') {
              count++;
              return { ...f, estado: 'Anulada' };
            }
            return f;
          });
          window.__facturasAnuladasActualizadas = count;
          return { ...d, invoices };
        });
        setEstadoUpdateStatus({ ok: true, msg: `Se encontraron ${anuladosPorNumero.size} facturas anuladas en el archivo; se actualizaron las que ya tenías importadas.` });
      } catch (err) {
        setEstadoUpdateStatus({ ok: false, msg: 'No se pudo leer el archivo: ' + err.message });
      }
    };
    reader.readAsArrayBuffer(file);
    if (estadoFileRef.current) estadoFileRef.current.value = '';
  };

  // ---- Actualizar el CONCEPTO de facturas YA importadas, desde un consolidado propio
  // (no necesariamente el reporte del SAT, ya que ese no trae descripción de línea).
  // Como el nombre de las columnas varía de un consolidado a otro, primero se elige
  // cuál columna es el número de factura y cuál es el concepto.
  const [conceptoColMap, setConceptoColMap] = useState(null); // { headers, rows, mapping: { numero, concepto } }
  const [conceptoUpdateStatus, setConceptoUpdateStatus] = useState(null);
  const conceptoFileRef = React.useRef(null);
  const onConsolidadoFileChosen = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setConceptoUpdateStatus(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        if (rows.length < 2) { setConceptoUpdateStatus({ ok: false, msg: 'El archivo no tiene filas de datos.' }); return; }
        const headers = rows[0].map(h => String(h));
        const dataRows = rows.slice(1).filter(r => r.some(c => c !== ''));
        const findCol = (...candidatos) => headers.find(h => candidatos.some(c => h.toLowerCase().trim() === c)) || '';
        setConceptoColMap({
          headers, rows: dataRows,
          mapping: {
            numero: findCol('número del dte', 'numero del dte', 'numero', 'número', 'factura', 'dte'),
            concepto: findCol('concepto', 'descripcion', 'descripción', 'detalle', 'producto', 'item', 'artículo', 'articulo'),
          },
        });
      } catch (err) {
        setConceptoUpdateStatus({ ok: false, msg: 'No se pudo leer el archivo: ' + err.message });
      }
    };
    reader.readAsArrayBuffer(file);
    if (conceptoFileRef.current) conceptoFileRef.current.value = '';
  };
  const aplicarConceptoConsolidado = () => {
    const { headers, rows, mapping } = conceptoColMap;
    if (!mapping.numero || !mapping.concepto) {
      setConceptoUpdateStatus({ ok: false, msg: 'Indica cuál columna es el número de factura y cuál es el concepto.' });
      return;
    }
    const iNum = headers.indexOf(mapping.numero), iConcepto = headers.indexOf(mapping.concepto);
    const conceptoPorNumero = new Map();
    rows.forEach(r => {
      const numero = String(r[iNum] || '').trim();
      const concepto = String(r[iConcepto] || '').trim();
      if (numero && concepto) conceptoPorNumero.set(numero, concepto);
    });
    setData(d => {
      let count = 0;
      const invoices = d.invoices.map(f => {
        const c = conceptoPorNumero.get(String(f.numero).trim());
        if (c && !f.concepto) {
          count++;
          return { ...f, concepto: c };
        }
        return f;
      });
      window.__conceptosActualizados = count;
      return { ...d, invoices };
    });
    setConceptoUpdateStatus({ ok: true, msg: `Se llenó el concepto de las facturas coincidentes que aún no tenían uno escrito.` });
    setConceptoColMap(null);
  };

  // ---- Importar Excel (reporte FEL de la SAT u otro) ----
  const onFileChosen = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImportStatus(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        if (rows.length < 2) { setImportStatus({ ok: false, msg: 'El archivo no tiene filas de datos.' }); return; }
        const headers = rows[0].map(h => String(h));
        const dataRows = rows.slice(1).filter(r => r.some(c => c !== ''));
        const findCol = (...candidatos) => headers.find(h => candidatos.some(c => h.toLowerCase().trim() === c)) || '';
        setColMap({
          headers, rows: dataRows,
          mapping: {
            numero: findCol('número del dte', 'numero del dte', 'numero', 'número'),
            fecha: findCol('fecha de emisión', 'fecha de emision', 'fecha'),
            contraparte: findCol('nombre completo del emisor', 'nombre del emisor', 'contraparte', 'proveedor'),
            concepto: findCol('concepto', 'descripcion', 'descripción'),
            monto: findCol('gran total (moneda original)', 'monto', 'total'),
            estado: findCol('estado'),
          },
        });
      } catch (err) {
        setImportStatus({ ok: false, msg: 'No se pudo leer el archivo: ' + err.message });
      }
    };
    reader.readAsArrayBuffer(file);
    if (fileRef.current) fileRef.current.value = '';
  };

  const confirmImport = () => {
    const { headers, rows, mapping } = colMap;
    if (!mapping.numero || !mapping.fecha || !mapping.monto) {
      setImportStatus({ ok: false, msg: 'Indica al menos qué columna es número, fecha y monto.' });
      return;
    }
    const idx = (name) => headers.indexOf(mapping[name]);
    const iNum = idx('numero'), iFecha = idx('fecha'), iCont = idx('contraparte'), iConcepto = idx('concepto'), iMonto = idx('monto'), iEstado = idx('estado');

    let nextNum = data.nextInvoiceNum;
    const newInvoices = [];
    rows.forEach(r => {
      const monto = parseFloat(String(r[iMonto]).replace(/,/g, ''));
      if (isNaN(monto)) return;
      let fecha = r[iFecha];
      if (typeof fecha === 'number') {
        // fecha serial de Excel
        const d0 = new Date(Math.round((fecha - 25569) * 86400 * 1000));
        fecha = d0.toISOString().slice(0, 10);
      } else {
        fecha = String(fecha).slice(0, 10);
      }
      // Si el Excel trae una columna de estado (ej. el reporte del SAT dice "Vigente" o
      // "Anulado"), se respeta esa condición en vez de asumir que todo está pendiente.
      const estadoTexto = iEstado > -1 ? String(r[iEstado] || '').toLowerCase() : '';
      const estado = estadoTexto.includes('anulad') ? 'Anulada' : 'Pendiente';
      newInvoices.push({
        id: `F-${String(nextNum).padStart(5, '0')}`, tipo,
        numero: String(r[iNum] || ''), fecha, contraparte: iCont > -1 ? String(r[iCont] || '') : '',
        concepto: iConcepto > -1 ? String(r[iConcepto] || '') : '',
        monto: +monto.toFixed(2), estado, conciliada: false, bankMovementId: null,
      });
      nextNum++;
    });

    setData(d => ({ ...d, invoices: [...d.invoices, ...newInvoices], nextInvoiceNum: nextNum }));
    setImportStatus({ ok: true, msg: `Se importaron ${newInvoices.length} facturas ${tipo === 'emitida' ? 'emitidas' : 'recibidas'}.` });
    setColMap(null);
  };

  const filtered = data.invoices.filter(f => f.tipo === tipo);
  const totalPendiente = filtered.filter(f => f.estado === 'Pendiente').reduce((s, f) => s + f.monto, 0);

  return (
    <div>
      <Eyebrow>Facturación (FEL)</Eyebrow>
      <H1>Facturas</H1>

      <div style={{ display: 'flex', gap: 8, marginTop: 16, flexWrap: 'wrap' }}>
        <Btn variant={tipo === 'emitida' ? 'accent' : 'ghost'} onClick={() => setTipo('emitida')}>Emitidas (ventas)</Btn>
        <Btn variant={tipo === 'recibida' ? 'accent' : 'ghost'} onClick={() => setTipo('recibida')}>Recibidas (compras)</Btn>
        <Btn variant="ghost" onClick={() => setShowReport(true)}><FileText size={14} /> Generar reporte PDF</Btn>
      </div>

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 6 }}>Directorio de proveedores (NIT → nombre)</div>
        <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
          Algunas facturas quedaron guardadas con el NIT en vez del nombre del proveedor, lo que hace más
          difícil reconocerlas al conciliar. Subí el Excel de "Consulta de DTE" del SAT (o cualquier archivo
          con columnas de NIT y Nombre) para armar un directorio, y después aplicalo a tus facturas ya
          registradas — sin tocar las que ya tienen un nombre escrito a mano.
        </div>
        {dirStatus && <div style={{ fontSize: 12, color: dirStatus.ok ? '#07E55E' : '#B54834', marginBottom: 8 }}>{dirStatus.msg}</div>}
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center', marginBottom: 10 }}>
          <input ref={dirFileRef} type="file" accept=".xlsx,.xls,.csv" onChange={onDirectorioFileChosen} style={{ fontSize: 12 }} />
          <Btn variant="accent" onClick={aplicarDirectorio} disabled={data.proveedoresDirectorio.length === 0}>
            <Check size={14} /> Actualizar nombres en facturas ({data.proveedoresDirectorio.length} proveedores en el directorio)
          </Btn>
        </div>
      </Card>

      <Card style={{ marginTop: 16, borderColor: '#B54834' }}>
        <div style={{ fontWeight: 700, marginBottom: 6, color: '#B54834' }}>Actualizar estado de facturas ya importadas (marcar anuladas)</div>
        <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
          Al importar antes no se leía si una factura estaba anulada, así que todas quedaron como "Pendiente"
          — incluso las que el SAT ya marca como "Anulado". Subí de nuevo el mismo Excel (u otro más
          reciente) del SAT aquí: <b>no crea facturas nuevas</b>, solo cruza por número de DTE y marca como
          "Anulada" las que correspondan entre las que ya tienes.
        </div>
        {estadoUpdateStatus && <div style={{ fontSize: 12, color: estadoUpdateStatus.ok ? '#07E55E' : '#B54834', marginBottom: 8 }}>{estadoUpdateStatus.msg}</div>}
        <input ref={estadoFileRef} type="file" accept=".xlsx,.xls,.csv" onChange={onActualizarEstadoFileChosen} style={{ fontSize: 12 }} />
      </Card>

      <Card style={{ marginTop: 16, borderColor: '#5C8AA6' }}>
        <div style={{ fontWeight: 700, marginBottom: 6, color: '#5C8AA6' }}>Actualizar concepto de facturas ya importadas (desde un consolidado)</div>
        <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
          Subí tu consolidado (el que ya llevas con qué compraste en cada factura). Cruza por número de
          factura contra las que ya tienes cargadas y llena el concepto — <b>sin crear facturas nuevas</b> y
          sin pisar los conceptos que ya hayas escrito a mano.
        </div>
        {conceptoUpdateStatus && <div style={{ fontSize: 12, color: conceptoUpdateStatus.ok ? '#07E55E' : '#B54834', marginBottom: 8 }}>{conceptoUpdateStatus.msg}</div>}
        <input ref={conceptoFileRef} type="file" accept=".xlsx,.xls,.csv" onChange={onConsolidadoFileChosen} style={{ fontSize: 12 }} />

        {conceptoColMap && (
          <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid #333330' }}>
            <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8 }}>¿Qué columna es cada dato? ({conceptoColMap.rows.length} filas encontradas)</div>
            {['numero', 'concepto'].map(key => (
              <Field key={key} label={key === 'numero' ? 'Número de factura / DTE' : 'Concepto'}>
                <select style={inputStyle} value={conceptoColMap.mapping[key]} onChange={e => setConceptoColMap(c => ({ ...c, mapping: { ...c.mapping, [key]: e.target.value } }))}>
                  <option value="">— no usar —</option>
                  {conceptoColMap.headers.map(h => <option key={h} value={h}>{h}</option>)}
                </select>
              </Field>
            ))}
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn variant="accent" onClick={aplicarConceptoConsolidado}><Check size={14} /> Actualizar conceptos</Btn>
              <Btn variant="ghost" onClick={() => setConceptoColMap(null)}>Cancelar</Btn>
            </div>
          </div>
        )}
      </Card>

      {showReport && (() => {
        const buildGroup = (heading, tipoFiltro) => {
          const list = data.invoices.filter(f => f.tipo === tipoFiltro);
          const porEstado = (estado) => list.filter(f => f.estado === estado);
          return {
            heading,
            rows: [
              { label: 'Total', cantidad: list.length, monto: list.reduce((s, f) => s + f.monto, 0), bold: true },
              { label: 'Pendientes', cantidad: porEstado('Pendiente').length, monto: porEstado('Pendiente').reduce((s, f) => s + f.monto, 0) },
              { label: 'Pagadas', cantidad: porEstado('Pagada').length, monto: porEstado('Pagada').reduce((s, f) => s + f.monto, 0) },
              { label: 'Anuladas', cantidad: porEstado('Anulada').length, monto: porEstado('Anulada').reduce((s, f) => s + f.monto, 0) },
            ],
          };
        };
        return (
          <PrintableSummaryReport
            title="REPORTE DE FACTURACIÓN"
            subtitle="Resumen general — emitidas y recibidas"
            company={data.company}
            onClose={() => setShowReport(false)}
            groups={[buildGroup('Facturas emitidas (ventas)', 'emitida'), buildGroup('Facturas recibidas (compras)', 'recibida')]}
          />
        );
      })()}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 12, marginTop: 16 }}>
        <StatCard label={`${tipo === 'emitida' ? 'Emitidas' : 'Recibidas'} totales`} value={filtered.length} icon={Receipt} />
        <StatCard label="Pendientes de cobro/pago" value={fmtQ(totalPendiente)} icon={AlertTriangle} warn={totalPendiente > 0} />
        <StatCard label="Conciliadas" value={filtered.filter(f => f.conciliada).length} icon={Landmark} />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 800 ? '1fr 1.4fr' : '1fr', gap: 16, marginTop: 16 }}>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Importar desde Excel (reporte SAT/FEL)</div>
          <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
            Descarga tu reporte de {tipo === 'emitida' ? 'documentos emitidos' : 'documentos recibidos'} desde el portal de la SAT (Consulta de documentos → Exportar a Excel) y súbelo aquí.
          </div>
          <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={onFileChosen} style={{ fontSize: 13, marginBottom: 10 }} />
          {importStatus && <div style={{ fontSize: 12, color: importStatus.ok ? '#07E55E' : '#B54834', marginBottom: 8 }}>{importStatus.msg}</div>}

          {colMap && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid #333330' }}>
              <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8 }}>¿Qué columna es cada dato? ({colMap.rows.length} filas encontradas)</div>
              {['numero', 'fecha', 'contraparte', 'concepto', 'monto', 'estado'].map(key => (
                <Field key={key} label={key === 'numero' ? 'Número de DTE' : key === 'fecha' ? 'Fecha' : key === 'contraparte' ? (tipo === 'emitida' ? 'Cliente (opcional)' : 'Proveedor (opcional)') : key === 'concepto' ? 'Concepto (opcional)' : key === 'monto' ? 'Monto total' : 'Estado (opcional — si dice "Anulado", se marca así)'}>
                  <select style={inputStyle} value={colMap.mapping[key]} onChange={e => setColMap(c => ({ ...c, mapping: { ...c.mapping, [key]: e.target.value } }))}>
                    <option value="">— no usar —</option>
                    {colMap.headers.map(h => <option key={h} value={h}>{h}</option>)}
                  </select>
                </Field>
              ))}
              <div style={{ display: 'flex', gap: 8 }}>
                <Btn variant="accent" onClick={confirmImport}><Check size={14} /> Importar {colMap.rows.length} filas</Btn>
                <Btn variant="ghost" onClick={() => setColMap(null)}>Cancelar</Btn>
              </div>
            </div>
          )}

          <div style={{ fontWeight: 700, margin: '16px 0 10px', paddingTop: 10, borderTop: '1px solid #333330' }}>Capturar manualmente</div>
          <Field label="Número de DTE / factura">
            <input style={inputStyle} value={form.numero} onChange={e => setForm(f => ({ ...f, numero: e.target.value }))} />
          </Field>
          <Field label="Fecha">
            <input type="date" style={inputStyle} value={form.fecha} onChange={e => setForm(f => ({ ...f, fecha: e.target.value }))} />
          </Field>
          <Field label={tipo === 'emitida' ? 'Cliente' : 'Proveedor'}>
            <input style={inputStyle} value={form.contraparte} onChange={e => setForm(f => ({ ...f, contraparte: e.target.value }))} />
          </Field>
