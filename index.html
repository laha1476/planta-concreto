                  key={o.id}
                  onClick={() => { setPrintingOrderId(o.id); setPickingClientId(null); }}
                  style={{ textAlign: 'left', background: '#201E1B', border: '1px solid #333330', borderRadius: 4, padding: '10px 12px', cursor: 'pointer', color: '#F2F0EB' }}
                >
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 }}>{o.id}</div>
                  <div style={{ fontSize: 12, color: '#A39D93' }}>{o.recipeName} · {o.date} · {o.volumeM3} m³</div>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {printingOrderId && (
        <PrintableOrder
          order={data.orders.find(o => o.id === printingOrderId)}
          client={data.clients.find(c => c.id === (data.orders.find(o => o.id === printingOrderId) || {}).clientId)}
          company={data.company}
          onClose={() => setPrintingOrderId(null)}
        />
      )}
    </div>
  );
}

function buildWorkbook(data) {
  const wb = XLSX.utils.book_new();

  const invRows = Object.entries(data.inventory).map(([id, v]) => ({
    id, nombre: v.label, unidad: v.unit, cantidad_actual: v.qty, cantidad_minima: v.min, color_hex: v.color, costo_unitario_q: v.costoUnitario || 0,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(invRows), 'Inventario');

  const recRows = data.recipes.map(r => ({
    id: r.id, nombre: r.name,
    materiales: Object.entries(r.materiales || {}).map(([k, v]) => `${k}:${v}`).join(';'),
    aditivo_nombre: r.aditivoNombre || '', precio_venta_q_m3: r.precioM3 || 0,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(recRows), 'Recetas');

  const cliRows = data.clients.map(c => ({
    id: c.id, nombre: c.name, obra: c.obra, telefono: c.telefono || '', estado: c.estado || 'Prospecto',
    seguimiento: (c.seguimiento || []).map(n => `${n.fecha}: ${n.nota}`).join(' | '),
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cliRows), 'Clientes');

  const ordRows = data.orders.map(o => ({
    id: o.id, fecha: o.date, receta_id: o.recipeId, cliente_id: o.clientId || '', volumen_m3: o.volumeM3, estado: o.status,
    distancia_km: o.distanciaKm ?? '', pct_distancia: o.pctDistancia ?? '', vendedor: o.vendedor || '', pct_vendedor: o.pctVendedor ?? '',
    ingreso_base_q: o.ingresoBase ?? '', comision_vendedor_q: o.comisionVendedor ?? '', diesel_costo_q: o.dieselCosto ?? '',
    ingreso_q: o.ingreso ?? '', costo_q: o.costo ?? '', utilidad_q: o.utilidad ?? '',
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ordRows), 'Ordenes');

  const fleetRows = data.fleet.map(u => ({ id: u.id, tipo: u.type, numero: u.num, nombre: u.name || '' }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fleetRows), 'Flota');

  const dispRows = data.fleet.map(u => {
    const d = data.dispatches[u.id];
    return {
      unidad_id: u.id, orden_id: d ? d.orderId : '', estado: d ? d.status : 'disponible',
      hora_asignacion: d ? new Date(d.since).toLocaleString() : '', hora_entrega: '',
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dispRows), 'Despachos');

  const maintRows = data.maintenance.map(m => ({
    id: m.id, unidad_id: m.unitId, fecha: m.fecha, tipo: m.tipo, descripcion: m.descripcion, taller: m.taller,
    costo_q: m.costo ?? '', kilometraje_horas: m.kilometraje ?? '', proxima_fecha: m.proximaFecha || '',
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(maintRows), 'Mantenimiento');

  const tripRows = data.trips.map(t => ({
    id: t.id, unidad_id: t.unitId, unidad_nombre: t.unitName, tipo: t.tipo, orden_id: t.orderId || '',
    volumen_m3: t.volumeM3 ?? '', hora_asignacion: t.asignacion ? new Date(t.asignacion).toLocaleString() : '',
    hora_salida: t.salida ? new Date(t.salida).toLocaleString() : '', hora_llegada: t.llegada ? new Date(t.llegada).toLocaleString() : '',
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tripRows), 'Viajes');

  const supplierRows = data.suppliers.map(s => ({ id: s.id, nombre: s.nombre, contacto: s.contacto || '', telefono: s.telefono || '' }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(supplierRows), 'Proveedores');

  const poRows = data.purchaseOrders.map(o => ({
    id: o.id, fecha: o.fecha, proveedor_id: o.supplierId, material: o.material, cantidad: o.cantidad,
    precio_unitario_q: o.precioUnitario, total_q: o.total, estado: o.estado,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(poRows), 'OrdenesCompra');

  const quoteRows = data.quotes.map(q => ({
    id: q.id, fecha: q.fecha, cliente_id: q.clientId, receta_id: q.recipeId, volumen_m3: q.volumeM3,
    precio_q_m3: q.precioM3, total_q: q.total, vigencia: q.vigencia || '', notas: q.notas || '', estado: q.estado,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(quoteRows), 'Cotizaciones');

  return wb;
}

async function importWorkbook(file, setData) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const sheet = (name) => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '' }) : [];

  const invRows = sheet('Inventario');
  const recRows = sheet('Recetas');
  const cliRows = sheet('Clientes');
  const ordRows = sheet('Ordenes');
  const fleetRows = sheet('Flota');
  const dispRows = sheet('Despachos');
  const maintRows = sheet('Mantenimiento');
  const supplierRows = sheet('Proveedores');
  const poRows = sheet('OrdenesCompra');
  const quoteRows = sheet('Cotizaciones');

  setData(d => {
    const inventory = { ...d.inventory };
    invRows.forEach(r => {
      if (!r.id) return;
      inventory[r.id] = {
        label: r.nombre || r.id, unit: r.unidad || '', qty: Number(r.cantidad_actual) || 0,
        min: Number(r.cantidad_minima) || 0, color: r.color_hex || (inventory[r.id] ? inventory[r.id].color : '#A39D93'),
        costoUnitario: r.costo_unitario_q === '' || r.costo_unitario_q == null ? (inventory[r.id] ? inventory[r.id].costoUnitario || 0 : 0) : Number(r.costo_unitario_q),
      };
    });

    const recipes = recRows.filter(r => r.id).map(r => {
      const materiales = {};
      String(r.materiales || '').split(';').filter(Boolean).forEach(pair => {
        const idx = pair.indexOf(':');
        if (idx === -1) return;
        const key = pair.slice(0, idx).trim();
        const val = parseFloat(pair.slice(idx + 1));
        if (key && !isNaN(val)) materiales[key] = val;
      });
      return {
        id: String(r.id), name: r.nombre || r.id, materiales,
        aditivoNombre: r.aditivo_nombre || '',
        precioM3: r.precio_venta_q_m3 === '' || r.precio_venta_q_m3 == null ? 0 : Number(r.precio_venta_q_m3),
      };
    });

    const clients = cliRows.filter(r => r.id).map(r => ({
      id: String(r.id), name: r.nombre || '', obra: r.obra || '', telefono: r.telefono || '',
      estado: r.estado || 'Prospecto',
      seguimiento: r.seguimiento ? String(r.seguimiento).split(' | ').filter(Boolean).map(s => {
        const idx = s.indexOf(':');
        return idx > -1 ? { fecha: s.slice(0, idx).trim(), nota: s.slice(idx + 1).trim() } : { fecha: todayStr(), nota: s };
      }) : [],
    }));

    const orders = ordRows.filter(r => r.id).map(r => ({
      id: String(r.id), date: String(r.fecha), recipeId: r.receta_id,
      recipeName: (recipes.find(x => x.id === r.receta_id) || {}).name || '',
      clientId: r.cliente_id || null, volumeM3: Number(r.volumen_m3) || 0, status: r.estado || 'producido',
      distanciaKm: r.distancia_km === '' || r.distancia_km == null ? null : Number(r.distancia_km),
      pctDistancia: r.pct_distancia === '' || r.pct_distancia == null ? 0 : Number(r.pct_distancia),
      vendedor: r.vendedor || '',
      pctVendedor: r.pct_vendedor === '' || r.pct_vendedor == null ? 0 : Number(r.pct_vendedor),
      ingresoBase: r.ingreso_base_q === '' || r.ingreso_base_q == null ? undefined : Number(r.ingreso_base_q),
      comisionVendedor: r.comision_vendedor_q === '' || r.comision_vendedor_q == null ? undefined : Number(r.comision_vendedor_q),
      dieselCosto: r.diesel_costo_q === '' || r.diesel_costo_q == null ? undefined : Number(r.diesel_costo_q),
      ingreso: r.ingreso_q === '' || r.ingreso_q == null ? undefined : Number(r.ingreso_q),
      costo: r.costo_q === '' || r.costo_q == null ? undefined : Number(r.costo_q),
      utilidad: r.utilidad_q === '' || r.utilidad_q == null ? undefined : Number(r.utilidad_q),
    }));

    const fleet = fleetRows.filter(r => r.id).map(r => ({
      id: String(r.id), type: r.tipo === 'bomba' ? 'bomba' : 'camion', num: Number(r.numero) || 0, name: r.nombre || '',
    }));

    const dispatches = {};
    dispRows.forEach(r => {
      if (r.unidad_id && r.orden_id) dispatches[r.unidad_id] = { orderId: r.orden_id, status: r.estado || 'disponible', since: Date.now() };
    });

    const maintenance = maintRows.filter(r => r.id).map(r => ({
      id: String(r.id), unitId: r.unidad_id, fecha: String(r.fecha), tipo: r.tipo || 'Preventivo',
      descripcion: r.descripcion || '', taller: r.taller || '',
      costo: r.costo_q === '' ? null : Number(r.costo_q),
      kilometraje: r.kilometraje_horas === '' ? null : Number(r.kilometraje_horas),
      proximaFecha: r.proxima_fecha || null,
    }));

    const numFromId = (id) => parseInt(String(id || '').replace(/\D/g, ''), 10) || 0;
    const maxOrderNum = orders.reduce((m, o) => Math.max(m, numFromId(o.id)), 0);
    const maxMaintNum = maintenance.reduce((m, x) => Math.max(m, numFromId(x.id)), 0);
    const maxCamionNum = fleet.filter(u => u.type === 'camion').reduce((m, u) => Math.max(m, u.num), 0);
    const maxBombaNum = fleet.filter(u => u.type === 'bomba').reduce((m, u) => Math.max(m, u.num), 0);

    const suppliers = supplierRows.filter(r => r.id).map(r => ({
      id: String(r.id), nombre: r.nombre || '', contacto: r.contacto || '', telefono: r.telefono || '',
    }));

    const purchaseOrders = poRows.filter(r => r.id).map(r => ({
      id: String(r.id), fecha: String(r.fecha), supplierId: r.proveedor_id, material: r.material,
      cantidad: Number(r.cantidad) || 0, precioUnitario: Number(r.precio_unitario_q) || 0,
      total: Number(r.total_q) || 0, estado: r.estado || 'Pendiente',
    }));

    const quotes = quoteRows.filter(r => r.id).map(r => ({
      id: String(r.id), fecha: String(r.fecha), clientId: r.cliente_id, recipeId: r.receta_id,
      recipeName: (recipes.find(x => x.id === r.receta_id) || {}).name || '',
      volumeM3: Number(r.volumen_m3) || 0, precioM3: Number(r.precio_q_m3) || 0, total: Number(r.total_q) || 0,
      vigencia: r.vigencia || null, notas: r.notas || '', estado: r.estado || 'Pendiente',
    }));

    const maxPONum = purchaseOrders.reduce((m, o) => Math.max(m, numFromId(o.id)), 0);
    const maxQuoteNum = quotes.reduce((m, q) => Math.max(m, numFromId(q.id)), 0);

    return {
      ...d,
      inventory,
      recipes: recipes.length ? recipes : d.recipes,
      clients: clients.length ? clients : d.clients,
      orders: orders.length ? orders : d.orders,
      fleet: fleet.length ? fleet : d.fleet,
      dispatches,
      maintenance,
      suppliers: suppliers.length ? suppliers : d.suppliers,
      purchaseOrders: purchaseOrders.length ? purchaseOrders : d.purchaseOrders,
      quotes: quotes.length ? quotes : d.quotes,
      nextOrderNum: maxOrderNum + 1,
      nextMaintNum: maxMaintNum + 1,
      nextCamionNum: maxCamionNum + 1,
      nextBombaNum: maxBombaNum + 1,
      nextPONum: maxPONum + 1,
      nextQuoteNum: maxQuoteNum + 1,
    };
  });
}

function Datos({ data, setData }) {
  const [status, setStatus] = useState(null);
  const [busy, setBusy] = useState(false);
  const fileRef = React.useRef(null);

  const clearTestData = () => {
    if (!window.confirm('Esto borra inventario (lo pone en 0), órdenes, despachos activos e historial de viajes. NO borra tu flota, recetas, clientes ni mantenimiento. Úsalo solo para limpiar datos de prueba antes de empezar en serio. ¿Continuar?')) return;
    setData(d => {
      const inventory = {};
      Object.entries(d.inventory).forEach(([k, v]) => { inventory[k] = { ...v, qty: 0 }; });
      return { ...d, inventory, orders: [], dispatches: {}, trips: [], nextOrderNum: 1 };
    });
  };

  const doExport = () => {
    const wb = buildWorkbook(data);
    XLSX.writeFile(wb, `occicon-salcaja-datos-${todayStr()}.xlsx`);
  };

  const respaldoDisponible = (() => {
    try { return !!localStorage.getItem(STORAGE_KEY + '-respaldo'); } catch (e) { return false; }
  })();
  const [restoreStatus, setRestoreStatus] = useState(null);
  const restoreBackup = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY + '-respaldo');
      if (!raw) { setRestoreStatus({ ok: false, msg: 'No hay ningún respaldo guardado en este dispositivo.' }); return; }
      if (!window.confirm('Esto reemplaza los datos actuales por el último respaldo guardado en este dispositivo. ¿Continuar?')) return;
      const backup = JSON.parse(raw);
      setData(() => backup);
      setRestoreStatus({ ok: true, msg: 'Respaldo restaurado. Revisa que todo esté correcto.' });
    } catch (e) {
      setRestoreStatus({ ok: false, msg: 'No se pudo leer el respaldo: ' + e.message });
    }
  };

  const onFileChosen = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setBusy(true);
    setStatus(null);
    try {
      await importWorkbook(file, setData);
      setStatus({ ok: true, msg: 'Datos importados correctamente desde el Excel.' });
    } catch (err) {
      setStatus({ ok: false, msg: 'No se pudo leer el archivo. Verifica que sea un .xlsx con las mismas pestañas y encabezados de la plantilla.' });
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = '';
    }
  };

  // ---- Salud de la base de datos: para saber cuándo conviene migrar a tablas reales ----
  const dataSizeKB = useMemo(() => {
    try { return Math.round(new Blob([JSON.stringify(data)]).size / 1024); } catch (e) { return 0; }
  }, [data]);
  const totalRegistros = (data.orders?.length || 0) + (data.trips?.length || 0) + (data.invoices?.length || 0)
    + (data.bankMovements?.length || 0) + (data.maintenance?.length || 0) + (data.quotes?.length || 0)
    + (data.purchaseOrders?.length || 0) + (data.auditLog?.length || 0);
  const saludNivel = dataSizeKB > 3000 ? 'alto' : dataSizeKB > 1000 ? 'medio' : 'bajo';
  const saludColor = saludNivel === 'alto' ? '#B54834' : saludNivel === 'medio' ? '#F2A900' : '#07E55E';

  return (
    <div>
      <Eyebrow>Excel ↔ App</Eyebrow>
      <H1>Datos</H1>

      {respaldoDisponible && (
        <Card style={{ marginTop: 16, borderColor: '#6B3226', background: '#241511' }}>
          <div style={{ fontWeight: 700, marginBottom: 6, color: '#F2A900' }}>Hay un respaldo local guardado en este dispositivo</div>
          <div style={{ fontSize: 12, color: '#B9B4A8', marginBottom: 10 }}>
            Se guarda automáticamente cada vez que un cambio no logra subir a la nube, para no perder información. Solo restaura esto si sabes que perdiste un cambio reciente.
          </div>
          {restoreStatus && <div style={{ fontSize: 12, color: restoreStatus.ok ? '#07E55E' : '#B54834', marginBottom: 8 }}>{restoreStatus.msg}</div>}
          <Btn variant="ghost" onClick={restoreBackup}>Ver / restaurar respaldo</Btn>
        </Card>
      )}

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 6 }}>Salud de la base de datos</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
          <span style={{ width: 10, height: 10, borderRadius: '50%', background: saludColor, display: 'inline-block' }} />
          <span style={{ fontSize: 13, fontWeight: 700, color: saludColor, textTransform: 'capitalize' }}>Nivel {saludNivel}</span>
          <span style={{ fontSize: 12, color: '#A39D93' }}>· {dataSizeKB} KB · {totalRegistros} registros históricos</span>
        </div>
        <div style={{ fontSize: 12, color: '#B9B4A8', lineHeight: 1.6 }}>
          Toda la información de la app vive en un solo bloque en Supabase — funciona rápido hasta cierto tamaño.
          Cuando este indicador pase a <span style={{ color: '#F2A900' }}>medio</span> o <span style={{ color: '#B54834' }}>alto</span>,
          es momento de platicar sobre migrar a una base de datos con tablas separadas (una migración más grande, pero
          que se planea con tiempo, no de urgencia). Por ahora, con el tamaño actual, no hace falta.
        </div>
      </Card>

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 6 }}>Diagnóstico rápido — Inventario en memoria ahora mismo</div>
        <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
          Si algo no cuadra con lo que ves en Inventario, manda captura de esto — es justo lo que la app tiene cargado en este momento, sin ir a Supabase.
        </div>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: '#B9B4A8', background: '#171614', padding: 10, borderRadius: 3, maxHeight: 200, overflowY: 'auto' }}>
          {Object.entries(data.inventory).map(([k, v]) => (
            <div key={k}>{k}: {v.qty} {v.unit} ({v.label})</div>
          ))}
        </div>
      </Card>


      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 800 ? '1fr 1fr' : '1fr', gap: 16, marginTop: 16 }}>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 6 }}>Exportar a Excel</div>
          <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 12 }}>
            Descarga todo lo que tienes cargado ahora mismo (inventario, recetas, clientes, órdenes, flota, despachos y mantenimiento) en un archivo .xlsx con la misma estructura de la plantilla.
          </div>
          <Btn variant="accent" onClick={doExport}><FileSpreadsheet size={14} /> Descargar Excel</Btn>
        </Card>

        <Card>
          <div style={{ fontWeight: 700, marginBottom: 6 }}>Importar desde Excel</div>
          <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 12 }}>
            Sube un .xlsx con la misma estructura de la plantilla (pestañas: Inventario, Recetas, Clientes, Ordenes, Flota, Despachos, Mantenimiento). Esto <strong>reemplaza</strong> los datos actuales de la app por los del archivo.
          </div>
          <input ref={fileRef} type="file" accept=".xlsx" onChange={onFileChosen} disabled={busy}
                 style={{ fontSize: 13, marginBottom: 10 }} />
          {busy && <div style={{ fontSize: 12, color: '#A39D93' }}>Importando…</div>}
          {status && (
            <div style={{ fontSize: 12, color: status.ok ? '#07E55E' : '#B54834', marginTop: 6 }}>{status.msg}</div>
          )}
        </Card>
      </div>

      <Card style={{ marginTop: 16, borderColor: '#6B3226', background: '#241511' }}>
        <div style={{ fontWeight: 700, marginBottom: 6, color: '#B54834' }}>Limpiar datos de prueba</div>
        <div style={{ fontSize: 12, color: '#B9B4A8', marginBottom: 12 }}>
          Pone el inventario en 0 y borra órdenes, despachos activos e historial de viajes — útil después de hacer pruebas,
          antes de empezar a usar la app con datos reales. No afecta flota, recetas, clientes ni mantenimiento.
        </div>
        <Btn variant="ghost" onClick={clearTestData} style={{ borderColor: '#6B3226', color: '#B54834' }}>
          <AlertTriangle size={14} /> Borrar datos de prueba
        </Btn>
      </Card>

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 6 }}>Cómo funciona esta conexión</div>
        <div style={{ fontSize: 12, color: '#B9B4A8', lineHeight: 1.6 }}>
          Esto no es una sincronización automática en vivo — es manual, en ambos sentidos. Exporta cuando quieras un respaldo
          o para editar datos masivamente en Excel; importa cuando quieras que esos cambios entren a la app. Para que varios
          dispositivos vean lo mismo en tiempo real sin pasos manuales, se necesitaría una base de datos en la nube (ej. Supabase)
          en vez de un archivo Excel.
        </div>
      </Card>
    </div>
  );
}

const PERMISSION_TABS = NAV; // mismas secciones que el menú principal

function Usuarios({ username, data: plantData, setData: setPlantData }) {
  const [profiles, setProfiles] = useState(null);
  const [loadError, setLoadError] = useState('');
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ username: '', password: '', role: 'user', permissions: {} });
  const [formError, setFormError] = useState('');
  const [busy, setBusy] = useState(false);
  const [resetTarget, setResetTarget] = useState(null);
  const [resetPw, setResetPw] = useState('');
  const [resetError, setResetError] = useState('');

  const loadProfiles = async () => {
    setLoadError('');
    const { data, error } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending: true });
    if (error) setLoadError(error.message);
    else setProfiles(data);
  };

  useEffect(() => { loadProfiles(); }, []);

  const togglePerm = (tabId) => setForm(f => ({ ...f, permissions: { ...f.permissions, [tabId]: !f.permissions[tabId] } }));

  const createUser = async () => {
    if (!form.username.trim()) { setFormError('Ponle un nombre de usuario.'); return; }
    if (form.password.length < 4) { setFormError('La contraseña debe tener al menos 4 caracteres.'); return; }
    setBusy(true); setFormError('');
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const { data, error } = await supabaseClient.functions.invoke('manage-users', {
        body: { action: 'create', username: form.username, password: form.password, role: form.role, permissions: form.permissions },
        headers: { Authorization: `Bearer ${session.access_token}` },
      });
      if (error) throw error;
      if (data && data.error) throw new Error(data.error);
      if (setPlantData) logAudit(setPlantData, username, 'Usuario creado', `${form.username} (${form.role})`);
      setForm({ username: '', password: '', role: 'user', permissions: {} });
      setShowAdd(false);
      loadProfiles();
    } catch (e) {
      setFormError(e.message || 'No se pudo crear el usuario. Verifica que la función "manage-users" esté desplegada.');
    }
    setBusy(false);
  };

  const updateProfile = async (id, patch, targetUsername) => {
    await supabaseClient.from('profiles').update(patch).eq('id', id);
    if (setPlantData) logAudit(setPlantData, username, 'Permisos/rol de usuario modificados', `${targetUsername || id} · ${JSON.stringify(patch)}`);
    loadProfiles();
  };

  const doResetPassword = async () => {
    if (resetPw.length < 4) { setResetError('La contraseña debe tener al menos 4 caracteres.'); return; }
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const { data, error } = await supabaseClient.functions.invoke('manage-users', {
        body: { action: 'reset_password', userId: resetTarget.id, password: resetPw },
        headers: { Authorization: `Bearer ${session.access_token}` },
      });
      if (error) throw error;
      if (data && data.error) throw new Error(data.error);
      if (setPlantData) logAudit(setPlantData, username, 'Contraseña reiniciada', resetTarget.username);
      setResetTarget(null); setResetPw(''); setResetError('');
      loadProfiles();
    } catch (e) {
      setResetError(e.message || 'No se pudo reiniciar la contraseña.');
    }
  };

  return (
    <div>
      <Eyebrow>Administración</Eyebrow>
      <H1>Usuarios</H1>
      <div style={{ fontSize: 12, color: '#A39D93', marginTop: 6 }}>
        Los administradores ven todas las secciones automáticamente. Para un usuario normal, marca a qué secciones tiene acceso.
      </div>

      <Card style={{ marginTop: 16 }}>
        <button onClick={() => setShowAdd(s => !s)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#07E55E', fontSize: 13, fontWeight: 700, padding: 0 }}>
          {showAdd ? 'Ocultar' : '+ Crear nuevo usuario'}
        </button>
        {showAdd && (
          <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid #333330' }}>
            <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 700 ? '1fr 1fr' : '1fr', gap: 8 }}>
              <Field label="Usuario">
                <input style={inputStyle} value={form.username} onChange={e => setForm(f => ({ ...f, username: e.target.value }))} autoCapitalize="none" />
              </Field>
              <Field label="Contraseña inicial">
                <input style={inputStyle} value={form.password} onChange={e => setForm(f => ({ ...f, password: e.target.value }))} />
              </Field>
            </div>
            <Field label="Rol">
              <select style={inputStyle} value={form.role} onChange={e => setForm(f => ({ ...f, role: e.target.value }))}>
                <option value="user">Usuario (acceso limitado)</option>
                <option value="admin">Administrador (acceso total)</option>
              </select>
            </Field>
            {form.role === 'user' && (
              <div style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: '#B9B4A8', marginBottom: 6 }}>Acceso a secciones</div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                  {PERMISSION_TABS.map(t => (
                    <label key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 12, color: '#B9B4A8', background: '#201E1B', padding: '5px 8px', borderRadius: 3 }}>
                      <input type="checkbox" checked={!!form.permissions[t.id]} onChange={() => togglePerm(t.id)} />
                      {t.label}
                    </label>
                  ))}
                </div>
              </div>
            )}
            {formError && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{formError}</div>}
            <Btn variant="accent" onClick={createUser} disabled={busy}><Plus size={14} /> {busy ? 'Creando…' : 'Crear usuario'}</Btn>
          </div>
        )}
      </Card>

      {loadError && (
        <Card style={{ marginTop: 16, borderColor: '#6B3226', background: '#241511' }}>
          <div style={{ color: '#B54834', fontSize: 12 }}>No se pudo cargar la lista de usuarios: {loadError}</div>
        </Card>
      )}

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Usuarios registrados</div>
        {!profiles && <div style={{ color: '#A39D93', fontSize: 13 }}>Cargando…</div>}
        {profiles && profiles.length === 0 && <div style={{ color: '#A39D93', fontSize: 13 }}>No hay usuarios todavía.</div>}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {(profiles || []).map(p => (
            <div key={p.id} style={{ border: '1px solid #333330', borderRadius: 4, padding: 12 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 6 }}>
                <div>
                  <div style={{ fontWeight: 700, color: '#F2F0EB' }}>{p.username} {p.role === 'admin' && <span style={{ color: '#07E55E', fontSize: 11 }}>(admin)</span>}</div>
                  {p.must_change_password && <div style={{ fontSize: 11, color: '#F2A900' }}>pendiente: debe cambiar su contraseña</div>}
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <select value={p.role} onChange={e => updateProfile(p.id, { role: e.target.value }, p.username)} style={{ ...inputStyle, width: 'auto', padding: '4px 8px', fontSize: 11 }}>
                    <option value="user">Usuario</option>
                    <option value="admin">Administrador</option>
                  </select>
                  <Btn variant="ghost" onClick={() => { setResetTarget(p); setResetPw(''); setResetError(''); }} style={{ padding: '5px 10px', fontSize: 11 }}>Reiniciar clave</Btn>
                </div>
              </div>
              {p.role === 'user' && (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 10, paddingTop: 10, borderTop: '1px solid #333330' }}>
                  {PERMISSION_TABS.map(t => (
                    <label key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 12, color: '#B9B4A8', background: '#201E1B', padding: '5px 8px', borderRadius: 3 }}>
                      <input type="checkbox" checked={!!(p.permissions || {})[t.id]}
                        onChange={() => updateProfile(p.id, { permissions: { ...(p.permissions || {}), [t.id]: !(p.permissions || {})[t.id] } }, p.username)} />
                      {t.label}
                    </label>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      </Card>

      {resetTarget && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <Card style={{ maxWidth: 360, width: '100%' }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Reiniciar contraseña de {resetTarget.username}</div>
            <Field label="Nueva contraseña temporal">
              <input style={inputStyle} value={resetPw} onChange={e => setResetPw(e.target.value)} />
            </Field>
            <div style={{ fontSize: 11, color: '#A39D93', marginBottom: 10 }}>El usuario tendrá que cambiarla al iniciar sesión.</div>
            {resetError && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{resetError}</div>}
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn variant="accent" onClick={doResetPassword}><Check size={14} /> Guardar</Btn>
              <Btn variant="ghost" onClick={() => setResetTarget(null)}>Cancelar</Btn>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}


function Auditoria({ data }) {
  const [filtroUsuario, setFiltroUsuario] = useState('');
  const [filtroAccion, setFiltroAccion] = useState('');
  const [desde, setDesde] = useState('');

  const log = data.auditLog || [];
  const usuarios = [...new Set(log.map(e => e.username))].sort();
  const acciones = [...new Set(log.map(e => e.action))].sort();

  const filtrado = [...log].reverse().filter(e => {
    if (filtroUsuario && e.username !== filtroUsuario) return false;
    if (filtroAccion && e.action !== filtroAccion) return false;
    if (desde && e.ts.slice(0, 10) < desde) return false;
    return true;
  });

  const fmt = (iso) => {
    const d = new Date(iso);
    return d.toLocaleString('es-GT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  };

  return (
    <div>
      <Eyebrow>Solo administradores</Eyebrow>
      <H1>Auditoría</H1>
      <div style={{ fontSize: 12, color: '#A39D93', marginTop: 6 }}>
        Registro de quién hizo qué y cuándo, en las acciones más sensibles de la app (inventario, órdenes, clientes, compras, usuarios). Se guardan los últimos 500 movimientos.
      </div>

      <Card style={{ marginTop: 16 }}>
        <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 700 ? '1fr 1fr 1fr' : '1fr', gap: 8 }}>
          <Field label="Usuario">
            <select style={inputStyle} value={filtroUsuario} onChange={e => setFiltroUsuario(e.target.value)}>
              <option value="">Todos</option>
              {usuarios.map(u => <option key={u} value={u}>{u}</option>)}
            </select>
          </Field>
          <Field label="Acción">
            <select style={inputStyle} value={filtroAccion} onChange={e => setFiltroAccion(e.target.value)}>
              <option value="">Todas</option>
              {acciones.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
          <Field label="Desde">
            <input type="date" style={inputStyle} value={desde} onChange={e => setDesde(e.target.value)} />
          </Field>
        </div>
      </Card>

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>{filtrado.length} registro{filtrado.length === 1 ? '' : 's'}</div>
        {filtrado.length === 0 && <div style={{ fontSize: 13, color: '#A39D93' }}>Sin movimientos registrados todavía.</div>}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 600, overflowY: 'auto' }}>
          {filtrado.map(e => (
            <div key={e.id} style={{ borderBottom: '1px solid #333330', paddingBottom: 8 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, flexWrap: 'wrap' }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: '#F2F0EB' }}>{e.action}</div>
                <div style={{ fontSize: 11, color: '#A39D93', fontFamily: "'IBM Plex Mono', monospace" }}>{fmt(e.ts)}</div>
              </div>
              <div style={{ fontSize: 12, color: '#B9B4A8' }}>{e.details}</div>
              <div style={{ fontSize: 11, color: '#07E55E' }}>{e.username}</div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}


function Papelera({ data, setData, username }) {
  const trash = data.trash || [];
  const [confirmPurge, setConfirmPurge] = useState(null);

  const restore = (t) => {
    setData(d => {
      let next;

      if (t.category === 'material') {
        const { key, ...materialData } = t.item;
        next = { ...d, inventory: { ...d.inventory, [key]: materialData } };
      } else {
        const field = TRASH_CATEGORIES[t.category].field;
        next = { ...d, [field]: [...d[field], t.item] };

        // Caso especial: al restaurar una orden de producción, se vuelve a descontar
        // el material del inventario (al eliminarla se había devuelto).
        if (t.category === 'orden') {
          const recipe = d.recipes.find(r => r.id === t.item.recipeId);
          if (recipe) {
            const inventory = { ...next.inventory };
            Object.entries(recipe.materiales || {}).forEach(([k, cantPorM3]) => {
              if (inventory[k]) inventory[k] = { ...inventory[k], qty: +(inventory[k].qty - cantPorM3 * t.item.volumeM3).toFixed(2) };
            });
            next.inventory = inventory;
          }
        }
      }

      next.trash = d.trash.filter(x => x.id !== t.id);
      return next;
    });
    logAudit(setData, username, `${TRASH_CATEGORIES[t.category].label} restaurado`, t.label || '');
  };

  const purge = (t) => {
    setData(d => ({ ...d, trash: d.trash.filter(x => x.id !== t.id) }));
    logAudit(setData, username, `${TRASH_CATEGORIES[t.category].label} eliminado definitivamente`, t.label || '');
    setConfirmPurge(null);
  };

  const fmt = (iso) => new Date(iso).toLocaleString('es-GT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const diasRestantes = (iso) => Math.max(0, 30 - Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));

  return (
    <div>
      <Eyebrow>Recuperar elementos eliminados</Eyebrow>
      <H1>Papelera</H1>
      <div style={{ fontSize: 12, color: '#A39D93', marginTop: 6 }}>
        Lo que borres desde cualquier pestaña llega aquí primero — puedes restaurarlo o borrarlo para siempre. Se elimina solo automáticamente después de 30 días.
      </div>

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>{trash.length} elemento{trash.length === 1 ? '' : 's'} en la papelera</div>
        {trash.length === 0 && <div style={{ fontSize: 13, color: '#A39D93' }}>Nada por aquí — la papelera está vacía.</div>}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {[...trash].reverse().map(t => (
            <div key={t.id} style={{ border: '1px solid #333330', borderRadius: 4, padding: 12 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 8 }}>
                <div>
                  <div style={{ fontSize: 11, color: '#07E55E', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em' }}>{TRASH_CATEGORIES[t.category].label}</div>
                  <div style={{ fontWeight: 700, color: '#F2F0EB' }}>{t.label}</div>
                  <div style={{ fontSize: 11, color: '#A39D93' }}>Eliminado por {t.deletedBy} · {fmt(t.deletedAt)} · se borra en {diasRestantes(t.deletedAt)} días</div>
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <Btn variant="accent" onClick={() => restore(t)} style={{ padding: '6px 10px', fontSize: 12 }}><Undo2 size={13} /> Restaurar</Btn>
                  <Btn variant="ghost" onClick={() => setConfirmPurge(t)} style={{ padding: '6px 10px', fontSize: 12, borderColor: '#6B3226', color: '#B54834' }}><Trash2 size={13} /></Btn>
                </div>
              </div>
            </div>
          ))}
        </div>
      </Card>

      {confirmPurge && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <Card style={{ maxWidth: 360, width: '100%', borderColor: '#6B3226' }}>
            <div style={{ fontWeight: 700, marginBottom: 10, color: '#B54834' }}>¿Eliminar definitivamente?</div>
            <div style={{ fontSize: 13, color: '#B9B4A8', marginBottom: 16 }}>"{confirmPurge.label}" se borrará para siempre — esto no se puede deshacer.</div>
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn variant="ghost" onClick={() => purge(confirmPurge)} style={{ borderColor: '#6B3226', color: '#B54834' }}>Sí, borrar para siempre</Btn>
              <Btn variant="ghost" onClick={() => setConfirmPurge(null)}>Cancelar</Btn>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}


class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('Error atrapado:', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: '100vh', background: '#121212', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, fontFamily: "'Inter', sans-serif" }}>
          <div style={{ maxWidth: 480, background: '#1C1B19', border: '1px solid #6B3226', borderRadius: 4, padding: 24 }}>
            <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 900, fontSize: 22, color: '#B54834', textTransform: 'uppercase', marginBottom: 8 }}>
              Algo salió mal
            </div>
            <div style={{ fontSize: 13, color: '#B9B4A8', marginBottom: 6 }}>
              La app encontró un error inesperado y se detuvo para evitar mostrar datos incorrectos. Tus datos en la nube están a salvo.
            </div>
            <div style={{ fontSize: 11, color: '#A39D93', fontFamily: "'IBM Plex Mono', monospace", marginBottom: 16, wordBreak: 'break-word' }}>
              {String(this.state.error && this.state.error.message || this.state.error)}
            </div>
            <button onClick={() => window.location.reload()} style={{ background: '#2A2724', color: '#07E55E', border: 'none', borderRadius: 3, padding: '10px 18px', fontWeight: 600, cursor: 'pointer' }}>
              Recargar la app
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
