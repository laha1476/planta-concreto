          {tipo === 'recibida' && (
            <Field label="Concepto (ej. combustible, materiales, mano de obra…)">
              <input style={inputStyle} value={form.concepto} onChange={e => setForm(f => ({ ...f, concepto: e.target.value }))} placeholder="Ayuda a reconocer la factura al conciliar" />
            </Field>
          )}
          <Field label="Monto total (Q)">
            <input type="number" min="0" step="0.01" style={inputStyle} value={form.monto} onChange={e => setForm(f => ({ ...f, monto: e.target.value }))} />
          </Field>
          {error && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{error}</div>}
          <Btn variant="accent" onClick={add}><Plus size={14} /> Agregar factura</Btn>
        </Card>

        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>{tipo === 'emitida' ? 'Facturas emitidas' : 'Facturas recibidas'}</div>
          {filtered.length === 0 && <div style={{ color: '#A39D93', fontSize: 13 }}>Aún no hay facturas {tipo === 'emitida' ? 'emitidas' : 'recibidas'}.</div>}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 600, overflowY: 'auto' }}>
            {[...filtered].reverse().map(f => (
              <div key={f.id} style={{ border: '1px solid #333330', borderRadius: 4, padding: 10 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                  <div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: '#F2F0EB' }}>{f.numero}</div>
                    <div style={{ fontSize: 12, color: '#A39D93' }}>{f.fecha}{f.contraparte ? ` · ${f.contraparte}` : ''}</div>
                    {f.conciliada && <div style={{ fontSize: 11, color: '#07E55E' }}>✓ conciliada con banco</div>}
                  </div>
                  <button onClick={() => remove(f.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={14} /></button>
                </div>
                {tipo === 'recibida' && (
                  <input
                    value={f.concepto || ''}
                    onChange={e => setConcepto(f.id, e.target.value)}
                    placeholder="Concepto (ej. combustible, materiales…) — clic para agregar o editar"
                    style={{ ...inputStyle, fontSize: 11, marginTop: 6, fontStyle: f.concepto ? 'normal' : 'italic' }}
                  />
                )}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 6 }}>
                  <div style={{ fontWeight: 700 }}>{fmtQ(f.monto)}</div>
                  <select value={f.estado} onChange={e => setEstado(f.id, e.target.value)}
                    style={{ ...inputStyle, width: 'auto', padding: '4px 8px', fontSize: 11, color: INVOICE_COLORS[f.estado] }}>
                    {INVOICE_ESTADOS.map(e => <option key={e} value={e}>{e}</option>)}
                  </select>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}

function Conciliacion({ data, setData }) {
  const [colMap, setColMap] = useState(null);
  const [importStatus, setImportStatus] = useState(null);
  const [toleranciaDias, setToleranciaDias] = useState(5);
  const [showReport, setShowReport] = useState(false);
  const [showLibroBancos, setShowLibroBancos] = useState(false);
  const [mesFiltro, setMesFiltro] = useState(''); // '' = todos los meses, si no 'YYYY-MM'
  const [depForm, setDepForm] = useState({ concepto: '', boleta: '', fecha: '', valor: '' });
  const [cheForm, setCheForm] = useState({ concepto: '', noCheque: '', fecha: '', valor: '' });
  const [reglaForm, setReglaForm] = useState({ palabraClave: '', categoria: 'Mano de obra' });
  const [buscarBanco, setBuscarBanco] = useState('');
  const [dividiendoId, setDividiendoId] = useState(null);
  const [splitRows, setSplitRows] = useState([{ invoiceId: '', monto: '' }, { invoiceId: '', monto: '' }]);
  const [editingMovId, setEditingMovId] = useState(null);
  const [propuesta, setPropuesta] = useState(null); // { pares: [{...}], sinCubrir }
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [buscarFactura, setBuscarFactura] = useState('');
  const fileRef = React.useRef(null);

  const onFileChosen = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImportStatus(null);
    const isTxt = /\.(txt|csv)$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        let headers, dataRows;
        if (isTxt) {
          const text = ev.target.result;
          const delim = text.includes('\t') ? '\t' : (text.includes(';') ? ';' : ',');
          const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
          const parsed = lines.map(l => l.split(delim).map(c => c.trim().replace(/^"|"$/g, '')));
          headers = parsed[0].map(h => String(h));
          dataRows = parsed.slice(1);
        } else {
          const wb = XLSX.read(ev.target.result, { type: 'array' });
          // Algunos bancos (y tus reportes de "Libro de Bancos") traen varias hojas, y no
          // siempre la que tiene los movimientos es la primera — a veces es un resumen.
          // Por eso buscamos, en TODAS las hojas, la fila que realmente parece encabezado
          // (la que tiene una celda "Fecha"), en vez de asumir que es la fila 1 de la hoja 1.
          let found = null;
          for (const sheetName of wb.SheetNames) {
            const sheet = wb.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            for (let i = 0; i < Math.min(rows.length, 20); i++) {
              const row = rows[i].map(c => String(c).trim().toLowerCase());
              if (row.includes('fecha')) { found = { rows, headerRow: i }; break; }
            }
            if (found) break;
          }
          if (!found) {
            // Respaldo: si ninguna hoja tiene una fila con "Fecha", usamos la primera hoja
            // tal cual, como antes (para no romper archivos simples ya probados).
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            found = { rows, headerRow: 0 };
          }
          headers = found.rows[found.headerRow].map(h => String(h));
          dataRows = found.rows.slice(found.headerRow + 1).filter(r => r.some(c => c !== ''));
        }
        if (!headers || dataRows.length === 0) { setImportStatus({ ok: false, msg: 'No se encontraron filas de datos en el archivo.' }); return; }
        // Auto-sugerir el mapeo cuando los nombres de columna coinciden con los típicos
        // de tu "Libro de Bancos" (Fecha, Beneficiario/Descripción, Debe, Haber).
        const findCol = (...candidatos) => headers.find(h => candidatos.some(c => h.toLowerCase().trim() === c)) || '';
        const mapping = {
          fecha: findCol('fecha'),
          descripcion: findCol('beneficiario/descripción', 'descripción', 'descripcion', 'concepto'),
          monto: findCol('monto', 'importe'),
          debe: findCol('debe'),
          haber: findCol('haber'),
        };
        setColMap({ headers, rows: dataRows, mapping });
      } catch (err) {
        setImportStatus({ ok: false, msg: 'No se pudo leer el archivo: ' + err.message });
      }
    };
    if (isTxt) reader.readAsText(file); else reader.readAsArrayBuffer(file);
    if (fileRef.current) fileRef.current.value = '';
  };

  const confirmImport = () => {
    const { headers, rows, mapping } = colMap;
    const tieneMonto = !!mapping.monto;
    const tieneDebeHaber = !!mapping.debe || !!mapping.haber;
    if (!mapping.fecha || (!tieneMonto && !tieneDebeHaber)) {
      setImportStatus({ ok: false, msg: 'Indica al menos la columna de fecha, y de monto (o Debe/Haber).' });
      return;
    }
    const idx = (name) => headers.indexOf(mapping[name]);
    const iFecha = idx('fecha'), iDesc = idx('descripcion'), iMonto = idx('monto');
    const iDebe = idx('debe'), iHaber = idx('haber');
    const numFrom = (v) => {
      const raw = String(v == null ? '' : v).replace(/,/g, '').replace(/[^\d.\-]/g, '');
      const n = parseFloat(raw);
      return isNaN(n) ? 0 : n;
    };

    let nextNum = data.nextBankImportNum;
    const nuevos = [];
    rows.forEach(r => {
      // Si viene con Debe/Haber por separado (el formato típico de un Libro de Bancos),
      // el monto queda negativo cuando es un cargo (Debe) y positivo cuando es un abono
      // (Haber) — así el resto de la app (Debe/Haber en el PDF, reglas, conciliación)
      // sabe distinguir gastos de ingresos sin ambigüedad.
      let monto;
      if (tieneDebeHaber) {
        const debeVal = iDebe > -1 ? numFrom(r[iDebe]) : 0;
        const haberVal = iHaber > -1 ? numFrom(r[iHaber]) : 0;
        monto = haberVal - Math.abs(debeVal);
      } else {
        monto = numFrom(r[iMonto]);
      }
      if (!monto) return;
      let fecha = r[iFecha];
      if (typeof fecha === 'number') {
        const d0 = new Date(Math.round((fecha - 25569) * 86400 * 1000));
        fecha = d0.toISOString().slice(0, 10);
      } else {
        fecha = String(fecha).slice(0, 10);
      }
      nuevos.push({
        id: `B-${String(nextNum).padStart(6, '0')}`, fecha, descripcion: iDesc > -1 ? String(r[iDesc] || '') : '',
        monto: +monto.toFixed(2), conciliado: false, invoiceId: null,
      });
      nextNum++;
    });

    setData(d => ({ ...d, bankMovements: [...d.bankMovements, ...nuevos], nextBankImportNum: nextNum }));
    setImportStatus({ ok: true, msg: `Se importaron ${nuevos.length} movimientos bancarios.` });
    setColMap(null);
  };

  // ---- Motor de conciliación automática ----
  const MARGEN_CONCILIACION = 0.05; // margen en centavos para dar por completa una conciliación

  // Una factura se da por conciliada cuando la suma de TODOS los movimientos de banco
  // vinculados a ella (uno o varios, para pagos en abonos) alcanza su monto total.
  const invoiceCompleta = (invoice, bankMovementsList) => {
    if (!invoice) return false;
    const linkedTotal = bankMovementsList
      .filter(m => m.invoiceId === invoice.id)
      .reduce((s, m) => s + Math.abs(m.monto), 0);
    return Math.abs(linkedTotal - invoice.monto) <= MARGEN_CONCILIACION;
  };

  // Extrae un posible número de factura de la descripción del banco, ej. "fact 3448260546"
  // o "FACT4084089831" -> "3448260546". Solo el bloque de dígitos, sin la palabra "fact".
  const extraerNumeroFactura = (descripcion) => {
    const m = String(descripcion || '').match(/fact\w*\s*#?\s*(\d{4,})/i);
    return m ? m[1] : null;
  };
  const soloDigitos = (s) => String(s || '').replace(/\D/g, '');

  // Deshace TODO lo que la conciliación haya vinculado o categorizado: desvincula todos
  // los movimientos de banco (auto, manual o por regla), desmarca todas las facturas
  // como conciliadas (regresándolas a "Pendiente" si estaban en "Pagada"), y borra los
  // Costos Indirectos que se crearon automáticamente por las reglas. No toca los montos,
  // fechas ni descripciones de nada — solo los vínculos entre banco y facturas.
  const reiniciarConciliacion = () => {
    setData(d => {
      const overheadIdsDeReglas = new Set(
        d.bankMovements.filter(m => m.overheadCostId).map(m => m.overheadCostId)
      );
      const bankMovements = d.bankMovements.map(m => ({
        ...m, conciliado: false, invoiceId: null, origen: null, overheadCostId: null,
      }));
      const invoices = d.invoices.map(f => ({
        ...f, conciliada: false, estado: f.estado === 'Pagada' ? 'Pendiente' : f.estado,
      }));
      const overheadCosts = d.overheadCosts.filter(o => !overheadIdsDeReglas.has(o.id));
      return { ...d, bankMovements, invoices, overheadCosts };
    });
    setShowResetConfirm(false);
    setPropuesta(null);
    setImportStatus({ ok: true, msg: 'Conciliación reiniciada: se deshicieron todos los vínculos y categorizaciones automáticas.' });
  };

  const autoConciliar = () => {
    const tolMs = toleranciaDias * 86400000;
    setData(d => {
      const invoices = d.invoices.map(f => ({ ...f }));
      const movs = d.bankMovements.map(m => ({ ...m }));
      let count = 0;

      // Pasada 1: coincidencia exacta de monto + fecha dentro de la tolerancia (como antes).
      movs.forEach(m => {
        if (m.conciliado) return;
        const mDate = new Date(m.fecha).getTime();
        const match = invoices.find(f =>
          !f.conciliada &&
          Math.abs(f.monto - Math.abs(m.monto)) < 0.01 &&
          Math.abs(new Date(f.fecha).getTime() - mDate) <= tolMs
        );
        if (match) {
          match.conciliada = true; match.estado = 'Pagada';
          m.conciliado = true; m.invoiceId = match.id; m.origen = 'auto';
          count++;
        }
      });

      // Pasada 2: lo que no coincidió por monto+fecha, se busca por el número de factura
      // que viene escrito dentro de la descripción del banco (ej. "fact 3448260546"),
      // comparado contra el número de la factura registrada (solo dígitos, sin importar
      // guiones ni ceros a la izquierda que el banco o el usuario hayan escrito distinto).
      // Si el movimiento es más grande de lo que a esa factura le hace falta, solo se usa
      // la parte necesaria y el resto se separa como un movimiento nuevo, sin vincular
      // (para no "sobre-conciliar" una factura chica con un depósito grande).
      let nextNum = d.nextBankImportNum;
      const extras = [];
      movs.forEach(m => {
        if (m.conciliado) return;
        const numExtraido = extraerNumeroFactura(m.descripcion);
        if (!numExtraido) return;
        const candidatas = invoices.filter(f => !f.conciliada && soloDigitos(f.numero) === numExtraido);
        if (candidatas.length !== 1) return;
        const match = candidatas[0];

        const yaVinculado = movs
          .filter(mm => mm.invoiceId === match.id)
          .reduce((s, mm) => s + Math.abs(mm.monto), 0);
        const restante = match.monto - yaVinculado;
        const montoMovimiento = Math.abs(m.monto);
        const signo = m.monto < 0 ? -1 : 1;

        if (restante > MARGEN_CONCILIACION && montoMovimiento > restante + MARGEN_CONCILIACION) {
          extras.push({
            ...m, id: `B-${String(nextNum).padStart(6, '0')}`,
            monto: +(signo * (montoMovimiento - restante)).toFixed(2), conciliado: false, invoiceId: null, origen: null,
          });
          nextNum++;
          m.monto = +(signo * restante).toFixed(2);
        }

        m.conciliado = true; m.invoiceId = match.id; m.origen = 'auto';
        count++;
        const linkedTotal = movs
          .filter(mm => mm.invoiceId === match.id)
          .reduce((s, mm) => s + Math.abs(mm.monto), 0);
        if (Math.abs(linkedTotal - match.monto) <= MARGEN_CONCILIACION) {
          match.conciliada = true; match.estado = 'Pagada';
        }
      });

      window.__conciliadosAhora = count;
      return { ...d, invoices, bankMovements: [...movs, ...extras], nextBankImportNum: nextNum };
    });
    setImportStatus({ ok: true, msg: 'Conciliación automática ejecutada (por monto+fecha y por número de factura).' });
  };

  // Vincula (manualmente) un movimiento de banco a una factura. Si la factura ya
  // tiene otros movimientos vinculados, este se suma — así se cubren pagos en abonos.
  const manualLink = (movId, invId) => {
    if (!invId) return;
    setData(d => {
      const mov = d.bankMovements.find(m => m.id === movId);
      const inv = d.invoices.find(f => f.id === invId);
      if (!mov || !inv) return d;

      const yaVinculado = d.bankMovements
        .filter(m => m.invoiceId === invId)
        .reduce((s, m) => s + Math.abs(m.monto), 0);
      const restante = inv.monto - yaVinculado;
      const montoMovimiento = Math.abs(mov.monto);

      // Si el movimiento es más grande que lo que a la factura le hace falta, solo se usa
      // la parte necesaria y el resto queda como un movimiento nuevo, sin vincular —
      // así no se "sobre-concilia" una factura chica con un depósito grande.
      if (restante > MARGEN_CONCILIACION && montoMovimiento > restante + MARGEN_CONCILIACION) {
        const signo = mov.monto < 0 ? -1 : 1;
        let nextNum = d.nextBankImportNum;
        const usado = {
          ...mov, id: `B-${String(nextNum).padStart(6, '0')}`,
          monto: +(signo * restante).toFixed(2), conciliado: true, invoiceId: invId, origen: 'manual',
        };
        nextNum++;
        const sobrante = {
          ...mov, id: `B-${String(nextNum).padStart(6, '0')}`,
          monto: +(signo * (montoMovimiento - restante)).toFixed(2), conciliado: false, invoiceId: null, origen: null,
        };
        nextNum++;
        const bankMovements = [...d.bankMovements.filter(m => m.id !== movId), usado, sobrante];
        const invoices = d.invoices.map(f => f.id === invId ? { ...f, conciliada: true, estado: 'Pagada' } : f);
        return { ...d, bankMovements, invoices, nextBankImportNum: nextNum };
      }

      const bankMovements = d.bankMovements.map(m =>
        m.id === movId ? { ...m, conciliado: true, invoiceId: invId, origen: 'manual' } : m
      );
      const completa = invoiceCompleta(inv, bankMovements);
      const invoices = d.invoices.map(f =>
        f.id === invId ? { ...f, conciliada: completa, estado: completa ? 'Pagada' : f.estado } : f
      );
      return { ...d, bankMovements, invoices };
    });
  };

  // Cambia a qué factura apunta un movimiento ya vinculado manualmente (sin pasar por
  // desvincular + volver a elegir). Recalcula el estado de la factura vieja y la nueva.
  const changeManualLink = (movId, newInvId) => {
    if (!newInvId) return;
    setData(d => {
      const mov = d.bankMovements.find(m => m.id === movId);
      const oldInvId = mov ? mov.invoiceId : null;
      const bankMovements = d.bankMovements.map(m =>
        m.id === movId ? { ...m, invoiceId: newInvId, conciliado: true, origen: 'manual' } : m
      );
      let invoices = d.invoices.map(f => {
        if (f.id === newInvId) {
          const completa = invoiceCompleta(f, bankMovements);
          return { ...f, conciliada: completa, estado: completa ? 'Pagada' : f.estado };
        }
        return f;
      });
      if (oldInvId && oldInvId !== newInvId) {
        invoices = invoices.map(f =>
          f.id === oldInvId ? { ...f, conciliada: invoiceCompleta(f, bankMovements) } : f
        );
      }
      return { ...d, bankMovements, invoices };
    });
  };

  // Divide un movimiento de banco (ej. un depósito que en realidad cubre dos o más
  // facturas) en varios movimientos más chicos, uno por cada factura elegida. Si sobra
  // dinero (el depósito era mayor a lo repartido), ese sobrante queda como un movimiento
  // nuevo sin conciliar, disponible para seguir vinculando.
  const splitMovement = (movId, partes) => {
    setData(d => {
      const orig = d.bankMovements.find(m => m.id === movId);
      if (!orig) return d;
      const valid = partes.filter(p => p.invoiceId && parseFloat(p.monto) > 0);
      if (valid.length === 0) return d;
      const totalOriginal = Math.abs(orig.monto);
      const signo = orig.monto < 0 ? -1 : 1;
      const sumaPartes = valid.reduce((s, p) => s + parseFloat(p.monto), 0);
      if (sumaPartes > totalOriginal + MARGEN_CONCILIACION) return d; // no se puede repartir más de lo que hay

      let nextNum = d.nextBankImportNum;
      const nuevos = valid.map(p => {
        const id = `B-${String(nextNum).padStart(6, '0')}`;
        nextNum++;
        return {
          id, fecha: orig.fecha, descripcion: `${orig.descripcion || ''} (dividido)`.trim(),
          monto: +(signo * parseFloat(p.monto)).toFixed(2), conciliado: true, invoiceId: p.invoiceId, origen: 'manual',
        };
      });
      const sobrante = totalOriginal - sumaPartes;
      if (sobrante > MARGEN_CONCILIACION) {
        const id = `B-${String(nextNum).padStart(6, '0')}`;
        nextNum++;
        nuevos.push({
          id, fecha: orig.fecha, descripcion: `${orig.descripcion || ''} (restante sin vincular)`.trim(),
          monto: +(signo * sobrante).toFixed(2), conciliado: false, invoiceId: null, origen: null,
        });
      }

      const bankMovements = [...d.bankMovements.filter(m => m.id !== movId), ...nuevos];
      const invoiceIdsAfectados = [...new Set(valid.map(p => p.invoiceId))];
      const invoices = d.invoices.map(f => {
        if (!invoiceIdsAfectados.includes(f.id)) return f;
        const completa = invoiceCompleta(f, bankMovements);
        return { ...f, conciliada: completa, estado: completa ? 'Pagada' : f.estado };
      });
      return { ...d, bankMovements, invoices, nextBankImportNum: nextNum };
    });
  };


  const unlink = (movId) => {
    setData(d => {
      const mov = d.bankMovements.find(m => m.id === movId);
      if (!mov) return d;

      // Si este movimiento fue categorizado por una regla (costo indirecto automático),
      // se elimina también el registro de costo indirecto que se había creado.
      if (mov.origen === 'regla' && mov.overheadCostId) {
        const bankMovements = d.bankMovements.map(m =>
          m.id === movId ? { ...m, conciliado: false, invoiceId: null, origen: null, overheadCostId: null } : m
        );
        const overheadCosts = d.overheadCosts.filter(o => o.id !== mov.overheadCostId);
        return { ...d, bankMovements, overheadCosts };
      }

      const invId = mov.invoiceId;
      const bankMovements = d.bankMovements.map(m =>
        m.id === movId ? { ...m, conciliado: false, invoiceId: null, origen: null } : m
      );
      let invoices = d.invoices;
      if (invId) {
        const inv = d.invoices.find(f => f.id === invId);
        invoices = d.invoices.map(f =>
          f.id === invId ? { ...f, conciliada: invoiceCompleta(inv, bankMovements) } : f
        );
      }
      return { ...d, bankMovements, invoices };
    });
  };

  // ---- Categorización automática por reglas (gastos recurrentes sin factura) ----
  // Recorre los movimientos de banco pendientes (montos negativos, sin conciliar) y, si la
  // descripción contiene alguna palabra clave configurada, crea un Costo Indirecto automáticamente
  // y marca el movimiento como resuelto (origen: 'regla'), sacándolo de "Banco sin factura".
  const applyReglas = () => {
    setData(d => {
      const reglas = d.reglasCategorizacion || [];
      let nextOverheadNum = d.nextOverheadNum;
      const overheadCosts = [...d.overheadCosts];
      let count = 0;
      const bankMovements = d.bankMovements.map(m => {
        // Ya no exigimos que el monto sea negativo: algunos movimientos quedaron guardados
        // en positivo (según cómo se importaron o capturaron), así que categorizamos por
        // palabra clave sin importar el signo — solo que no esté ya conciliado.
        if (m.conciliado) return m;
        const desc = String(m.descripcion || '').toUpperCase();
        const regla = reglas.find(r => desc.includes(String(r.palabraClave || '').toUpperCase().trim()) && r.palabraClave.trim() !== '');
        if (!regla) return m;
        const id = `OH-${String(nextOverheadNum).padStart(4, '0')}`;
        nextOverheadNum++;
        overheadCosts.push({
          id, mes: (m.fecha || '').slice(0, 7), categoria: regla.categoria,
          descripcion: m.descripcion || regla.palabraClave, monto: +Math.abs(m.monto).toFixed(2),
          bankMovementId: m.id,
        });
        count++;
        return { ...m, conciliado: true, origen: 'regla', overheadCostId: id };
      });
      window.__categorizadosAhora = count;
      return { ...d, bankMovements, overheadCosts, nextOverheadNum };
    });
    setImportStatus({ ok: true, msg: 'Categorización automática por reglas ejecutada.' });
  };

  const addRegla = () => {
    if (!reglaForm.palabraClave.trim()) return;
    setData(d => {
      const id = `R-${String(d.nextReglaNum).padStart(4, '0')}`;
      return {
        ...d,
        nextReglaNum: d.nextReglaNum + 1,
        reglasCategorizacion: [...d.reglasCategorizacion, { id, palabraClave: reglaForm.palabraClave.trim().toUpperCase(), categoria: reglaForm.categoria }],
      };
    });
    setReglaForm({ palabraClave: '', categoria: 'Mano de obra' });
  };
  const deleteRegla = (id) => setData(d => ({ ...d, reglasCategorizacion: d.reglasCategorizacion.filter(r => r.id !== id) }));
  const changeReglaCategoria = (overheadCostId, nuevaCategoria) => {
    setData(d => ({
      ...d,
      overheadCosts: d.overheadCosts.map(o => o.id === overheadCostId ? { ...o, categoria: nuevaCategoria } : o),
    }));
  };

  const bankMovementsF = useMemo(() => mesFiltro ? data.bankMovements.filter(m => (m.fecha || '').startsWith(mesFiltro)) : data.bankMovements, [data.bankMovements, mesFiltro]);


  const invoicesF = useMemo(() => mesFiltro ? data.invoices.filter(f => (f.fecha || '').startsWith(mesFiltro)) : data.invoices, [data.invoices, mesFiltro]);

  const conciliados = bankMovementsF.filter(m => m.conciliado);
  const conciliadosAuto = conciliados.filter(m => m.origen !== 'manual');
  const conciliadosManual = conciliados.filter(m => m.origen === 'manual');
  const bancoSinFactura = bankMovementsF.filter(m => !m.conciliado);
  const facturadoSinBanco = invoicesF.filter(f => !f.conciliada && f.estado !== 'Anulada');
  const bancoSinFacturaFiltrado = bancoSinFactura.filter(m => {
    const q = buscarBanco.trim().toLowerCase();
    if (!q) return true;
    return String(m.descripcion || '').toLowerCase().includes(q)
      || String(m.fecha || '').includes(q)
      || String(m.monto).includes(q);
  });
  const bancoSinFacturaFiltradoTotal = bancoSinFacturaFiltrado.reduce((s, m) => s + Math.abs(m.monto), 0);
  const facturadoSinBancoFiltrado = facturadoSinBanco.filter(f => {
    const q = buscarFactura.trim().toLowerCase();
    if (!q) return true;
    return String(f.numero || '').toLowerCase().includes(q)
      || String(f.contraparte || '').toLowerCase().includes(q)
      || String(f.concepto || '').toLowerCase().includes(q)
      || String(f.fecha || '').includes(q)
      || String(f.monto).includes(q);
  });
  const facturadoSinBancoFiltradoTotal = facturadoSinBancoFiltrado.reduce((s, f) => s + f.monto, 0);

  // Arma una propuesta de conciliación cruzando SOLO lo que quedó visible en los dos
  // buscadores (ej. "combustible" en banco + "un proveedor" en facturas). Reparte cada
  // movimiento contra cada factura en orden de fecha, como una cascada: si el movimiento
  // alcanza para más de una factura, sigue con la siguiente; si una factura necesita más
  // de un movimiento, sigue tomando del siguiente. No aplica nada todavía, solo arma la
  // vista previa para que la revises antes de confirmar.
  const calcularPropuesta = (movimientos, facturas) => {
    const movs = movimientos
      .map(m => ({ id: m.id, fecha: m.fecha, descripcion: m.descripcion, restante: Math.abs(m.monto) }))
      .sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    const invs = facturas
      .map(f => {
        const yaVinculado = data.bankMovements.filter(m => m.invoiceId === f.id).reduce((s, m) => s + Math.abs(m.monto), 0);
        return { id: f.id, fecha: f.fecha, numero: f.numero, restante: Math.max(0, f.monto - yaVinculado) };
      })
      .sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));

    const pares = [];
    let mi = 0, ii = 0;
    while (mi < movs.length && ii < invs.length) {
      const m = movs[mi], inv = invs[ii];
      if (m.restante <= MARGEN_CONCILIACION) { mi++; continue; }
      if (inv.restante <= MARGEN_CONCILIACION) { ii++; continue; }
      const usar = Math.min(m.restante, inv.restante);
      pares.push({ movId: m.id, movDesc: m.descripcion, movFecha: m.fecha, invId: inv.id, invNumero: inv.numero, monto: usar });
      m.restante -= usar;
      inv.restante -= usar;
    }
    const sinCubrirMovs = movs.filter(m => m.restante > MARGEN_CONCILIACION).reduce((s, m) => s + m.restante, 0);
    const sinCubrirInvs = invs.filter(f => f.restante > MARGEN_CONCILIACION).reduce((s, f) => s + f.restante, 0);
    return { pares, sinCubrirMovs, sinCubrirInvs };
  };

  const proponerConciliacion = () => {
    setPropuesta(calcularPropuesta(bancoSinFacturaFiltrado, facturadoSinBancoFiltrado));
  };

  // Saca una línea puntual de la propuesta antes de confirmarla — ese monto vuelve a
  // contarse como "sin cubrir" de ambos lados, ya que ya no se va a aplicar.
  const quitarParPropuesta = (index) => {
    setPropuesta(p => {
      const removido = p.pares[index];
      const pares = p.pares.filter((_, i) => i !== index);
      return { ...p, pares, sinCubrirMovs: p.sinCubrirMovs + removido.monto, sinCubrirInvs: p.sinCubrirInvs + removido.monto };
    });
  };

  const aplicarPropuesta = () => {
    if (!propuesta || propuesta.pares.length === 0) return;
    const movIdsUsados = new Set(propuesta.pares.map(p => p.movId));
    setData(d => {
      let nextNum = d.nextBankImportNum;
      const nuevosMovs = [];
      const restantePorMov = {};
      propuesta.pares.forEach(p => {
        const signo = (d.bankMovements.find(m => m.id === p.movId) || {}).monto < 0 ? -1 : 1;
        nuevosMovs.push({
          id: `B-${String(nextNum).padStart(6, '0')}`, fecha: p.movFecha,
          descripcion: `${p.movDesc || ''} (propuesta)`.trim(),
          monto: +(signo * p.monto).toFixed(2), conciliado: true, invoiceId: p.invId, origen: 'manual',
        });
        nextNum++;
        restantePorMov[p.movId] = (restantePorMov[p.movId] || Math.abs((d.bankMovements.find(m => m.id === p.movId) || {}).monto || 0)) - p.monto;
      });
      // Lo que sobró de cada movimiento usado parcialmente, se deja suelto sin vincular.
      Object.entries(restantePorMov).forEach(([movId, restante]) => {
        if (restante > MARGEN_CONCILIACION) {
          const orig = d.bankMovements.find(m => m.id === movId);
          if (!orig) return;
          const signo = orig.monto < 0 ? -1 : 1;
          nuevosMovs.push({
            id: `B-${String(nextNum).padStart(6, '0')}`, fecha: orig.fecha, descripcion: orig.descripcion,
            monto: +(signo * restante).toFixed(2), conciliado: false, invoiceId: null, origen: null,
          });
          nextNum++;
        }
      });

      const bankMovements = [...d.bankMovements.filter(m => !movIdsUsados.has(m.id)), ...nuevosMovs];
      const invIdsAfectados = [...new Set(propuesta.pares.map(p => p.invId))];
      const invoices = d.invoices.map(f => {
        if (!invIdsAfectados.includes(f.id)) return f;
        const completa = invoiceCompleta(f, bankMovements);
        return { ...f, conciliada: completa, estado: completa ? 'Pagada' : f.estado };
      });
      return { ...d, bankMovements, invoices, nextBankImportNum: nextNum };
    });
    setPropuesta(null);
    setBuscarBanco('');
    setBuscarFactura('');
  };
  const invoiceById = (id) => data.invoices.find(f => f.id === id);

  // ---- Datos para el "Libro de Bancos" / conciliación imprimible (formato del banco) ----
  const MESES_ES = ['', 'ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
  const periodoLabel = mesFiltro
    ? `${MESES_ES[parseInt(mesFiltro.slice(5, 7), 10)]} ${mesFiltro.slice(0, 4)}`
    : 'TODOS LOS MESES';
  const primerDiaMes = mesFiltro ? `${mesFiltro}-01` : null;
  const saldoInicialLibro = primerDiaMes
    ? data.bankMovements.filter(m => (m.fecha || '') < primerDiaMes).reduce((s, m) => s + (m.monto || 0), 0)
    : 0;
  const movimientosLibro = [...bankMovementsF].sort((a, b) => {
    if (a.fecha !== b.fecha) return a.fecha < b.fecha ? -1 : 1;
    return String(a.id) < String(b.id) ? -1 : 1;
  });
  let __running = saldoInicialLibro;
  const movimientosConSaldo = movimientosLibro.map(m => {
    __running += (m.monto || 0);
    return { ...m, saldo: __running };
  });
  const totalDebeLibro = movimientosConSaldo.reduce((s, m) => s + (m.monto < 0 ? Math.abs(m.monto) : 0), 0);
  const totalHaberLibro = movimientosConSaldo.reduce((s, m) => s + (m.monto > 0 ? m.monto : 0), 0);
  const saldoFinalLibro = movimientosConSaldo.length > 0 ? movimientosConSaldo[movimientosConSaldo.length - 1].saldo : saldoInicialLibro;

  const addDeposito = () => {
    const valor = parseFloat(depForm.valor);
    if (!depForm.fecha || isNaN(valor) || valor <= 0) return;
    const id = `DT-${String(data.nextDepositoTransitoNum).padStart(5, '0')}`;
    setData(d => ({
      ...d,
      depositosTransito: [...d.depositosTransito, { id, concepto: depForm.concepto.trim(), boleta: depForm.boleta.trim(), fecha: depForm.fecha, valor: +valor.toFixed(2) }],
      nextDepositoTransitoNum: d.nextDepositoTransitoNum + 1,
    }));
    setDepForm({ concepto: '', boleta: '', fecha: '', valor: '' });
  };
  const deleteDeposito = (id) => setData(d => ({ ...d, depositosTransito: d.depositosTransito.filter(x => x.id !== id) }));

  const addCheque = () => {
    const valor = parseFloat(cheForm.valor);
    if (!cheForm.fecha || isNaN(valor) || valor <= 0) return;
    const id = `CC-${String(data.nextChequeCirculacionNum).padStart(5, '0')}`;
    setData(d => ({
      ...d,
      chequesCirculacion: [...d.chequesCirculacion, { id, concepto: cheForm.concepto.trim(), noCheque: cheForm.noCheque.trim(), fecha: cheForm.fecha, valor: +valor.toFixed(2) }],
      nextChequeCirculacionNum: d.nextChequeCirculacionNum + 1,
    }));
    setCheForm({ concepto: '', noCheque: '', fecha: '', valor: '' });
  };
  const deleteCheque = (id) => setData(d => ({ ...d, chequesCirculacion: d.chequesCirculacion.filter(x => x.id !== id) }));

  const depositosTransitoF = useMemo(
    () => mesFiltro ? data.depositosTransito.filter(x => (x.fecha || '').startsWith(mesFiltro)) : data.depositosTransito,
    [data.depositosTransito, mesFiltro]
  );
  const chequesCirculacionF = useMemo(
    () => mesFiltro ? data.chequesCirculacion.filter(x => (x.fecha || '').startsWith(mesFiltro)) : data.chequesCirculacion,
    [data.chequesCirculacion, mesFiltro]
  );
  const totalDepositosTransito = depositosTransitoF.reduce((s, x) => s + (x.valor || 0), 0);
  const totalChequesCirculacion = chequesCirculacionF.reduce((s, x) => s + (x.valor || 0), 0);


  return (
    <div>
      <Eyebrow>Banco vs. facturas</Eyebrow>
      <H1>Conciliación bancaria</H1>
      <div style={{ fontSize: 12, color: '#A39D93', marginTop: 6 }}>
        Sube el estado de cuenta de tu banco en Excel o CSV/TXT. La app lo compara contra tus facturas por monto y fecha cercana.
      </div>

      <Card style={{ marginTop: 16 }}>
        <Field label="Filtrar por mes (deja vacío para ver todos)">
          <input type="month" style={{ ...inputStyle, maxWidth: 200 }} value={mesFiltro} onChange={e => setMesFiltro(e.target.value)} />
        </Field>
        {mesFiltro && <Btn variant="ghost" onClick={() => setMesFiltro('')} style={{ padding: '4px 10px', fontSize: 12 }}>Quitar filtro</Btn>}
      </Card>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 12, marginTop: 16 }}>
        <StatCard label="Conciliados" value={conciliados.length} icon={Check} />
        <StatCard label="Banco sin factura" value={bancoSinFactura.length} icon={AlertTriangle} warn={bancoSinFactura.length > 0} />
        <StatCard label="Facturado sin banco" value={facturadoSinBanco.length} icon={Receipt} />
      </div>

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Importar estado de cuenta</div>
        <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
          Formatos: Excel (.xlsx) — el más confiable — o TXT/CSV exportado de tu banca en línea.
        </div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv,.txt" onChange={onFileChosen} style={{ fontSize: 13, marginBottom: 10 }} />
        {importStatus && <div style={{ fontSize: 12, color: importStatus.ok ? '#07E55E' : '#B54834', marginBottom: 8 }}>{importStatus.msg}</div>}

        {colMap && (
          <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid #333330' }}>
            <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8 }}>¿Qué columna es cada dato? ({colMap.rows.length} filas encontradas)</div>
            {['fecha', 'descripcion'].map(key => (
              <Field key={key} label={key === 'fecha' ? 'Fecha del movimiento' : 'Descripción (opcional)'}>
                <select style={inputStyle} value={colMap.mapping[key]} onChange={e => setColMap(c => ({ ...c, mapping: { ...c.mapping, [key]: e.target.value } }))}>
                  <option value="">— no usar —</option>
                  {colMap.headers.map(h => <option key={h} value={h}>{h}</option>)}
                </select>
              </Field>
            ))}
            <div style={{ fontSize: 11, color: '#A39D93', margin: '4px 0 8px' }}>
              Elegí <b>una</b> de las dos opciones: si tu banco separa los movimientos en columnas "Debe" y
              "Haber" (como tu Libro de Bancos), usa esas dos. Si tu banco exporta un solo monto con signo
              (positivo = abono, negativo = cargo), usa "Monto" en vez de Debe/Haber.
            </div>
            {['debe', 'haber'].map(key => (
              <Field key={key} label={key === 'debe' ? 'Debe (cargos / gastos, opcional)' : 'Haber (abonos / depósitos, opcional)'}>
                <select style={inputStyle} value={colMap.mapping[key]} onChange={e => setColMap(c => ({ ...c, mapping: { ...c.mapping, [key]: e.target.value } }))}>
                  <option value="">— no usar —</option>
                  {colMap.headers.map(h => <option key={h} value={h}>{h}</option>)}
                </select>
              </Field>
            ))}
            <Field label="— o bien — Monto en una sola columna (opcional si ya usaste Debe/Haber)">
              <select style={inputStyle} value={colMap.mapping.monto} onChange={e => setColMap(c => ({ ...c, mapping: { ...c.mapping, monto: e.target.value } }))}>
                <option value="">— no usar —</option>
                {colMap.headers.map(h => <option key={h} value={h}>{h}</option>)}
              </select>
            </Field>
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn variant="accent" onClick={confirmImport}><Check size={14} /> Importar {colMap.rows.length} movimientos</Btn>
              <Btn variant="ghost" onClick={() => setColMap(null)}>Cancelar</Btn>
            </div>
          </div>
        )}
      </Card>

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Conciliar automáticamente</div>
        <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
          Primero cruza movimientos del banco con facturas por monto exacto y fecha cercana. Luego, lo que
          quede sin conciliar, lo busca por el número de factura escrito dentro de la descripción del banco
          (ej. "fact 3448260546"), aunque el monto no coincida exacto — útil para pagos en abonos.
        </div>
        <Field label="Tolerancia de días entre fecha de factura y fecha de banco">
          <input type="number" min="0" style={{ ...inputStyle, maxWidth: 120 }} value={toleranciaDias} onChange={e => setToleranciaDias(parseInt(e.target.value) || 0)} />
        </Field>
        <Btn variant="accent" onClick={autoConciliar}><Landmark size={14} /> Conciliar ahora</Btn>
        <Btn variant="ghost" onClick={() => setShowReport(true)} style={{ marginLeft: 8 }}><FileText size={14} /> Generar reporte PDF</Btn>
        <Btn variant="ghost" onClick={() => setShowLibroBancos(true)} style={{ marginLeft: 8 }}><Landmark size={14} /> Imprimir Libro de Bancos</Btn>
      </Card>

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Categorización automática (gastos recurrentes sin factura)</div>
        <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
          Gastos fijos como planilla, renta o comisiones bancarias no tienen factura que vincular — se
          repiten con el mismo texto cada mes. Si la descripción del banco contiene alguna de estas palabras
          clave, se registra automáticamente como Costo Indirecto y el movimiento sale de "Banco sin factura".
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 12 }}>
          {data.reglasCategorizacion.length === 0 && <div style={{ fontSize: 12, color: '#A39D93' }}>Aún no hay reglas configuradas.</div>}
          {data.reglasCategorizacion.map(r => (
            <div key={r.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, background: '#201E1B', padding: '6px 10px', borderRadius: 4 }}>
              <div>Si la descripción contiene <b>"{r.palabraClave}"</b> → <span style={{ color: '#07E55E' }}>{r.categoria}</span></div>
              <button onClick={() => deleteRegla(r.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834', fontSize: 11 }}>Eliminar</button>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'flex-end', marginBottom: 12 }}>
          <Field label="Palabra clave (tal como aparece en el banco)">
            <input style={{ ...inputStyle, minWidth: 220 }} value={reglaForm.palabraClave} onChange={e => setReglaForm(f => ({ ...f, palabraClave: e.target.value }))} placeholder="ej. PLANILLA" />
          </Field>
          <Field label="Categoría">
            <select style={inputStyle} value={reglaForm.categoria} onChange={e => setReglaForm(f => ({ ...f, categoria: e.target.value }))}>
              {OVERHEAD_CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <Btn variant="ghost" onClick={addRegla}><Plus size={14} /> Agregar regla</Btn>
        </div>
        <Btn variant="accent" onClick={applyReglas}><Landmark size={14} /> Categorizar con reglas</Btn>
      </Card>

      {showLibroBancos && (
        <PrintableLibroBancos
          periodoLabel={periodoLabel}
          saldoInicial={saldoInicialLibro}
          movimientos={movimientosConSaldo}
          totalDebe={totalDebeLibro}
          totalHaber={totalHaberLibro}
          saldoFinal={saldoFinalLibro}
          depositosTransito={depositosTransitoF}
          chequesCirculacion={chequesCirculacionF}
          company={data.company}
          onClose={() => setShowLibroBancos(false)}
        />
      )}

      {showReport && (
        <PrintableSummaryReport
          title="REPORTE DE CONCILIACIÓN BANCARIA"
          subtitle={`Resumen y detalle completo — ${mesFiltro ? mesFiltro : 'todos los meses'}`}
          company={data.company}
          onClose={() => setShowReport(false)}
          groups={[{
            heading: 'Resumen de conciliación',
            rows: [
              { label: 'Conciliados', cantidad: conciliados.length, monto: conciliados.reduce((s, m) => s + (m.monto || 0), 0) },
              { label: 'Banco sin factura', cantidad: bancoSinFactura.length, monto: bancoSinFactura.reduce((s, m) => s + (m.monto || 0), 0) },
              { label: 'Facturado sin banco', cantidad: facturadoSinBanco.length, monto: facturadoSinBanco.reduce((s, f) => s + (f.monto || 0), 0) },
            ],
          }]}
          detailTables={[
            {
              heading: 'Detalle — Conciliados',
              columns: [{ label: 'Fecha' }, { label: 'Descripción' }, { label: 'Monto', align: 'right' }, { label: 'Factura vinculada' }],
              rows: conciliados.map(m => {
                const inv = data.invoices.find(f => f.id === m.invoiceId);
                return [m.fecha, m.descripcion || '—', fmtQ(m.monto), inv ? inv.numero : '—'];
              }),
            },
            {
              heading: 'Detalle — Banco sin factura',
              columns: [{ label: 'Fecha' }, { label: 'Descripción' }, { label: 'Monto', align: 'right' }],
              rows: bancoSinFactura.map(m => [m.fecha, m.descripcion || '—', fmtQ(m.monto)]),
            },
            {
              heading: 'Detalle — Facturado sin banco',
              columns: [{ label: 'N° Factura' }, { label: 'Fecha' }, { label: 'Contraparte' }, { label: 'Monto', align: 'right' }, { label: 'Tipo' }],
              rows: facturadoSinBanco.map(f => [f.numero, f.fecha, f.contraparte || '—', fmtQ(f.monto), f.tipo === 'emitida' ? 'Venta' : 'Compra']),
            },
          ]}
        />
      )}

      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 900 ? '1fr 1fr' : '1fr', gap: 16, marginTop: 16 }}>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 4 }}>Depósitos en tránsito</div>
          <div style={{ fontSize: 11, color: '#A39D93', marginBottom: 10 }}>
            Depósitos que ya registraste en tus libros pero que el banco todavía no refleja en el estado de cuenta. Agrégalos aquí para que aparezcan en la conciliación; cuando el banco ya los muestre (aparecen como movimiento importado), quítalos de esta lista.
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 100px 130px 110px 32px', gap: 6, marginBottom: 10 }}>
            <input style={inputStyle} placeholder="Concepto" value={depForm.concepto} onChange={e => setDepForm(f => ({ ...f, concepto: e.target.value }))} />
            <input style={inputStyle} placeholder="Boleta" value={depForm.boleta} onChange={e => setDepForm(f => ({ ...f, boleta: e.target.value }))} />
            <input type="date" style={inputStyle} value={depForm.fecha} onChange={e => setDepForm(f => ({ ...f, fecha: e.target.value }))} />
            <input type="number" min="0" step="0.01" style={inputStyle} placeholder="Valor" value={depForm.valor} onChange={e => setDepForm(f => ({ ...f, valor: e.target.value }))} />
            <button onClick={addDeposito} title="Agregar" style={{ background: '#07E55E', border: 'none', borderRadius: 4, cursor: 'pointer', color: '#0D1F14' }}><Plus size={16} /></button>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 4, maxHeight: 220, overflowY: 'auto' }}>
            {depositosTransitoF.length === 0 && <div style={{ fontSize: 12, color: '#A39D93' }}>Nada pendiente aquí.</div>}
            {depositosTransitoF.map(dep => (
              <div key={dep.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, borderBottom: '1px solid #333330', paddingBottom: 4 }}>
                <div>{dep.concepto || '—'} · {dep.boleta || '—'} · {dep.fecha} · {fmtQ(dep.valor)}</div>
                <button onClick={() => deleteDeposito(dep.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={13} /></button>
              </div>
            ))}
          </div>
        </Card>

        <Card>
          <div style={{ fontWeight: 700, marginBottom: 4 }}>Cheques en circulación</div>
          <div style={{ fontSize: 11, color: '#A39D93', marginBottom: 10 }}>
            Cheques que ya emitiste (o pagos ya registrados en tus libros) pero que el beneficiario todavía no ha cobrado en el banco. Cuando el banco ya los refleje, quítalos de esta lista.
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 100px 130px 110px 32px', gap: 6, marginBottom: 10 }}>
            <input style={inputStyle} placeholder="Concepto" value={cheForm.concepto} onChange={e => setCheForm(f => ({ ...f, concepto: e.target.value }))} />
            <input style={inputStyle} placeholder="No. cheque" value={cheForm.noCheque} onChange={e => setCheForm(f => ({ ...f, noCheque: e.target.value }))} />
            <input type="date" style={inputStyle} value={cheForm.fecha} onChange={e => setCheForm(f => ({ ...f, fecha: e.target.value }))} />
            <input type="number" min="0" step="0.01" style={inputStyle} placeholder="Valor" value={cheForm.valor} onChange={e => setCheForm(f => ({ ...f, valor: e.target.value }))} />
            <button onClick={addCheque} title="Agregar" style={{ background: '#07E55E', border: 'none', borderRadius: 4, cursor: 'pointer', color: '#0D1F14' }}><Plus size={16} /></button>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 4, maxHeight: 220, overflowY: 'auto' }}>
            {chequesCirculacionF.length === 0 && <div style={{ fontSize: 12, color: '#A39D93' }}>Nada pendiente aquí.</div>}
            {chequesCirculacionF.map(che => (
              <div key={che.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, borderBottom: '1px solid #333330', paddingBottom: 4 }}>
                <div>{che.concepto || '—'} · {che.noCheque || '—'} · {che.fecha} · {fmtQ(che.valor)}</div>
                <button onClick={() => deleteCheque(che.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={13} /></button>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {buscarBanco.trim() !== '' && buscarFactura.trim() !== '' && (
        <Card style={{ marginTop: 16, borderColor: '#5C8AA6' }}>
          <div style={{ fontWeight: 700, marginBottom: 6, color: '#5C8AA6' }}>Proponer conciliación con estos dos filtros</div>
          <div style={{ fontSize: 11, color: '#A39D93', marginBottom: 10 }}>
            Cruza solo lo que está filtrado ahora mismo: los {bancoSinFacturaFiltrado.length} movimientos de
            "{buscarBanco}" contra las {facturadoSinBancoFiltrado.length} facturas de "{buscarFactura}", en
            orden de fecha. Nada se aplica todavía — primero te muestro la propuesta para que la revises.
          </div>
          {!propuesta && (

          )}
          {propuesta && (
            <div>

              {propuesta.pares.length > 0 && (

      <Card style={{ marginTop: 16 }}>

                    <button onClick={() => unlink(m.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834', fontSize: 11 }}>Desvincular</button>

      <Card style={{ marginTop: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 10, color: '#5C8AA6' }}>Conciliados manualmente ({conciliadosManual.length})</div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 300, overflowY: 'auto' }}>
          {conciliadosManual.length === 0 && <div style={{ fontSize: 12, color: '#A39D93' }}>Aún no hay conciliaciones manuales.</div>}
          {conciliadosManual.map(m => {
            const inv = invoiceById(m.invoiceId);

              <div key={m.id} style={{ borderBottom: '1px solid #333330', paddingBottom: 8 }}>

                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={() => setEditingMovId(editingMovId === m.id ? null : m.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#5C8AA6', fontSize: 11 }}>Editar</button>
                    <button onClick={() => unlink(m.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834', fontSize: 11 }}>Desvincular</button>

                    {inv && <option value={inv.id}>{inv.numero} · {fmtQ(inv.monto)} · {inv.fecha}</option>}

      </Card>

      <Card style={{ marginTop: 16, borderColor: '#6B3226' }}>
        <div style={{ fontWeight: 700, marginBottom: 6, color: '#B54834' }}>Reiniciar conciliación completa</div>
        <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
          Si algo quedó enredado y prefieres empezar de cero: esto desvincula TODOS los movimientos de banco
          (los que se conciliaron solos, a mano, o por regla), regresa todas las facturas a "Pendiente", y
          borra los Costos Indirectos que se crearon automáticamente. No borra facturas, movimientos de
          banco, ni sus montos — solo deshace los vínculos entre ellos.
        </div>
        <Btn variant="ghost" onClick={() => setShowResetConfirm(true)} style={{ borderColor: '#6B3226', color: '#B54834' }}>
          Reiniciar conciliación completa
        </Btn>
      </Card>

      {showResetConfirm && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.75)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
          <div style={{ background: '#1C1B19', border: '1px solid #6B3226', borderRadius: 8, width: '100%', maxWidth: 440, padding: 20 }}>
            <div style={{ fontWeight: 700, fontSize: 15, color: '#B54834', marginBottom: 10 }}>¿Reiniciar toda la conciliación?</div>
            <div style={{ fontSize: 13, color: '#F2F0EB', marginBottom: 8 }}>Esto va a:</div>
            <ul style={{ fontSize: 12, color: '#A39D93', marginBottom: 14, paddingLeft: 18 }}>
              <li>Desvincular todos los movimientos de banco conciliados (automáticos, manuales y por regla)</li>
              <li>Regresar todas las facturas a estado "Pendiente"</li>
              <li>Borrar los Costos Indirectos creados automáticamente por las reglas</li>
            </ul>
            <div style={{ fontSize: 12, color: '#B54834', marginBottom: 16 }}>Esta acción no se puede deshacer.</div>
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn variant="accent" onClick={reiniciarConciliacion} style={{ background: '#B54834' }}>Sí, reiniciar todo</Btn>
              <Btn variant="ghost" onClick={() => setShowResetConfirm(false)}>Cancelar</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Reportes({ data, setData }) {
  const [rangeMode, setRangeMode] = useState('todo'); // 'hoy' | 'mes' | 'rango' | 'todo'
  const [rangeFrom, setRangeFrom] = useState('');
  const [rangeTo, setRangeTo] = useState('');
  const [printingOrderId, setPrintingOrderId] = useState(null);
  const [pickingClientId, setPickingClientId] = useState(null);

  const { from, to, rangeLabel } = useMemo(() => {
    const today = todayStr();
    if (rangeMode === 'hoy') return { from: today, to: today, rangeLabel: `Hoy (${today})` };
    if (rangeMode === 'mes') {
      const d = new Date();
      const first = new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0, 10);
      return { from: first, to: today, rangeLabel: `Este mes (${first} a ${today})` };
    }
    if (rangeMode === 'rango' && rangeFrom && rangeTo) return { from: rangeFrom, to: rangeTo, rangeLabel: `${rangeFrom} a ${rangeTo}` };
    return { from: null, to: null, rangeLabel: 'Todo el histórico' };
  }, [rangeMode, rangeFrom, rangeTo]);

  const inRange = (dateStr) => {
    if (!from && !to) return true;
    if (!dateStr) return false;
    if (from && dateStr < from) return false;
    if (to && dateStr > to) return false;
    return true;
  };

  const ordersF = useMemo(() => data.orders.filter(o => inRange(o.date)), [data.orders, from, to]);
  const quotesF = useMemo(() => data.quotes.filter(q => inRange(q.fecha)), [data.quotes, from, to]);
  const purchaseOrdersF = useMemo(() => data.purchaseOrders.filter(o => inRange(o.fecha)), [data.purchaseOrders, from, to]);
  const overheadCostsF = useMemo(() => (data.overheadCosts || []).filter(o => {
    if (!from && !to) return true;
    const mesStr = `${o.mes}-01`;
    return inRange(mesStr);
  }), [data.overheadCosts, from, to]);

  const byDate = useMemo(() => { const map = {}; ordersF.forEach(o => { map[o.date] = (map[o.date] || 0) + Number(o.volumeM3); }); return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0])); }, [ordersF]);
  const totalM3 = ordersF.reduce((s, o) => s + Number(o.volumeM3), 0);
  const byRecipe = useMemo(() => { const map = {}; ordersF.forEach(o => { map[o.recipeName] = (map[o.recipeName] || 0) + Number(o.volumeM3); }); return Object.entries(map); }, [ordersF]);
  const maxDay = Math.max(1, ...byDate.map(([, v]) => v));

  const ingresoTotal = ordersF.reduce((s, o) => s + Number(o.ingreso || 0), 0);
  const costoTotal = ordersF.reduce((s, o) => s + Number(o.costo || 0), 0);
  const comisionTotal = ordersF.reduce((s, o) => s + Number(o.comisionVendedor || 0), 0);
  const dieselTotal = ordersF.reduce((s, o) => s + Number(o.dieselCosto || 0), 0);
  const utilidadBruta = ordersF.reduce((s, o) => s + Number(o.utilidad || 0), 0);
  const margenBruto = ingresoTotal > 0 ? (utilidadBruta / ingresoTotal) * 100 : 0;

  const overheadCosts = overheadCostsF;
  const overheadTotal = overheadCosts.reduce((s, o) => s + Number(o.monto || 0), 0);
  const utilidadNeta = utilidadBruta - overheadTotal;
  const margenNeto = ingresoTotal > 0 ? (utilidadNeta / ingresoTotal) * 100 : 0;

  const [showOverhead, setShowOverhead] = useState(false);
  const [showRecipients, setShowRecipients] = useState(false);
  const [newRecipient, setNewRecipient] = useState('');
  const [recipientError, setRecipientError] = useState('');
  const [showReport, setShowReport] = useState(false);

  const addRecipient = () => {
    const email = newRecipient.trim().toLowerCase();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setRecipientError('Escribe un correo válido.'); return; }
    if (data.company.reportRecipients.includes(email)) { setRecipientError('Ese correo ya está en la lista.'); return; }
    setData(d => ({ ...d, company: { ...d.company, reportRecipients: [...d.company.reportRecipients, email] } }));
    setNewRecipient('');
    setRecipientError('');
  };
  const removeRecipient = (email) => {
    setData(d => ({ ...d, company: { ...d.company, reportRecipients: d.company.reportRecipients.filter(e => e !== email) } }));
  };

  const [ovForm, setOvForm] = useState({ mes: todayStr().slice(0, 7), categoria: 'Mano de obra', descripcion: '', monto: '' });
  const [ovError, setOvError] = useState('');

  const addOverhead = () => {
    const monto = parseFloat(ovForm.monto);
    if (isNaN(monto) || monto <= 0) { setOvError('Indica un monto válido.'); return; }
    const id = `OH-${String(data.nextOverheadNum).padStart(4, '0')}`;
    setData(d => ({
      ...d, nextOverheadNum: d.nextOverheadNum + 1,
      overheadCosts: [...d.overheadCosts, { id, mes: ovForm.mes, categoria: ovForm.categoria, descripcion: ovForm.descripcion.trim(), monto: +monto.toFixed(2) }],
    }));
    setOvForm({ mes: ovForm.mes, categoria: ovForm.categoria, descripcion: '', monto: '' });
    setOvError('');
  };
  const removeOverhead = (id) => setData(d => ({ ...d, overheadCosts: d.overheadCosts.filter(o => o.id !== id) }));
  const [editingOverheadId, setEditingOverheadId] = useState(null);
  const [editOvForm, setEditOvForm] = useState(null);
  const startEditOverhead = (o) => { setEditingOverheadId(o.id); setEditOvForm({ mes: o.mes, categoria: o.categoria, descripcion: o.descripcion, monto: String(o.monto) }); };
  const saveEditOverhead = () => {
    const monto = parseFloat(editOvForm.monto);
    if (isNaN(monto) || monto <= 0) return;
    setData(d => ({

                { label: 'Clientes en cartera', cantidad: data.clients.length, monto: null },

                          <Btn variant="ghost" onClick={() => setEditingOverheadId(null)} style={{ fontSize: 12, padding: '5px 12px' }}>Cancelar</Btn>
                        </div>
                      </div>
                    ) : (

                        <div>
                          <div style={{ fontSize: 12, color: '#F2F0EB', fontWeight: 600 }}>{o.categoria} · {o.mes}</div>
                          <div style={{ fontSize: 11, color: '#A39D93' }}>{o.descripcion}</div>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>

                          <button onClick={() => removeOverhead(o.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={13} /></button>
                        </div>
                      </div>

            </div>

              const porCategoria = {};
              delMes.forEach(o => { porCategoria[o.categoria] = (porCategoria[o.categoria] || 0) + o.monto; });
              const totalMes = delMes.reduce((s, o) => s + o.monto, 0);
              const MESES_ES2 = ['', 'ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
              const [yy, mm] = mesReporteIndirectos.split('-');
              const mesLabel = `${MESES_ES2[parseInt(mm, 10)]} ${yy}`;
              return (
                <PrintableSummaryReport
                  title="COSTOS INDIRECTOS"
                  subtitle={mesLabel}
                  groups={[
                    {
                      heading: 'Totales por categoría',
                      rows: [
                        ...OVERHEAD_CATEGORIAS.filter(c => porCategoria[c]).map(c => ({ label: c, cantidad: '', monto: porCategoria[c] })),

                  detailTables={[

          <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid #333330' }}>
