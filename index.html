<script>
  // El Service Worker se quitó (era fuente de confusión: podía servir una versión vieja
  // cacheada de la app). Esto desinstala cualquier versión que ya se haya activado antes
  // en este dispositivo, y borra las cachés que haya dejado, para asegurar que siempre
  // cargues el código más reciente.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => {
      regs.forEach((r) => r.unregister());
    });
  }
  if ('caches' in window) {
    caches.keys().then((names) => { names.forEach((n) => caches.delete(n)); });
  }
</script>

// Rellena campos que falten (por actualizaciones de la app) con los valores de fábrica,
// para que datos guardados antes de agregar una función nueva no rompan la app.
function normalizeData(d) {
  const def = defaultData();
  if (!d || typeof d !== 'object') return def;

  const inventory = {};
  Object.keys(def.inventory).forEach(k => {
    inventory[k] = { ...def.inventory[k], ...((d.inventory || {})[k] || {}) };
  });
  // conserva materiales adicionales que el usuario haya agregado por su cuenta
  Object.keys(d.inventory || {}).forEach(k => { if (!inventory[k]) inventory[k] = d.inventory[k]; });

  const recipes = (Array.isArray(d.recipes) && d.recipes.length ? d.recipes : def.recipes)
    .map(r => {
      if (r.materiales && typeof r.materiales === 'object') {
        return { precioM3: 0, aditivoNombre: '', ...r, materiales: { ...r.materiales } };
      }
      // Receta en el formato viejo (campos fijos: cemento en kg, agua en L) — se migra
      // a materiales dinámicos usando la misma unidad que tiene cada material en Inventario.
      const materiales = {};
      if (r.cemento != null) materiales.cemento = +(r.cemento / 42.5).toFixed(4);
      if (r.arena != null) materiales.arena = r.arena;
      if (r.grava != null) materiales.grava = r.grava;
      if (r.agua != null) materiales.agua = +(r.agua / 1000).toFixed(4);
      if (r.aditivo != null) materiales.aditivo = r.aditivo;
      return { id: r.id, name: r.name, precioM3: r.precioM3 || 0, aditivoNombre: r.aditivoNombre || '', materiales };
    });

  const clients = (Array.isArray(d.clients) ? d.clients : def.clients)
    .map(c => ({ telefono: '', estado: 'Cliente activo', seguimiento: [], proximoSeguimiento: null, ubicacion: '', ...c, seguimiento: Array.isArray(c.seguimiento) ? c.seguimiento : [] }));

  const quotes = (Array.isArray(d.quotes) ? d.quotes : [])
    .map(q => ({ numero: '', vendedor: '', vendedorTelefono: '', itemNombre: '', itemDescripcion: '', impuestoPct: 0, terminosPago: '', ...q }));

  const dCompany = d.company || {};
  const orDefault = (val, def) => (val === undefined || val === null || val === '') ? def : val;
  const company = {
    ...def.company, ...dCompany,
    email: orDefault(dCompany.email, def.company.email),
    telefonoComprobante: orDefault(dCompany.telefonoComprobante, def.company.telefonoComprobante),
    bancoNombre: orDefault(dCompany.bancoNombre, def.company.bancoNombre),
    bancoTitular: orDefault(dCompany.bancoTitular, def.company.bancoTitular),
    bancoCuenta: orDefault(dCompany.bancoCuenta, def.company.bancoCuenta),
    notasPie: Array.isArray(dCompany.notasPie) && dCompany.notasPie.length > 0 ? dCompany.notasPie : def.company.notasPie,
    reportRecipients: Array.isArray(dCompany.reportRecipients) ? dCompany.reportRecipients : def.company.reportRecipients,
  };
  const dieselConfig = { ...def.dieselConfig, ...(d.dieselConfig || {}) };
  const invoices = Array.isArray(d.invoices) ? d.invoices : [];
  const bankMovements = Array.isArray(d.bankMovements) ? d.bankMovements : [];
  const depositosTransito = Array.isArray(d.depositosTransito) ? d.depositosTransito : [];
  const chequesCirculacion = Array.isArray(d.chequesCirculacion) ? d.chequesCirculacion : [];
  const reglasCategorizacion = Array.isArray(d.reglasCategorizacion) ? d.reglasCategorizacion : def.reglasCategorizacion;
  const proveedoresDirectorio = Array.isArray(d.proveedoresDirectorio) ? d.proveedoresDirectorio : [];
  const overheadCosts = Array.isArray(d.overheadCosts) ? d.overheadCosts : [];
  const auditLog = Array.isArray(d.auditLog) ? d.auditLog : [];
  const trashCutoff = Date.now() - 30 * 86400000;
  const trash = (Array.isArray(d.trash) ? d.trash : []).filter(t => new Date(t.deletedAt).getTime() > trashCutoff);

  return {
    ...def,
    ...d,
    inventory,
    recipes,
    clients,
    orders: Array.isArray(d.orders) ? d.orders : [],
    fleet: Array.isArray(d.fleet) && d.fleet.length ? d.fleet : def.fleet,
    dispatches: d.dispatches && typeof d.dispatches === 'object' ? d.dispatches : {},
    maintenance: Array.isArray(d.maintenance) ? d.maintenance : [],
    trips: Array.isArray(d.trips) ? d.trips : [],
    suppliers: Array.isArray(d.suppliers) ? d.suppliers : [],
    purchaseOrders: Array.isArray(d.purchaseOrders) ? d.purchaseOrders : [],
    quotes,

    depositosTransito,
    chequesCirculacion,
    reglasCategorizacion,
    proveedoresDirectorio,
    overheadCosts,
    auditLog,
    trash,
  };
}

function usePlantData() {
  const [data, setDataRaw] = useState(null);
  const setData = (updater) => setDataRaw(prev => {
    const next = typeof updater === 'function' ? updater(prev) : updater;
    return normalizeData(next);
  });
  const [loaded, setLoaded] = useState(false);
  const [syncMode, setSyncMode] = useState(SUPABASE_ENABLED ? 'nube' : 'local');
  const [syncError, setSyncError] = useState(null);
  const lastLocalWriteAt = React.useRef(0);
  const skipNextSave = React.useRef(false);
  const pendingWriteRef = React.useRef(false); // hay una EDICIÓN real del usuario sin guardar
  const needsFreshFetch = React.useRef(false); // todavía no confirmamos los datos reales de la nube
  const isSavingRef = React.useRef(false); // ya hay un guardado en curso
  const dirtyWhileSaving = React.useRef(false); // cambió algo mientras se guardaba
  const latestDataRef = React.useRef(null); // siempre apunta al dato más reciente

  const attemptSave = async (payload) => {
    try {
      const { error } = await supabaseClient.from('plant_state').update({ data: payload, updated_at: new Date().toISOString() }).eq('id', 'main');
      if (error) {
        setSyncError('No se guardó tu último cambio en la nube: ' + error.message + '. Se guardó una copia de respaldo en este dispositivo — avisa para revisarlo.');
        setSyncMode('nube');
        pendingWriteRef.current = false;
      } else {
        setSyncError(null);
        setSyncMode('nube');
        pendingWriteRef.current = false;
      }
    } catch (e) {
      // No se pudo ni contactar Supabase: probablemente no hay internet.
      pendingWriteRef.current = true;
      setSyncMode('sin conexión (guardado local, sincroniza al volver)');
    }
  };

  // ---- Carga inicial (y recarga forzada si el navegador restaura una página congelada) ----
  const fetchRealData = React.useRef(async (isFirstLoad) => {
    if (!SUPABASE_ENABLED) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        setDataRaw(normalizeData(raw ? JSON.parse(raw) : defaultData()));
      } catch (e) { setDataRaw(defaultData()); }
      setLoaded(true);
      return;
    }

    // En la carga inicial, un parpadeo de señal al arrancar desde cero es común —
    // reintenta varias veces antes de darse por vencido, para no caer a valores de
    // fábrica solo porque el primer intento tardó o falló.
    const intentos = isFirstLoad ? 4 : 1;
    let row = null, lastErr = null;
    for (let i = 0; i < intentos; i++) {
      try {
        const { data: r, error } = await supabaseClient.from('plant_state').select('*').eq('id', 'main').single();
        if (r && r.data && Object.keys(r.data).length > 0) { row = r; lastErr = null; break; }
        lastErr = error || new Error('sin datos');
      } catch (e) {
        lastErr = e;
      }
      if (i < intentos - 1) await new Promise(res => setTimeout(res, 700 * (i + 1)));
    }

    try {
      if (row) {
        skipNextSave.current = true;
        setDataRaw(normalizeData(row.data));
        setSyncMode('nube');
        setSyncError(null);
        needsFreshFetch.current = false;
      } else if (isFirstLoad) {
        // De verdad no se pudo confirmar nada tras varios intentos. Antes de asumir que
        // la fila no existe, mostramos el respaldo local si hay uno (nunca valores de
        // fábrica de entrada), y solo creamos la fila de fábrica si NUNCA hubo respaldo
        // ni datos — es decir, la primerísima vez que la app corre en cualquier lugar.
        let raw = null;
        try { raw = localStorage.getItem(STORAGE_KEY + '-respaldo') || localStorage.getItem(STORAGE_KEY); } catch (e2) {}
        if (raw) {
          setDataRaw(normalizeData(JSON.parse(raw)));
          setSyncMode('sin conexión (reintentando cargar los datos reales…)');
          needsFreshFetch.current = true;
        } else {
          const fresh = defaultData();
          await supabaseClient.from('plant_state').upsert({ id: 'main', data: fresh, updated_at: new Date().toISOString() });
          lastLocalWriteAt.current = Date.now();
          setDataRaw(fresh);
          setSyncMode('nube');
          setSyncError(null);
          needsFreshFetch.current = false;
        }
      } else {
        // Una recarga automática (no la carga inicial) no pudo confirmar datos reales.
        // NUNCA se reinicia nada aquí — se deja tal cual lo que ya había en pantalla y
        // simplemente se reintenta más tarde.
        setSyncMode('sin conexión (reintentando cargar los datos reales…)');
        needsFreshFetch.current = true;
      }
    } catch (e) {
      setSyncMode('sin conexión (reintentando cargar los datos reales…)');
      needsFreshFetch.current = true;
    }
    setLoaded(true);
  });

  useEffect(() => { fetchRealData.current(true); }, []);

  // ---- El navegador a veces "congela" la página al salir de la app y la restaura tal
  // cual estaba (sin volver a cargar nada) cuando regresas — esto puede mostrar datos
  // viejos. Forzamos traer los datos reales de nuevo en esos casos (nunca borra nada,
  // solo actualiza si logra confirmar datos reales). ----
  useEffect(() => {
    if (!SUPABASE_ENABLED) return;
    const onPageShow = (e) => { if (e.persisted) fetchRealData.current(false); };
    const onVisibility = () => { if (document.visibilityState === 'visible') fetchRealData.current(false); };
    window.addEventListener('pageshow', onPageShow);
    document.addEventListener('visibilitychange', onVisibility);
    return () => {
      window.removeEventListener('pageshow', onPageShow);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);


  // ---- Si la carga inicial no pudo confirmar datos reales, reintenta TRAERLOS ----
  // (nunca empuja nada mientras esto esté pendiente, para no sobrescribir algo más nuevo)
  useEffect(() => {
    if (!SUPABASE_ENABLED) return;
    const refetch = async () => {
      if (!needsFreshFetch.current) return;
      try {
        const { data: row, error } = await supabaseClient.from('plant_state').select('*').eq('id', 'main').single();
        if (error || !row || !row.data) return;
        needsFreshFetch.current = false;
        skipNextSave.current = true;
        lastLocalWriteAt.current = Date.now();
        setDataRaw(normalizeData(row.data));
        setSyncMode('nube');
        setSyncError(null);
      } catch (e2) { /* sigue sin conexión, se reintenta después */ }
    };
    window.addEventListener('online', refetch);
    const interval = setInterval(refetch, 15000);
    refetch();
    return () => { window.removeEventListener('online', refetch); clearInterval(interval); };
  }, []);

  // ---- Reintento automático de una EDICIÓN pendiente cuando vuelve la conexión ----
  useEffect(() => {
    if (!SUPABASE_ENABLED) return;
    const retry = async () => {
      if (!pendingWriteRef.current || needsFreshFetch.current) return;
      if (!latestDataRef.current) return;
      await runSaveLoop();
    };
    window.addEventListener('online', retry);
    const interval = setInterval(retry, 20000);
    return () => { window.removeEventListener('online', retry); clearInterval(interval); };
  }, []);

  // ---- Suscripción en tiempo real (otros dispositivos escribiendo) ----
  useEffect(() => {
    if (!SUPABASE_ENABLED) return;
    let channel;
    try {
      channel = supabaseClient
        .channel('plant_state_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'plant_state', filter: 'id=eq.main' }, (payload) => {
          const incoming = payload.new && payload.new.data;
          if (!incoming) return;
          // Si acabamos de escribir hace menos de 2.5s, esto probablemente es el eco de
          // nuestro propio cambio (la base de datos reordena el JSON al guardarlo, así que
          // comparar el texto exacto no es confiable). Lo ignoramos para no pisar el cambio.
          if (Date.now() - lastLocalWriteAt.current < 2500) return;
          skipNextSave.current = true;
          setDataRaw(normalizeData(incoming));
        })
        .subscribe();
    } catch (e) {
      // Algunos entornos (vistas previas embebidas, ciertos navegadores) bloquean WebSocket.
      // La app sigue funcionando sin actualizaciones en vivo entre dispositivos.
      console.warn('Tiempo real no disponible en este entorno:', e);
    }
    return () => { if (channel) { try { supabaseClient.removeChannel(channel); } catch (e) {} } };
  }, []);

  // ---- Cola de guardado en serie: nunca dos guardados a la vez ----
  // Si algo cambia mientras se está guardando, no se lanza un segundo guardado en paralelo;
  // se espera a que termine el actual y se vuelve a guardar con lo más reciente. Esto evita
  // que un guardado que empezó antes (y tarda más, por ejemplo por señal débil) termine
  // escribiéndose DESPUÉS de uno más nuevo y lo borre.
  const runSaveLoop = async () => {
    if (isSavingRef.current) { dirtyWhileSaving.current = true; return; }
    isSavingRef.current = true;
    try {
      // eslint-disable-next-line no-constant-condition
      while (true) {
        const payload = latestDataRef.current;
        dirtyWhileSaving.current = false;
        lastLocalWriteAt.current = Date.now();
        try { localStorage.setItem(STORAGE_KEY + '-respaldo', JSON.stringify(payload)); } catch (e) {}
        await attemptSave(payload);
        if (!dirtyWhileSaving.current) break;
      }
    } finally {
      isSavingRef.current = false;
    }
  };

  // ---- Guardar cambios locales ----
  useEffect(() => {
    if (!loaded || !data) return;
    latestDataRef.current = data;
    if (skipNextSave.current) { skipNextSave.current = false; return; }

    if (needsFreshFetch.current) {
      // Todavía no confirmamos los datos reales de la nube — no guardamos nada en la nube
      // para no arriesgarnos a pisar algo más nuevo que no hemos visto. Solo respaldo local.
      try { localStorage.setItem(STORAGE_KEY + '-respaldo', JSON.stringify(data)); } catch (e) {}
      return;
    }

    if (!SUPABASE_ENABLED) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      return;
    }
    const t = setTimeout(() => { runSaveLoop(); }, 400);
    return () => clearTimeout(t);
  }, [data, loaded]);

  return [data, setData, syncMode, syncError];
}

  };

  useEffect(() => {
    if (!SUPABASE_ENABLED) { setSession(null); return; }
    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session || null);
      if (data.session) loadProfile(data.session.user.id);
    });
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, sess) => {
      setSession(sess);
      if (sess) loadProfile(sess.user.id); else setProfile(null);
    });
    return () => { sub.subscription.unsubscribe(); };
  }, []);

  const login = async (username, password) => {
    const email = `${username.trim().toLowerCase()}@occicon.local`;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    return error;
  };
  const logout = async () => { await supabaseClient.auth.signOut(); };
  const refreshProfile = () => { if (session) loadProfile(session.user.id); };

  return { session, profile, profileLoading, login, logout, refreshProfile };
}

function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!username.trim() || !password) { setError('Ingresa usuario y contraseña.'); return; }
    setBusy(true); setError('');
    const err = await onLogin(username, password);
    if (err) setError('Usuario o contraseña incorrectos.');
    setBusy(false);
  };

  return (
    <div style={{ minHeight: '100vh', background: '#121212', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
      <form onSubmit={submit} style={{ background: '#1C1B19', border: '1px solid #333330', borderRadius: 4, padding: 28, width: '100%', maxWidth: 360 }}>
        <img src={`data:image/png;base64,${LOGO_B64}`} alt="Occicon" style={{ height: 40, marginBottom: 20 }} />
        <div style={{ color: '#F2F0EB', fontWeight: 700, fontSize: 16, marginBottom: 16 }}>Iniciar sesión</div>
        <Field label="Usuario">
          <input style={inputStyle} value={username} onChange={e => setUsername(e.target.value)} autoCapitalize="none" autoComplete="username" />
        </Field>
        <Field label="Contraseña">
          <input type="password" style={inputStyle} value={password} onChange={e => setPassword(e.target.value)} autoComplete="current-password" />
        </Field>
        {error && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 10 }}>{error}</div>}
        <Btn variant="accent" type="submit" disabled={busy} style={{ width: '100%', justifyContent: 'center' }}>
          <Lock size={14} /> {busy ? 'Entrando…' : 'Entrar'}
        </Btn>
      </form>
    </div>
  );
}

function ForceChangePassword({ onDone, onLogout }) {
  const [pw1, setPw1] = useState('');
  const [pw2, setPw2] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (pw1.length < 4) { setError('La contraseña debe tener al menos 4 caracteres.'); return; }
    if (pw1 !== pw2) { setError('Las contraseñas no coinciden.'); return; }
    setBusy(true); setError('');
    try {
      const { error: updErr } = await supabaseClient.auth.updateUser({ password: pw1 });
      if (updErr) throw updErr;
      const { data: { user } } = await supabaseClient.auth.getUser();
      await supabaseClient.from('profiles').update({ must_change_password: false }).eq('id', user.id);
      onDone();
    } catch (e) {
      setError('No se pudo cambiar la contraseña: ' + (e.message || e));
    }
    setBusy(false);
  };

  return (
    <div style={{ minHeight: '100vh', background: '#121212', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
      <form onSubmit={submit} style={{ background: '#1C1B19', border: '1px solid #6B3226', borderRadius: 4, padding: 28, width: '100%', maxWidth: 380 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: '#F2A900', fontWeight: 700, fontSize: 16, marginBottom: 8 }}>
          <Lock size={16} /> Cambio de contraseña obligatorio
        </div>
        <div style={{ color: '#B9B4A8', fontSize: 12, marginBottom: 18 }}>
          Es tu primer ingreso (o tu contraseña fue reiniciada). Define una contraseña nueva antes de continuar.
        </div>
        <Field label="Nueva contraseña">
          <input type="password" style={inputStyle} value={pw1} onChange={e => setPw1(e.target.value)} autoComplete="new-password" />
        </Field>
        <Field label="Confirmar nueva contraseña">
          <input type="password" style={inputStyle} value={pw2} onChange={e => setPw2(e.target.value)} autoComplete="new-password" />
        </Field>
        {error && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 10 }}>{error}</div>}
        <div style={{ display: 'flex', gap: 8 }}>
          <Btn variant="accent" type="submit" disabled={busy} style={{ flex: 1, justifyContent: 'center' }}>
            <Check size={14} /> {busy ? 'Guardando…' : 'Guardar y continuar'}
          </Btn>
          <Btn variant="ghost" type="button" onClick={onLogout}>Salir</Btn>
        </div>
      </form>
    </div>
  );
}

  const bombasDisp = bombas.filter(u => !data.dispatches[u.id] || data.dispatches[u.id].status === 'disponible').length;
  const ordersToday = data.orders.filter(o => o.date === todayStr()).length;
  const m3Today = data.orders.filter(o => o.date === todayStr()).reduce((s, o) => s + Number(o.volumeM3), 0);

  // ---- Centro de alertas: consolida los avisos de toda la app ----
  const today = todayStr();
  const in7days = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
  const mantenimientoVencido = (data.maintenance || []).filter(m => m.proximaFecha && m.proximaFecha <= in7days);
  const seguimientoPendiente = (data.clients || []).filter(c => c.proximoSeguimiento && c.proximoSeguimiento <= today);

  const facturasPendientes = (data.invoices || []).filter(f => f.estado === 'Pendiente');

  const alertas = [

              const d = data.dispatches[u.id]; const status = d ? d.status : 'disponible';

  );

function SiloBar({ v }) {
  const hasMin = v.min > 0;
  const pct = hasMin ? Math.min(100, Math.round((v.qty / (v.min * 3)) * 100)) : null;
  const low = v.qty <= v.min;
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 3 }}>
        <span style={{ fontWeight: 600, color: '#F2F0EB' }}>{v.label}</span>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: low ? '#B54834' : '#B9B4A8' }}>{v.qty} {v.unit}{hasMin ? ` · ${pct}%` : ''} {low ? '· bajo' : ''}</span>
      </div>
      <div style={{ height: 8, background: '#333330', borderRadius: 4, overflow: 'hidden' }}>
        <div style={{ width: hasMin ? `${pct}%` : '100%', height: '100%', background: low ? '#B54834' : v.color, transition: 'width 0.3s' }} />
      </div>
    </div>
  );
}

function Inventario({ data, setData, username }) {
  const [editing, setEditing] = useState(null);
  const [amount, setAmount] = useState('');
  const [priceAmount, setPriceAmount] = useState('');
  const [editingCost, setEditingCost] = useState(null);
  const [costAmount, setCostAmount] = useState('');
  const [showAdd, setShowAdd] = useState(false);
  const [newMat, setNewMat] = useState({ nombre: '', unidad: '', cantidad: '', minimo: '' });
  const [addError, setAddError] = useState('');

  const applyAmount = (key) => {
    const delta = parseFloat(amount);
    const price = parseFloat(priceAmount);
    if (isNaN(delta)) { setEditing(null); setAmount(''); setPriceAmount(''); return; }
    const label = data.inventory[key].label;
    setData(d => {
      const item = d.inventory[key];
      const newQty = Math.max(0, +(item.qty + delta).toFixed(2));
      let newCost = item.costoUnitario || 0;
      // Si es una recepción (suma) con precio indicado, recalcula el costo como promedio ponderado
      if (delta > 0 && !isNaN(price) && price >= 0) {
        const totalActual = item.qty * (item.costoUnitario || 0);
        const totalNuevo = delta * price;
        newCost = newQty > 0 ? +((totalActual + totalNuevo) / newQty).toFixed(4) : newCost;
      }
      return { ...d, inventory: { ...d.inventory, [key]: { ...item, qty: newQty, costoUnitario: newCost } } };
    });
    logAudit(setData, username, 'Ajuste de inventario', `${label}: ${delta > 0 ? '+' : ''}${delta}${price ? ` a ${fmtQ(price)}/u` : ''}`);
    setAmount(''); setPriceAmount(''); setEditing(null);
  };

  const setToZero = (key) => {
    logAudit(setData, username, 'Material en 0', data.inventory[key].label);
    setData(d => ({ ...d, inventory: { ...d.inventory, [key]: { ...d.inventory[key], qty: 0 } } }));
  };
  const applyCost = (key) => {
    const n = parseFloat(costAmount);
    if (!isNaN(n) && n >= 0) {
      setData(d => ({ ...d, inventory: { ...d.inventory, [key]: { ...d.inventory[key], costoUnitario: n } } }));
      logAudit(setData, username, 'Cambio de costo unitario', `${data.inventory[key].label}: ${fmtQ(n)}`);
    }
    setCostAmount(''); setEditingCost(null);
  };
  const resetAll = () => {
    if (!window.confirm('Esto pone TODOS los materiales en 0. Úsalo solo para borrar datos de prueba antes de empezar a usar la app en serio. ¿Continuar?')) return;
    setData(d => {
      const inventory = {};
      Object.entries(d.inventory).forEach(([k, v]) => { inventory[k] = { ...v, qty: 0 }; });
      return { ...d, inventory };
    });
    logAudit(setData, username, 'Reinició todo el inventario a 0', '');
  };

  const COLORS_POOL = ['#5C8AA6', '#C9A876', '#8A5CA6', '#4B7B5E', '#B54834', '#7A7264'];
  const addMaterial = () => {
    if (!newMat.nombre.trim()) { setAddError('Ponle un nombre al material.'); return; }
    const nombreNormalizado = newMat.nombre.trim().toLowerCase();
    const yaExiste = Object.values(data.inventory).some(v => v.label.trim().toLowerCase() === nombreNormalizado);
    if (yaExiste) {
      setAddError(`Ya existe un material llamado "${newMat.nombre.trim()}". Para agregarle cantidad, ciérralo y usa "Recepción / ajuste" en su tarjeta — no crees uno nuevo.`);
      return;
    }
    const slug = newMat.nombre.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    const key = `${slug || 'material'}_${Date.now()}`;
    const qty = parseFloat(newMat.cantidad) || 0;
    const min = parseFloat(newMat.minimo) || 0;
    setData(d => ({
      ...d,
      inventory: {
        ...d.inventory,
        [key]: {
          label: newMat.nombre.trim(), unit: newMat.unidad.trim() || 'unidad', qty, min,
          color: COLORS_POOL[Object.keys(d.inventory).length % COLORS_POOL.length], costoUnitario: 0,
        },
      },
    }));
    logAudit(setData, username, 'Nuevo material creado', newMat.nombre.trim());
    setNewMat({ nombre: '', unidad: '', cantidad: '', minimo: '' });
    setAddError('');
    setShowAdd(false);
  };

  const BASE_MATERIALS = ['cemento', 'arena', 'grava', 'aditivo', 'agua'];
  const deleteMaterial = (key) => {
    if (BASE_MATERIALS.includes(key)) return; // los 5 de fábrica no se pueden borrar
    const item = data.inventory[key];
    if (!window.confirm(`¿Eliminar "${item.label}" del inventario? Se puede restaurar desde la Papelera.`)) return;
    setData(d => {
      const inventory = { ...d.inventory };
      delete inventory[key];
      return { ...d, inventory };
    });
    moveToTrash(setData, username, 'material', { key, ...item }, item.label);
  };

  return (
    <div>
      <Eyebrow>Materia prima</Eyebrow>
      <div style={{ display: 'flex', flexDirection: window.innerWidth > 640 ? 'row' : 'column', justifyContent: 'space-between', alignItems: window.innerWidth > 640 ? 'flex-end' : 'stretch', flexWrap: 'wrap', gap: 10 }}>
        <H1>Inventario</H1>
        <div style={{ display: 'flex', flexDirection: window.innerWidth > 640 ? 'row' : 'column', gap: 8 }}>
          <Btn variant="accent" onClick={() => setShowAdd(s => !s)} style={{ justifyContent: 'center' }}><Plus size={14} /> Nuevo material</Btn>
          <Btn variant="ghost" onClick={resetAll} style={{ borderColor: '#6B3226', color: '#B54834', justifyContent: 'center' }}>
            <AlertTriangle size={14} /> Reiniciar todo a 0
          </Btn>
        </div>
      </div>
      <div style={{ fontSize: 12, color: '#A39D93', marginTop: 6 }}>
        El costo por unidad se recalcula solo (promedio ponderado) cada vez que registras una recepción con precio.
      </div>

      {showAdd && (
        <Card style={{ marginTop: 16 }}>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Agregar material nuevo</div>
          <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
            Útil para materiales que no vienen por defecto, por ejemplo un segundo tipo de arena.
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 700 ? '2fr 1fr 1fr 1fr' : '1fr', gap: 8, marginBottom: 10 }}>
            <input style={inputStyle} placeholder="Nombre (ej. Arena fina)" value={newMat.nombre} onChange={e => setNewMat(m => ({ ...m, nombre: e.target.value }))} />
            <input style={inputStyle} placeholder="Unidad (ej. m³)" value={newMat.unidad} onChange={e => setNewMat(m => ({ ...m, unidad: e.target.value }))} />
            <input type="number" min="0" style={inputStyle} placeholder="Cantidad inicial" value={newMat.cantidad} onChange={e => setNewMat(m => ({ ...m, cantidad: e.target.value }))} />
            <input type="number" min="0" style={inputStyle} placeholder="Mínimo" value={newMat.minimo} onChange={e => setNewMat(m => ({ ...m, minimo: e.target.value }))} />
          </div>
          {addError && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{addError}</div>}
          <div style={{ fontSize: 11, color: '#07E55E', marginBottom: 10 }}>
            En cuanto lo guardes, este material aparecerá disponible en Diseños de mezcla para que le asignes una cantidad por m³ en las recetas que quieras.
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <Btn variant="accent" onClick={addMaterial}><Check size={14} /> Guardar material</Btn>
            <Btn variant="ghost" onClick={() => { setShowAdd(false); setAddError(''); }}>Cancelar</Btn>
          </div>
        </Card>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: 12, marginTop: 20 }}>
        {Object.entries(data.inventory).map(([key, v]) => (
          <Card key={key}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <div style={{ fontWeight: 700, color: '#F2F0EB' }}>{v.label}</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                {v.qty <= v.min && <AlertTriangle size={14} color="#B54834" />}
                {!BASE_MATERIALS.includes(key) && (
                  <button onClick={() => deleteMaterial(key)} title="Eliminar material" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#A39D93' }}>
                    <Trash2 size={13} />
                  </button>
                )}
              </div>
            </div>
            <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 900, fontSize: 32, color: '#F2F0EB', margin: '6px 0' }}>
              {v.qty} <span style={{ fontSize: 16, color: '#A39D93' }}>{v.unit}</span>
            </div>
            <div style={{ fontSize: 11, color: '#A39D93', marginBottom: 6 }}>mínimo: {v.min} {v.unit}</div>

            {editingCost === key ? (
              <div style={{ display: 'flex', gap: 6, marginBottom: 10 }}>
                <input autoFocus type="number" min="0" step="0.01" value={costAmount} onChange={e => setCostAmount(e.target.value)}
                  placeholder="Q por unidad" style={{ ...inputStyle, flex: 1 }} />
                <Btn variant="accent" onClick={() => applyCost(key)}><Check size={14} /></Btn>
                <Btn variant="ghost" onClick={() => { setEditingCost(null); setCostAmount(''); }}><X size={14} /></Btn>
              </div>
            ) : (
              <Btn variant="ghost" onClick={() => { setEditingCost(key); setCostAmount(v.costoUnitario || ''); }} style={{ marginBottom: 10, width: '100%', justifyContent: 'space-between' }}>
                <span>Costo: {fmtQ((v.costoUnitario || 0))} / {v.unit}</span>
                <Pencil size={12} />
              </Btn>
            )}

            {editing === key ? (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                <input autoFocus type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="cantidad (+ recibido / - ajuste)" style={inputStyle} />
                <input type="number" min="0" step="0.01" value={priceAmount} onChange={e => setPriceAmount(e.target.value)} placeholder="precio pagado por unidad (si recibiste)" style={inputStyle} />
                <div style={{ display: 'flex', gap: 6 }}>
                  <Btn variant="accent" onClick={() => applyAmount(key)} style={{ flex: 1, justifyContent: 'center' }}><Check size={14} /> Guardar</Btn>
                  <Btn variant="ghost" onClick={() => { setEditing(null); setAmount(''); setPriceAmount(''); }}><X size={14} /></Btn>
                </div>
              </div>
            ) : (
              <div style={{ display: 'flex', gap: 6 }}>
                <Btn variant="ghost" onClick={() => setEditing(key)}>Recepción / ajuste</Btn>
                <Btn variant="ghost" onClick={() => setToZero(key)}>0</Btn>
              </div>
            )}
          </Card>
        ))}
      </div>
    </div>
  );
}

function DisenosMezcla({ data, setData }) {
  const materialKeys = Object.keys(data.inventory);
  const emptyQtys = () => Object.fromEntries(materialKeys.map(k => [k, '']));
  const [form, setForm] = useState({ nombre: '', aditivoNombre: '', precioM3: '', qtys: emptyQtys() });
  const [error, setError] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({ nombre: '', aditivoNombre: '', precioM3: '', qtys: emptyQtys() });
  const [editError, setEditError] = useState('');

  const setQty = (setter) => (key) => (e) => setter(f => ({ ...f, qtys: { ...f.qtys, [key]: e.target.value } }));

  const buildMateriales = (qtys) => {
    const materiales = {};
    for (const key of materialKeys) {
      const n = parseFloat(qtys[key]);
      if (!isNaN(n) && n > 0) materiales[key] = n;
    }
    return materiales;
  };

  const add = () => {
    if (!form.nombre.trim()) { setError('Ponle un nombre al diseño (ej. f\'c 250).'); return; }
    const materiales = buildMateriales(form.qtys);
    if (Object.keys(materiales).length === 0) { setError('Indica la cantidad de al menos un material.'); return; }
    const precio = form.precioM3 === '' ? 0 : parseFloat(form.precioM3);
    setData(d => ({
      ...d,
      recipes: [...d.recipes, { id: `r${Date.now()}`, name: form.nombre.trim(), aditivoNombre: form.aditivoNombre.trim(), precioM3: isNaN(precio) ? 0 : precio, materiales }],
    }));
    setForm({ nombre: '', aditivoNombre: '', precioM3: '', qtys: emptyQtys() });
    setError('');
  };

  const remove = (id) => setData(d => ({ ...d, recipes: d.recipes.filter(r => r.id !== id) }));

  const startEdit = (r) => {
    setEditingId(r.id);
    const qtys = emptyQtys();
    Object.entries(r.materiales || {}).forEach(([k, v]) => { qtys[k] = String(v); });
    setEditForm({ nombre: r.name, aditivoNombre: r.aditivoNombre || '', precioM3: r.precioM3 || '', qtys });
    setEditError('');
  };
  const cancelEdit = () => { setEditingId(null); setEditError(''); };
  const saveEdit = (id) => {
    if (!editForm.nombre.trim()) { setEditError('Ponle un nombre al diseño.'); return; }
    const materiales = buildMateriales(editForm.qtys);
    if (Object.keys(materiales).length === 0) { setEditError('Indica la cantidad de al menos un material.'); return; }
    const precio = editForm.precioM3 === '' ? 0 : parseFloat(editForm.precioM3);
    setData(d => ({
      ...d,
      recipes: d.recipes.map(r => r.id === id
        ? { ...r, name: editForm.nombre.trim(), aditivoNombre: editForm.aditivoNombre.trim(), precioM3: isNaN(precio) ? 0 : precio, materiales }
        : r),
    }));
    setEditingId(null);
    setEditError('');
  };

  const materialLabel = (key) => (data.inventory[key] || {}).label || key;
  const materialUnit = (key) => (data.inventory[key] || {}).unit || '';

  const MaterialInputs = ({ qtys, onChange }) => (
    <>
      {materialKeys.map(key => (
        <Field key={key} label={`${materialLabel(key)} (${materialUnit(key)} por m³)`}>
          <input type="number" min="0" step="0.0001" style={inputStyle} value={qtys[key]} onChange={onChange(key)} placeholder="0" />
        </Field>
      ))}
    </>
  );

  return (
    <div>
      <Eyebrow>Fórmulas de dosificación</Eyebrow>
      <H1>Diseños de mezcla</H1>
      <div style={{ fontSize: 12, color: '#A39D93', marginTop: 6 }}>
        Los campos de materiales se generan solos según lo que exista en Inventario — si agregas un material nuevo ahí, aparece aquí automáticamente.
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 800 ? '1fr 1.4fr' : '1fr', gap: 16, marginTop: 20 }}>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 4 }}>Nuevo diseño</div>
          <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 12 }}>Cantidades por 1 m³ de concreto, en la misma unidad que tiene cada material en Inventario.</div>
          <Field label="Nombre del diseño (ej. f'c 250)">
            <input style={inputStyle} value={form.nombre} onChange={e => setForm(f => ({ ...f, nombre: e.target.value }))} />
          </Field>
          <MaterialInputs qtys={form.qtys} onChange={setQty(setForm)} />
          <Field label="Nombre o clase de aditivo (opcional, ej. plastificante Sika)">
            <input style={inputStyle} value={form.aditivoNombre} onChange={e => setForm(f => ({ ...f, aditivoNombre: e.target.value }))} placeholder="ej. Superplastificante Sikament" />
          </Field>
          <Field label="Precio de venta (Q por m³)">
            <input type="number" min="0" step="0.01" style={inputStyle} value={form.precioM3} onChange={e => setForm(f => ({ ...f, precioM3: e.target.value }))} placeholder="ej. 650" />
          </Field>
          {error && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{error}</div>}
          <Btn variant="accent" onClick={add}><Plus size={14} /> Guardar diseño</Btn>
        </Card>

        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Diseños guardados</div>
          {data.recipes.length === 0 && <div style={{ color: '#A39D93', fontSize: 13 }}>Aún no hay diseños de mezcla.</div>}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {data.recipes.map(r => (
              <div key={r.id} style={{ border: '1px solid #333330', borderRadius: 4, padding: 12 }}>
                {editingId === r.id ? (
                  <div>
                    <Field label="Nombre del diseño">
                      <input style={inputStyle} value={editForm.nombre} onChange={e => setEditForm(f => ({ ...f, nombre: e.target.value }))} />
                    </Field>
                    <MaterialInputs qtys={editForm.qtys} onChange={setQty(setEditForm)} />
                    <Field label="Nombre o clase de aditivo (opcional)">
                      <input style={inputStyle} value={editForm.aditivoNombre} onChange={e => setEditForm(f => ({ ...f, aditivoNombre: e.target.value }))} />
                    </Field>
                    <Field label="Precio de venta (Q por m³)">
                      <input type="number" min="0" step="0.01" style={inputStyle} value={editForm.precioM3} onChange={e => setEditForm(f => ({ ...f, precioM3: e.target.value }))} />
                    </Field>
                    {editError && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{editError}</div>}
                    <div style={{ display: 'flex', gap: 6 }}>
                      <Btn variant="accent" onClick={() => saveEdit(r.id)}><Check size={14} /> Guardar</Btn>
                      <Btn variant="ghost" onClick={cancelEdit}><X size={14} /> Cancelar</Btn>
                    </div>
                  </div>
                ) : (
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                      <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
                        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 900, fontSize: 20, color: '#F2F0EB' }}>{r.name}</div>
                        <div style={{ fontSize: 12, color: '#07E55E', fontWeight: 700 }}>{fmtQ((r.precioM3 || 0))}/m³</div>
                      </div>
                      <div style={{ display: 'flex', gap: 12 }}>
                        <button onClick={() => startEdit(r)} title="Editar diseño" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B9B4A8' }}><Pencil size={15} /></button>
                        <button onClick={() => remove(r.id)} title="Eliminar diseño" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={15} /></button>
                      </div>
                    </div>
                    <div style={{ fontSize: 12, color: '#B9B4A8', fontFamily: "'IBM Plex Mono', monospace" }}>
                      {Object.entries(r.materiales || {}).map(([k, v]) => `${v} ${materialUnit(k)} ${materialLabel(k)}`).join(' · ')}
                      {r.aditivoNombre ? ` (${r.aditivoNombre})` : ''}
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}

function Produccion({ data, setData, username }) {
  const [form, setForm] = useState({ recipeId: data.recipes[0]?.id || '', clientId: '', volumeM3: '', vendedor: '', pctVendedor: '', distanciaKm: '', pctDistancia: '', precioDiesel: '' });
  const [error, setError] = useState('');
  const [showDieselConfig, setShowDieselConfig] = useState(false);
  const [editingOrderId, setEditingOrderId] = useState(null);
  const [printingOrderId, setPrintingOrderId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const [editError, setEditError] = useState('');

  const dCfg = data.dieselConfig;
  const recipe = data.recipes.find(r => r.id === form.recipeId);
  const vol = parseFloat(form.volumeM3) || 0;
  const pctDist = parseFloat(form.pctDistancia) || 0;
  const pctVend = parseFloat(form.pctVendedor) || 0;
  const distKm = parseFloat(form.distanciaKm) || 0;
  const precioDieselUsado = form.precioDiesel !== '' ? (parseFloat(form.precioDiesel) || 0) : (parseFloat(dCfg.precioGalon) || 0);
  const dieselGalones = distKm > 0 ? (((distKm * (parseFloat(dCfg.coefKm) || 0)) + (parseFloat(dCfg.coefBase) || 0)) * vol) : 0;
  const dieselCosto = dieselGalones * precioDieselUsado;
  const need = recipe
    ? Object.fromEntries(Object.entries(recipe.materiales || {}).map(([k, cantPorM3]) => [k, cantPorM3 * vol]))
    : null;
  const needEntries = need ? Object.entries(need).filter(([k]) => data.inventory[k]) : [];
  const faltantes = needEntries.filter(([k, v]) => data.inventory[k].qty < v);
  const canProduce = need && needEntries.length > 0 && faltantes.length === 0 && vol > 0;
  const costoEstimado = needEntries.reduce((s, [k, v]) => s + v * (data.inventory[k].costoUnitario || 0), 0);
  const ingresoBase = recipe ? (recipe.precioM3 || 0) * vol : 0;
  const recargoDistancia = ingresoBase * (pctDist / 100);
  const ingresoConDistancia = ingresoBase + recargoDistancia;
  const comisionVendedor = ingresoConDistancia * (pctVend / 100);
  const utilidadEstimada = ingresoConDistancia - costoEstimado - comisionVendedor - dieselCosto;

  const updateDieselConfig = (patch) => setData(d => ({ ...d, dieselConfig: { ...d.dieselConfig, ...patch } }));

  const createOrder = () => {
    if (!recipe || vol <= 0) { setError('Indica una receta y un volumen válido.'); return; }
    if (!canProduce) { setError('No hay suficiente materia prima para este volumen.'); return; }
    const id = `OP-${String(data.nextOrderNum).padStart(4, '0')}`;
    const costo = +costoEstimado.toFixed(2);
    const ingreso = +ingresoConDistancia.toFixed(2);
    const comision = +comisionVendedor.toFixed(2);
    const diesel = +dieselCosto.toFixed(2);
    setData(d => {
      const inventory = { ...d.inventory };
      needEntries.forEach(([k, v]) => {
        inventory[k] = { ...inventory[k], qty: +(inventory[k].qty - v).toFixed(2) };
      });
      return {
        ...d, nextOrderNum: d.nextOrderNum + 1,
        orders: [...d.orders, {
          id, date: todayStr(), recipeId: recipe.id, recipeName: recipe.name, clientId: form.clientId || null,
          volumeM3: vol, status: 'producido',
          vendedor: form.vendedor.trim(), pctVendedor: pctVend, distanciaKm: form.distanciaKm ? parseFloat(form.distanciaKm) : null, pctDistancia: pctDist,
          ingresoBase: +ingresoBase.toFixed(2), comisionVendedor: comision, dieselCosto: diesel, precioDieselGalon: precioDieselUsado,
          costo, ingreso, utilidad: +(ingreso - costo - comision - diesel).toFixed(2),
        }],
        inventory,
      };
    });
    logAudit(setData, username, 'Orden de producción creada', `${id} · ${recipe.name} · ${vol} m³ · ${fmtQ(ingreso)}`);
    setForm({ recipeId: data.recipes[0]?.id || '', clientId: '', volumeM3: '', vendedor: '', pctVendedor: '', distanciaKm: '', pctDistancia: '', precioDiesel: '' });
    setError('');
  };

  const removeOrder = (o) => {
    if (!window.confirm(`¿Eliminar la orden ${o.id}? El material consumido se devuelve al inventario.`)) return;
    setData(d => {
      const oldRecipe = d.recipes.find(r => r.id === o.recipeId);
      const inventory = { ...d.inventory };
      if (oldRecipe) {
        Object.entries(oldRecipe.materiales || {}).forEach(([k, cantPorM3]) => {
          if (inventory[k]) inventory[k] = { ...inventory[k], qty: +(inventory[k].qty + cantPorM3 * o.volumeM3).toFixed(2) };
        });
      }
      return { ...d, inventory, orders: d.orders.filter(x => x.id !== o.id) };
    });
    moveToTrash(setData, username, 'orden', o, `${o.id} · ${o.volumeM3} m³`);
  };

  const startEditOrder = (o) => {
    setEditingOrderId(o.id);
    setEditForm({
      recipeId: o.recipeId, clientId: o.clientId || '', volumeM3: String(o.volumeM3),
      vendedor: o.vendedor || '', pctVendedor: String(o.pctVendedor || 0),
      distanciaKm: o.distanciaKm != null ? String(o.distanciaKm) : '', pctDistancia: String(o.pctDistancia || 0),
      precioDiesel: o.precioDieselGalon != null ? String(o.precioDieselGalon) : '',
    });
    setEditError('');
  };
  const cancelEditOrder = () => { setEditingOrderId(null); setEditForm(null); setEditError(''); };

  const saveEditOrder = (o) => {
    const newRecipe = data.recipes.find(r => r.id === editForm.recipeId);
    const newVol = parseFloat(editForm.volumeM3) || 0;
    if (!newRecipe || newVol <= 0) { setEditError('Indica una receta y un volumen válido.'); return; }

    // Simular el inventario disponible si se devolviera lo que esta orden ya había consumido
    const oldRecipe = data.recipes.find(r => r.id === o.recipeId);
    const simQty = {};
    Object.entries(data.inventory).forEach(([k, v]) => { simQty[k] = v.qty; });
    if (oldRecipe) {
      Object.entries(oldRecipe.materiales || {}).forEach(([k, cantPorM3]) => {
        if (simQty[k] != null) simQty[k] += cantPorM3 * o.volumeM3;
      });
    }
    const newNeed = Object.entries(newRecipe.materiales || {}).map(([k, cantPorM3]) => [k, cantPorM3 * newVol]).filter(([k]) => simQty[k] != null);
    const faltan = newNeed.filter(([k, v]) => simQty[k] < v);
    if (faltan.length > 0) {
      setEditError(`No hay suficiente ${materialLabel(faltan[0][0])} para este cambio (necesitas ${faltan[0][1].toFixed(2)} ${materialUnit(faltan[0][0])}, quedarían disponibles ${simQty[faltan[0][0]].toFixed(2)}).`);
      return;
    }

    const pctDistE = parseFloat(editForm.pctDistancia) || 0;
    const pctVendE = parseFloat(editForm.pctVendedor) || 0;
    const distKmE = parseFloat(editForm.distanciaKm) || 0;
    const precioDieselE = editForm.precioDiesel !== '' ? (parseFloat(editForm.precioDiesel) || 0) : (parseFloat(data.dieselConfig.precioGalon) || 0);
    const dGal = distKmE > 0 ? (((distKmE * (parseFloat(data.dieselConfig.coefKm) || 0)) + (parseFloat(data.dieselConfig.coefBase) || 0)) * newVol) : 0;
    const dieselE = dGal * precioDieselE;
    const costoE = newNeed.reduce((s, [k, v]) => s + v * (data.inventory[k].costoUnitario || 0), 0);
    const ingresoBaseE = (newRecipe.precioM3 || 0) * newVol;
    const ingresoConDistE = ingresoBaseE * (1 + pctDistE / 100);
    const comisionE = ingresoConDistE * (pctVendE / 100);

    setData(d => {
      const inventory = { ...d.inventory };
      if (oldRecipe) {
        Object.entries(oldRecipe.materiales || {}).forEach(([k, cantPorM3]) => {
          if (inventory[k]) inventory[k] = { ...inventory[k], qty: +(inventory[k].qty + cantPorM3 * o.volumeM3).toFixed(2) };
        });
      }
      newNeed.forEach(([k, v]) => { inventory[k] = { ...inventory[k], qty: +(inventory[k].qty - v).toFixed(2) }; });

      const orders = d.orders.map(x => x.id === o.id ? {
        ...x, recipeId: newRecipe.id, recipeName: newRecipe.name, clientId: editForm.clientId || null,
        volumeM3: newVol, vendedor: editForm.vendedor.trim(), pctVendedor: pctVendE,
        distanciaKm: editForm.distanciaKm ? distKmE : null, pctDistancia: pctDistE,
        ingresoBase: +ingresoBaseE.toFixed(2), comisionVendedor: +comisionE.toFixed(2), dieselCosto: +dieselE.toFixed(2), precioDieselGalon: precioDieselE,
        costo: +costoE.toFixed(2), ingreso: +ingresoConDistE.toFixed(2),
        utilidad: +(ingresoConDistE - costoE - comisionE - dieselE).toFixed(2),
      } : x);

      return { ...d, inventory, orders };
    });
    logAudit(setData, username, 'Orden de producción editada', `${o.id} · nuevo volumen ${newVol} m³`);
    setEditingOrderId(null);
    setEditForm(null);
    setEditError('');
  };

  const materialLabel = (key) => (data.inventory[key] || {}).label || key;
  const materialUnit = (key) => (data.inventory[key] || {}).unit || '';

  return (
    <div>
      <Eyebrow>Órdenes de producción</Eyebrow>
      <H1>Producción</H1>

      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 800 ? '1fr 1.4fr' : '1fr', gap: 16, marginTop: 16 }}>
        <Card>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <div style={{ fontWeight: 700 }}>Nueva orden</div>
            <button onClick={() => setShowDieselConfig(s => !s)} title="Configurar precio y fórmula de diesel" style={{ background: 'none', border: '1px solid #3D3A34', borderRadius: 3, cursor: 'pointer', color: showDieselConfig ? '#07E55E' : '#A39D93', padding: 6, display: 'flex' }}>
              <Settings size={14} />
            </button>
          </div>
          {showDieselConfig && (
            <div style={{ marginBottom: 14, paddingBottom: 14, borderBottom: '1px solid #333330' }}>
              <div style={{ fontSize: 12, color: '#A39D93', marginBottom: 10 }}>
                Galones de diesel = ((distancia_km × coeficiente por km) + coeficiente base) × volumen (m³). El costo se calcula multiplicando esos galones por el precio del galón.
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 700 ? '1fr 1fr 1fr' : '1fr', gap: 8 }}>
                <Field label="Coeficiente por km">
                  <input type="number" step="0.001" style={inputStyle} value={dCfg.coefKm} onChange={e => updateDieselConfig({ coefKm: e.target.value })} onBlur={e => updateDieselConfig({ coefKm: parseFloat(e.target.value) || 0 })} />
                </Field>
                <Field label="Coeficiente base">
                  <input type="number" step="0.001" style={inputStyle} value={dCfg.coefBase} onChange={e => updateDieselConfig({ coefBase: e.target.value })} onBlur={e => updateDieselConfig({ coefBase: parseFloat(e.target.value) || 0 })} />
                </Field>
                <Field label="Precio por galón (Q)">
                  <input type="number" step="0.01" min="0" style={inputStyle} value={dCfg.precioGalon} onChange={e => updateDieselConfig({ precioGalon: e.target.value })} onBlur={e => updateDieselConfig({ precioGalon: parseFloat(e.target.value) || 0 })} />
                </Field>
              </div>
            </div>
          )}
          <Field label="Receta">
            <select style={inputStyle} value={form.recipeId} onChange={e => setForm(f => ({ ...f, recipeId: e.target.value }))}>
              {data.recipes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
            </select>
          </Field>
          <Field label="Cliente (opcional)">
            <select style={inputStyle} value={form.clientId} onChange={e => setForm(f => ({ ...f, clientId: e.target.value }))}>
              <option value="">—</option>
              {data.clients.map(c => <option key={c.id} value={c.id}>{c.name} · {c.obra}</option>)}
            </select>
          </Field>
          <Field label="Volumen (m³)">
            <input type="number" min="0" style={inputStyle} value={form.volumeM3} onChange={e => setForm(f => ({ ...f, volumeM3: e.target.value }))} placeholder="ej. 7" />
          </Field>
          <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 500 ? '1fr 1fr' : '1fr', gap: 8 }}>
            <Field label="Distancia a la obra (km, opcional)">
              <input type="number" min="0" style={inputStyle} value={form.distanciaKm} onChange={e => setForm(f => ({ ...f, distanciaKm: e.target.value }))} placeholder="ej. 12" />
            </Field>
            <Field label="% recargo por distancia">
              <input type="number" min="0" step="0.1" style={inputStyle} value={form.pctDistancia} onChange={e => setForm(f => ({ ...f, pctDistancia: e.target.value }))} placeholder="ej. 5" />
            </Field>
          </div>
          <Field label={`Precio diesel (Q/galón) — consumo estimado: ${dieselGalones.toFixed(2)} gal`}>
            <input type="number" min="0" step="0.01" style={inputStyle} value={form.precioDiesel} onChange={e => setForm(f => ({ ...f, precioDiesel: e.target.value }))} placeholder={`ej. ${(parseFloat(dCfg.precioGalon) || 0).toFixed(2)}`} />
          </Field>
          {distKm > 0 && (
            <div style={{ fontSize: 11, color: '#A39D93', marginTop: -6, marginBottom: 10 }}>Costo de diesel para esta orden: {fmtQ(dieselCosto)}</div>
          )}
          <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 500 ? '1fr 1fr' : '1fr', gap: 8 }}>
            <Field label="Vendedor (opcional)">
              <input style={inputStyle} value={form.vendedor} onChange={e => setForm(f => ({ ...f, vendedor: e.target.value }))} />
            </Field>
            <Field label="% comisión vendedor">
              <input type="number" min="0" step="0.1" style={inputStyle} value={form.pctVendedor} onChange={e => setForm(f => ({ ...f, pctVendedor: e.target.value }))} placeholder="ej. 3" />
            </Field>
          </div>
          {needEntries.length > 0 && vol > 0 && (
            <div style={{ fontSize: 12, color: '#B9B4A8', fontFamily: "'IBM Plex Mono', monospace", background: '#201E1B', padding: 10, borderRadius: 3, marginBottom: 10 }}>
              Consumo estimado: {needEntries.map(([k, v]) => `${v.toFixed(2)} ${materialUnit(k)} ${materialLabel(k)}`).join(' · ')}{dieselGalones > 0 && ` · ${dieselGalones.toFixed(2)} gal Diesel`}
              <div style={{ marginTop: 6, paddingTop: 6, borderTop: '1px solid #333330' }}>
                Precio base: {fmtQ(ingresoBase)}{pctDist > 0 && <> · Recargo distancia ({pctDist}%): {fmtQ(recargoDistancia)}</>}
              </div>
              <div>
                Ingreso total: <span style={{ color: '#07E55E' }}>{fmtQ(ingresoConDistancia)}</span>
                {pctVend > 0 && <> · Comisión vendedor ({pctVend}%): <span style={{ color: '#B54834' }}>{fmtQ(comisionVendedor)}</span></>}
              </div>
              <div>
                Costo materiales: <span style={{ color: '#B54834' }}>{fmtQ(costoEstimado)}</span>
                {dieselCosto > 0 && <> · Diesel: <span style={{ color: '#B54834' }}>{fmtQ(dieselCosto)}</span></>}
                {' '}· Utilidad neta: <span style={{ color: utilidadEstimada >= 0 ? '#07E55E' : '#B54834' }}>{fmtQ(utilidadEstimada)}</span>
              </div>
            </div>
          )}
          {faltantes.length > 0 && vol > 0 && (
            <div style={{ fontSize: 12, color: '#B54834', background: '#241511', border: '1px solid #6B3226', borderRadius: 3, padding: 10, marginBottom: 10 }}>
              <strong>No se puede registrar — falta material:</strong><br />
              {faltantes.map(([k, v]) => (
                <div key={k}>{materialLabel(k)}: necesitas {v.toFixed(2)} {materialUnit(k)}, tienes {data.inventory[k].qty} {materialUnit(k)}</div>
              ))}
            </div>
          )}
          {error && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{error}</div>}
          <Btn variant="accent" onClick={createOrder} disabled={!canProduce} style={{ width: '100%', justifyContent: 'center' }}><Plus size={14} /> Registrar producción</Btn>
        </Card>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Órdenes recientes</div>
          {data.orders.length === 0 && <div style={{ color: '#A39D93', fontSize: 13 }}>Aún no hay órdenes registradas.</div>}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {[...data.orders].reverse().map(o => (
              <div key={o.id} style={{ border: '1px solid #333330', borderRadius: 4, padding: 10 }}>
                {editingOrderId === o.id ? (
                  <div>
                    <Field label="Receta">
                      <select style={inputStyle} value={editForm.recipeId} onChange={e => setEditForm(f => ({ ...f, recipeId: e.target.value }))}>
                        {data.recipes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                      </select>
                    </Field>
                    <Field label="Cliente">
                      <select style={inputStyle} value={editForm.clientId} onChange={e => setEditForm(f => ({ ...f, clientId: e.target.value }))}>
                        <option value="">—</option>
                        {data.clients.map(c => <option key={c.id} value={c.id}>{c.name} · {c.obra}</option>)}
                      </select>
                    </Field>
                    <Field label="Volumen (m³)">
                      <input type="number" min="0" style={inputStyle} value={editForm.volumeM3} onChange={e => setEditForm(f => ({ ...f, volumeM3: e.target.value }))} />
                    </Field>
                    <Field label="Distancia (km)">
                      <input type="number" min="0" style={inputStyle} value={editForm.distanciaKm} onChange={e => setEditForm(f => ({ ...f, distanciaKm: e.target.value }))} />
                    </Field>
                    <Field label="Precio diesel (Q/galón)">
                      <input type="number" min="0" step="0.01" style={inputStyle} value={editForm.precioDiesel} onChange={e => setEditForm(f => ({ ...f, precioDiesel: e.target.value }))} placeholder={`ej. ${(parseFloat(data.dieselConfig.precioGalon) || 0).toFixed(2)}`} />
                    </Field>
                    <Field label="% recargo por distancia">
                      <input type="number" min="0" step="0.1" style={inputStyle} value={editForm.pctDistancia} onChange={e => setEditForm(f => ({ ...f, pctDistancia: e.target.value }))} />
                    </Field>
                    <Field label="Vendedor">
                      <input style={inputStyle} value={editForm.vendedor} onChange={e => setEditForm(f => ({ ...f, vendedor: e.target.value }))} />
                    </Field>
                    <Field label="% comisión vendedor">
                      <input type="number" min="0" step="0.1" style={inputStyle} value={editForm.pctVendedor} onChange={e => setEditForm(f => ({ ...f, pctVendedor: e.target.value }))} />
                    </Field>
                    {editError && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{editError}</div>}
                    <div style={{ display: 'flex', gap: 6 }}>
                      <Btn variant="accent" onClick={() => saveEditOrder(o)}><Check size={14} /> Guardar</Btn>
                      <Btn variant="ghost" onClick={cancelEditOrder}><X size={14} /> Cancelar</Btn>
                    </div>
                  </div>
                ) : (
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <div>
                      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: '#F2F0EB' }}>{o.id}</div>
                      <div style={{ fontSize: 12, color: '#A39D93' }}>{o.recipeName} · {o.date}</div>
                      {o.ingreso != null && <div style={{ fontSize: 11, color: '#A39D93', fontFamily: "'IBM Plex Mono', monospace" }}>{fmtQ(o.ingreso)} ingreso · {fmtQ(o.utilidad)} utilidad{o.vendedor ? ` · ${o.vendedor}` : ''}</div>}
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div style={{ fontWeight: 700 }}>{o.volumeM3} m³</div>
                      <span style={{ display: 'inline-block', fontSize: 10, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.03em', color: '#07E55E', background: 'rgba(7,229,94,0.12)', border: '1px solid rgba(7,229,94,0.3)', borderRadius: 20, padding: '2px 8px', marginBottom: 6 }}>{o.status}</span>
                      <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                        <button onClick={() => setPrintingOrderId(o.id)} title="Imprimir / PDF" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#07E55E' }}><FileText size={14} /></button>
                        <button onClick={() => startEditOrder(o)} title="Editar" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B9B4A8' }}><Pencil size={14} /></button>
                        <button onClick={() => removeOrder(o)} title="Eliminar" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={14} /></button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </Card>
      </div>

      {printingOrderId && (
        <PrintableOrder
          order={data.orders.find(o => o.id === printingOrderId)}
          client={data.clients.find(c => c.id === (data.orders.find(o => o.id === printingOrderId) || {}).clientId)}
          company={data.company}
          onClose={() => setPrintingOrderId(null)}
        />
      )}
    </div>
  );
}

const QUOTE_ESTADOS = ['Pendiente', 'Aceptada', 'Rechazada', 'Vencida'];
const QUOTE_COLORS = { Pendiente: '#F2A900', Aceptada: '#07E55E', Rechazada: '#B54834', Vencida: '#A39D93' };

function Cotizaciones({ data, setData, username }) {
  const empty = {
    clientId: '', recipeId: data.recipes[0]?.id || '', volumeM3: '', precioM3: '',
    vigencia: '', notas: '', vendedor: '', vendedorTelefono: '',
    itemNombre: '', itemDescripcion: '', impuestoPct: '', terminosPago: data.company.terminosPago || '',
  };
  const [form, setForm] = useState(empty);
  const [error, setError] = useState('');
  const [showConfig, setShowConfig] = useState(false);
  const [printingId, setPrintingId] = useState(null);

  const recipe = data.recipes.find(r => r.id === form.recipeId);
  const vol = parseFloat(form.volumeM3) || 0;
  const precio = form.precioM3 !== '' ? parseFloat(form.precioM3) : (recipe ? recipe.precioM3 || 0 : 0);
  const subtotal = precio * vol;
  const impPct = parseFloat(form.impuestoPct) || 0;
  const impuestoMonto = subtotal * (impPct / 100);
  const total = subtotal + impuestoMonto;

  const generarNumero = (d) => {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const prefix = `Q-${year}-${month}`;
    const count = d.quotes.filter(q => (q.numero || '').startsWith(prefix)).length + 1;
    return `${prefix}${String(count).padStart(3, '0')}`;
  };

  const add = () => {
    if (!form.clientId) { setError('Selecciona un cliente.'); return; }
    if (!recipe || vol <= 0) { setError('Indica un diseño y un volumen válido.'); return; }
    const id = `COT-${String(data.nextQuoteNum).padStart(4, '0')}`;
    setData(d => ({
      ...d,
      nextQuoteNum: d.nextQuoteNum + 1,
      quotes: [...d.quotes, {
        id, numero: generarNumero(d), fecha: todayStr(), clientId: form.clientId, recipeId: recipe.id, recipeName: recipe.name,
        itemNombre: form.itemNombre.trim() || recipe.name,
        itemDescripcion: form.itemDescripcion.trim(),
        volumeM3: vol, precioM3: precio, impuestoPct: impPct,
        subtotal: +subtotal.toFixed(2), total: +total.toFixed(2),
        vigencia: form.vigencia || null, notas: form.notas.trim(), estado: 'Pendiente',
        vendedor: form.vendedor.trim(), vendedorTelefono: form.vendedorTelefono.trim(),
        terminosPago: form.terminosPago.trim(),
      }],
    }));
    setForm({ ...empty, clientId: form.clientId, vendedor: form.vendedor, vendedorTelefono: form.vendedorTelefono, terminosPago: form.terminosPago });
    setError('');
  };

  const setEstado = (id, estado) => setData(d => ({ ...d, quotes: d.quotes.map(q => q.id === id ? { ...q, estado } : q) }));
  const remove = (id) => {
    const q = data.quotes.find(x => x.id === id);
    setData(d => ({ ...d, quotes: d.quotes.filter(q => q.id !== id) }));
    moveToTrash(setData, username, 'cotizacion', q, q ? (q.numero || q.id) : id);
  };
  const clientOf = (id) => data.clients.find(c => c.id === id);
  const clientName = (id) => (clientOf(id) || {}).name || 'Cliente eliminado';

  const updateCompany = (patch) => setData(d => ({ ...d, company: { ...d.company, ...patch } }));
  const updateNota = (idx, val) => setData(d => ({ ...d, company: { ...d.company, notasPie: d.company.notasPie.map((n, i) => i === idx ? val : n) } }));
  const addNota = () => setData(d => ({ ...d, company: { ...d.company, notasPie: [...d.company.notasPie, ''] } }));
  const removeNota = (idx) => setData(d => ({ ...d, company: { ...d.company, notasPie: d.company.notasPie.filter((_, i) => i !== idx) } }));

  const today = todayStr();
  const vencenPronto = data.quotes.filter(q => q.estado === 'Pendiente' && q.vigencia && q.vigencia <= today);
  const printingQuote = printingId ? data.quotes.find(q => q.id === printingId) : null;

  const doPrint = (id) => {
    setPrintingId(id);
  };

  return (
    <div>
      <Eyebrow>Ventas</Eyebrow>
      <H1>Cotizaciones</H1>

      {vencenPronto.length > 0 && (
        <Card style={{ marginTop: 16, borderColor: '#6B3226', background: '#241511' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: '#B54834', fontWeight: 700, fontSize: 13, marginBottom: 6 }}>
            <AlertTriangle size={15} /> Cotizaciones vencidas sin respuesta
          </div>
          {vencenPronto.map(q => (
            <div key={q.id} style={{ fontSize: 12, color: '#B9B4A8' }}>{q.numero || q.id} · {clientName(q.clientId)} · venció {q.vigencia}</div>
          ))}
        </Card>
      )}

      <Card style={{ marginTop: 16 }}>
        <button onClick={() => setShowConfig(s => !s)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#07E55E', fontSize: 13, fontWeight: 700, padding: 0, display: 'flex', alignItems: 'center', gap: 6 }}>
          <Building size={14} /> Datos de la empresa para la cotización {showConfig ? '(ocultar)' : '(editar)'}
        </button>
        {showConfig && (
          <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid #333330' }}>
            <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 700 ? '1fr 1fr' : '1fr', gap: 8 }}>
              <Field label="Dirección"><input style={inputStyle} value={data.company.direccion} onChange={e => updateCompany({ direccion: e.target.value })} /></Field>
              <Field label="Email"><input style={inputStyle} value={data.company.email} onChange={e => updateCompany({ email: e.target.value })} /></Field>
              <Field label="Teléfono para comprobantes"><input style={inputStyle} value={data.company.telefonoComprobante} onChange={e => updateCompany({ telefonoComprobante: e.target.value })} /></Field>
              <Field label="Términos de pago"><input style={inputStyle} value={data.company.terminosPago} onChange={e => updateCompany({ terminosPago: e.target.value })} /></Field>
              <Field label="Banco"><input style={inputStyle} value={data.company.bancoNombre} onChange={e => updateCompany({ bancoNombre: e.target.value })} /></Field>
              <Field label="Titular de la cuenta"><input style={inputStyle} value={data.company.bancoTitular} onChange={e => updateCompany({ bancoTitular: e.target.value })} /></Field>
              <Field label="Número de cuenta"><input style={inputStyle} value={data.company.bancoCuenta} onChange={e => updateCompany({ bancoCuenta: e.target.value })} /></Field>
            </div>
            <div style={{ fontSize: 12, fontWeight: 600, color: '#B9B4A8', margin: '10px 0 6px' }}>Notas al pie (aparecen en todas las cotizaciones impresas)</div>
            {data.company.notasPie.map((n, i) => (
              <div key={i} style={{ display: 'flex', gap: 6, marginBottom: 6 }}>
                <input style={{ ...inputStyle, flex: 1 }} value={n} onChange={e => updateNota(i, e.target.value)} />
                <button onClick={() => removeNota(i)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><X size={14} /></button>
              </div>
            ))}
            <Btn variant="ghost" onClick={addNota}><Plus size={13} /> Agregar nota</Btn>
          </div>
        )}
      </Card>

      <div style={{ display: 'grid', gridTemplateColumns: window.innerWidth > 800 ? '1fr 1.4fr' : '1fr', gap: 16, marginTop: 16 }}>
        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Nueva cotización</div>
          <Field label="Cliente">
            <select style={inputStyle} value={form.clientId} onChange={e => setForm(f => ({ ...f, clientId: e.target.value }))}>
              <option value="">Selecciona…</option>
              {data.clients.map(c => <option key={c.id} value={c.id}>{c.name} · {c.obra}</option>)}
            </select>
          </Field>
          <Field label="Diseño de mezcla">
            <select style={inputStyle} value={form.recipeId} onChange={e => setForm(f => ({ ...f, recipeId: e.target.value }))}>
              {data.recipes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
            </select>
          </Field>
          <Field label="Nombre del producto en la cotización (opcional, ej. Concreto 4000 PSI)">
            <input style={inputStyle} value={form.itemNombre} onChange={e => setForm(f => ({ ...f, itemNombre: e.target.value }))} placeholder={recipe ? recipe.name : ''} />
          </Field>
          <Field label="Descripción (opcional, ej. Incluye áridos, cemento, aditivo y traslado)">
            <input style={inputStyle} value={form.itemDescripcion} onChange={e => setForm(f => ({ ...f, itemDescripcion: e.target.value }))} />
          </Field>
          <Field label="Volumen / cantidad (m³)">
            <input type="number" min="0" style={inputStyle} value={form.volumeM3} onChange={e => setForm(f => ({ ...f, volumeM3: e.target.value }))} placeholder="ej. 50" />
          </Field>
          <Field label="Precio unitario (Q/m³) — vacío usa el precio del diseño">
            <input type="number" min="0" step="0.01" style={inputStyle} value={form.precioM3} onChange={e => setForm(f => ({ ...f, precioM3: e.target.value }))} placeholder={recipe ? String(recipe.precioM3 || 0) : ''} />
          </Field>
          <Field label="Impuesto (%)">
            <input type="number" min="0" step="0.01" style={inputStyle} value={form.impuestoPct} onChange={e => setForm(f => ({ ...f, impuestoPct: e.target.value }))} placeholder="ej. 0 si el precio ya incluye IVA" />
          </Field>
          <Field label="Vendedor">
            <input style={inputStyle} value={form.vendedor} onChange={e => setForm(f => ({ ...f, vendedor: e.target.value }))} />
          </Field>
          <Field label="Teléfono del vendedor">
            <input style={inputStyle} value={form.vendedorTelefono} onChange={e => setForm(f => ({ ...f, vendedorTelefono: e.target.value }))} />
          </Field>
          <Field label="Vigente hasta (opcional)">
            <input type="date" style={inputStyle} value={form.vigencia} onChange={e => setForm(f => ({ ...f, vigencia: e.target.value }))} />
          </Field>
          <Field label="Términos de pago">
            <input style={inputStyle} value={form.terminosPago} onChange={e => setForm(f => ({ ...f, terminosPago: e.target.value }))} />
          </Field>
          <Field label="Notas internas (opcional, no se imprimen)">
            <input style={inputStyle} value={form.notas} onChange={e => setForm(f => ({ ...f, notas: e.target.value }))} />
          </Field>
          {vol > 0 && (
            <div style={{ fontSize: 12, color: '#B9B4A8', marginBottom: 10, fontFamily: "'IBM Plex Mono', monospace" }}>
              Subtotal: {fmtQ(subtotal)}{impPct > 0 && <> · Impuesto: {fmtQ(impuestoMonto)}</>}
              <div style={{ fontSize: 14, color: '#07E55E', fontWeight: 700, marginTop: 4 }}>Total: {fmtQ(total)}</div>
            </div>
          )}
          {error && <div style={{ color: '#B54834', fontSize: 12, marginBottom: 8 }}>{error}</div>}
          <Btn variant="accent" onClick={add}><Plus size={14} /> Guardar cotización</Btn>
        </Card>

        <Card>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Cotizaciones</div>
          {data.quotes.length === 0 && <div style={{ color: '#A39D93', fontSize: 13 }}>Aún no hay cotizaciones.</div>}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {[...data.quotes].reverse().map(q => (
              <div key={q.id} style={{ border: '1px solid #333330', borderRadius: 4, padding: 12 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                  <div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: '#F2F0EB' }}>{q.numero || q.id}</div>
                    <div style={{ fontWeight: 700, color: '#F2F0EB', marginTop: 2 }}>{clientName(q.clientId)}</div>
                    <div style={{ fontSize: 12, color: '#A39D93' }}>{q.itemNombre || q.recipeName} · {q.volumeM3} m³ · {fmtQ(q.precioM3)}/m³{q.vigencia ? ` · vence ${q.vigencia}` : ''}</div>
                    {q.vendedor && <div style={{ fontSize: 12, color: '#B9B4A8' }}>Vendedor: {q.vendedor}</div>}
                  </div>
                  <div style={{ display: 'flex', gap: 10, flexShrink: 0 }}>
                    <button onClick={() => doPrint(q.id)} title="Imprimir / PDF" style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#07E55E' }}><FileText size={15} /></button>
                    <button onClick={() => remove(q.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#B54834' }}><Trash2 size={15} /></button>
                  </div>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8 }}>
                  <div style={{ fontWeight: 700, color: '#07E55E' }}>{fmtQ(q.total)}</div>
                  <select value={q.estado} onChange={e => setEstado(q.id, e.target.value)}
                    style={{ ...inputStyle, width: 'auto', padding: '4px 8px', fontSize: 11, color: QUOTE_COLORS[q.estado] }}>
                    {QUOTE_ESTADOS.map(e => <option key={e} value={e}>{e}</option>)}
                  </select>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {printingQuote && (
        <PrintableQuote quote={printingQuote} client={clientOf(printingQuote.clientId)} company={data.company} onClose={() => setPrintingId(null)} />
      )}
    </div>
  );
}

function PrintableQuote({ quote, client, company, onClose }) {

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        await new Promise(r => setTimeout(r, 60)); // deja que el DOM fuera de pantalla termine de pintar
        const page1 = document.getElementById('pdf-page-1');
        const page2 = document.getElementById('pdf-page-2');
        if (!page1 || !page2) throw new Error('No se encontró el contenido de la cotización.');

        const opts = { scale: 2, useCORS: true, backgroundColor: '#ffffff' };
        const canvas1 = await html2canvas(page1, opts);
        const canvas2 = await html2canvas(page2, opts);
        if (cancelled) return;

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'letter' });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();

        [canvas1, canvas2].forEach((canvas, i) => {
          if (i > 0) pdf.addPage();
          const imgData = canvas.toDataURL('image/jpeg', 0.92);
          const ratio = Math.min(pageW / canvas.width, pageH / canvas.height);
          const w = canvas.width * ratio;
          const h = canvas.height * ratio;
          pdf.addImage(imgData, 'JPEG', (pageW - w) / 2, 0, w, h);

        if (!cancelled) {
